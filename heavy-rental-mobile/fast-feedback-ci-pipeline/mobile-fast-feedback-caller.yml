# =============================================================================
# Install into: heavy-rental-mobile
# Path:         .github/workflows/mobile-fast-feedback-caller.yml
# =============================================================================
# Fast Feedback CI caller — Integration stage only (no QC / Security / CodeQL /
# mocks). Mirrors the Integration job from integration-pipeline.yml.
#
# Place both files in the Android application repository:
#
#   .github/workflows/mobile-fast-feedback-caller.yml  ← this file (triggers)
#   .github/workflows/fast-feedback-pipeline.yml       ← reusable pipeline
#
# When this runs
# --------------
#   Push to any branch EXCEPT master and develop (feature / bugfix / etc.)
#   Manual workflow_dispatch
#
#   Does NOT run on:
#     - push to master
#     - push to develop
#     - pull_request events (full CI: mobile-ci-caller.yml owns PR → develop;
#       that caller must not uses: this Fast Feedback workflow.
#       On pull_request, Integration waits for / reuses this run for the head SHA.)
#
# Reusable workflow (same repository):
#   ./.github/workflows/fast-feedback-pipeline.yml
#
# Job
# ---
#   1. Integration only  (checkout, JDK 17, Android SDK, Gradle, layout)
#
# Setup
# -----
# 1. Copy into the mobile repo:
#      .github/workflows/mobile-fast-feedback-caller.yml
#      .github/workflows/fast-feedback-pipeline.yml
# 2. No secrets required for this pipeline.
# =============================================================================

name: Fast Feedback CI

on:
  push:
    branches-ignore:
      - master
      - develop
  workflow_dispatch:
    inputs:
      app_repository:
        description: Override application repository (owner/name). Empty = this repo (correct on GitHub; for act against the Android app, set Heavy-Rental/heavy-rental-mobile).
        required: false
        type: string
        default: ""
      app_ref:
        description: Override git ref. Empty = this commit.
        required: false
        type: string
        default: ""

concurrency:
  group: mobile-fast-feedback-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  fast-feedback-pipeline:
    name: Fast feedback pipeline
    uses: ./.github/workflows/fast-feedback-pipeline.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_ref: ${{ inputs.app_ref }}
    # Empty inputs on push: checks out this repo at github.sha (application repo).
    # For act in pipeline-development, pass app_repository=Heavy-Rental/heavy-rental-mobile.
