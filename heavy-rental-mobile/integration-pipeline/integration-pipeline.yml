# =============================================================================
# Heavy Rental Mobile — Integration CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration is highest priority):
#   1. Integration           (HIGHEST) checkout, JDK 17, Android SDK, Gradle, layout
#      On pull_request: reuse a successful Fast Feedback CI run for the PR head
#      SHA instead of repeating those steps (wait if in-flight; inlined pending-run
#      jq, no PENDING_FILTER). Fast Feedback owns the Integration stage on
#      feature-branch pushes; this job must not invoke that workflow.
#      Push to develop / workflow_dispatch / missing Fast Feedback → run fully.
#   2. Quality Control       needs Integration — lintDebug, testDebugUnitTest, assembleDebug
#   3. Security Testing      needs Integration — SAST (Semgrep) + SCA/FS (Trivy)
#   4. CodeQL Analysis       needs Integration — GitHub CodeQL (Java/Kotlin)
#   5. Mock Contract Tests   needs Integration — Mockoon + npm run mock:verify
#                            (ADR 003 returnNotes echo; Prism is not used in CI)
#   6. GitHub Flow CI Gate   aggregate: Integration first, then QC + Security + CodeQL + Mocks
#
# Security report format (standard): SARIF 2.1.0
#   - Semgrep → semgrep.sarif
#   - Trivy FS → trivy-fs.sarif
#   - CodeQL → GitHub Code Scanning (native SARIF via analyze)
# Human-readable combined report: security-reports/combined-security-report.pdf
#   Artifact: security-combined-report-pdf
#   PR Checks tab: open this workflow → Summary → Artifacts, or Security Testing job summary.
# Human-readable console output is for gates/logs only, not the report standard.
#
# GitHub Flow for develop (validate only — NEVER packages a release APK)
# --------------------------------------------------------------------------
# This pipeline is CI only: merge-into-develop validation. It does not
# assembleRelease, sign, or upload store artifacts.
#
#   1. Branch from develop
#   2. Push feature branch → mobile-fast-feedback-caller (Integration stage once)
#   3. Open PR → develop (or push to develop) → mobile-ci-caller → this workflow
#      PR Integration reuses Fast Feedback for the head SHA; do not call
#      fast-feedback-pipeline.yml from mobile-ci-caller.yml (that would run it twice).
#   4. Branch protection on develop should require:
#        - "Integration"              ← highest priority / must pass first
#        - "Quality Control"
#        - "Security Testing"
#        - "CodeQL Analysis"
#        - "Mock Contract Tests"
#        - "GitHub Flow CI Gate"       ← optional single aggregate check
#   5. Merge when green → develop is integration-tested, not store-published
#   6. Unsigned APK packaging lives only in release-pipeline.yml
#
# Application:
#   https://github.com/Heavy-Rental/heavy-rental-mobile
#   Android · Kotlin JVM 17 · Compose · Gradle wrapper · OpenAPI mocks on :8081
#
# How the mobile app uses this
# ----------------------------
# Install both files into the Android application repository:
#
#   .github/workflows/integration-pipeline.yml   ← this file (reusable only)
#   .github/workflows/mobile-ci-caller.yml       ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than mobile-ci-caller.yml.
#
# Also mirrored in the pipeline-development repo for discovery/testing:
#   .github/workflows/mobile-ci.yml
#
# Local validation (pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-mobile/integration-pipeline/integration-pipeline.yml
#   act — see heavy-rental-mobile/act/README.md
#
# No GitHub Actions secrets required for v1.
# =============================================================================

name: Mobile CI

on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required for PR checks on the mobile app).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for pull_request events.
        required: false
        type: string
        default: ""

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  # Publish a Checks-tab download link for the combined security PDF
  checks: write

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  NODE_VERSION: "22"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/heavy-rental-mobile
  DEFAULT_APP_REF: develop
  MOCK_API_HOST: "127.0.0.1"
  MOCK_API_PORT: "8081"
  MOCK_API_BASE_URL: "http://127.0.0.1:8081"
  MOCK_API_READY_TIMEOUT_SECONDS: "60"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only mobile-ci-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only mobile-ci-caller.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          # nektos/act does not populate github.workflow_ref. ACT=true is set by
          # act and is unset on GitHub-hosted runners — do not weaken the gate there.
          if [ "${ACT:-}" = "true" ] && [ -z "${WORKFLOW_REF}" ]; then
            echo "act local run: caller gate skipped (github.workflow_ref unset)"
            {
              echo "### Caller gate"
              echo ""
              echo "nektos/act — \`github.workflow_ref\` is empty; filename gate skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${WORKFLOW_REF}" in
            */.github/workflows/mobile-ci-caller.yml@*)
              echo "Allowed caller: mobile-ci-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`mobile-ci-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::integration-pipeline.yml may only be invoked by .github/workflows/mobile-ci-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration — HIGHEST PRIORITY (GitHub Flow PR gate starts here)
  #    Always run this job (never if: skip it) so QC / Security / CodeQL / mocks
  #    keep their needs: and branch protection still sees the check.
  #    On pull_request, skip Android SDK / Gradle / layout when Fast Feedback
  #    already passed for the PR head SHA. In-flight Fast Feedback is waited on;
  #    pending-run jq is inlined (do not assign PENDING_FILTER). Do not uses:
  #    fast-feedback-pipeline.yml from the CI caller.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 25
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="${INPUT_REF:-${DEFAULT_APP_REF_VALUE}}"
            MODE=remote
          else
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="${INPUT_REF:-${GH_SHA}}"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Reuse Fast Feedback Integration when it already passed
        id: reuse
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          FF_WORKFLOW_FILE: mobile-fast-feedback-caller.yml
        run: |
          set -euo pipefail
          REUSE=false

          finish() {
            echo "reuse=${REUSE}" >> "$GITHUB_OUTPUT"
            {
              echo "### Fast Feedback reuse"
              echo ""
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME} (not pull_request) — run Integration."
            finish "Event \`${EVENT_NAME}\` — ran Integration locally (Fast Feedback is feature-branch push only)."
            exit 0
          fi

          COMMIT="${HEAD_SHA}"
          if [ -z "${COMMIT}" ]; then
            echo "PR head SHA is empty — run Integration."
            finish "PR head SHA empty — ran Integration locally."
            exit 0
          fi

          echo "Looking up Fast Feedback (${FF_WORKFLOW_FILE}) for commit ${COMMIT}"

          list_runs() {
            gh run list \
              --repo "${GH_REPOSITORY}" \
              --workflow "${FF_WORKFLOW_FILE}" \
              --commit "${COMMIT}" \
              --json databaseId,status,conclusion,url \
              --limit 20 \
              2>/dev/null || echo "[]"
          }

          run_count() {
            echo "${1}" | jq 'length' 2>/dev/null || echo 0
          }

          jq_field() {
            echo "${1}" | jq -r "${2}" 2>/dev/null || true
          }

          # PR opened in the same moment as the push: the Fast Feedback run may
          # not exist yet. Retry briefly before falling back to local checks.
          ATTEMPT=1
          MAX_APPEAR=12
          RUNS="[]"
          while [ "${ATTEMPT}" -le "${MAX_APPEAR}" ]; do
            RUNS="$(list_runs)"
            [ -n "${RUNS}" ] || RUNS="[]"
            if [ "$(run_count "${RUNS}")" -gt 0 ]; then
              break
            fi
            echo "No Fast Feedback run for ${COMMIT} yet (attempt ${ATTEMPT}/${MAX_APPEAR})"
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

          [ -n "${RUNS}" ] || RUNS="[]"
          if [ "$(run_count "${RUNS}")" -eq 0 ]; then
            echo "No Fast Feedback run for ${COMMIT} — run Integration."
            finish "No Fast Feedback run for \`${COMMIT}\` — ran Integration locally."
            exit 0
          fi

          jq_field "${RUNS}" '.[] | "id=\(.databaseId) status=\(.status) conclusion=\(.conclusion // "null") url=\(.url)"'

          SUCCESS_ID="$(jq_field "${RUNS}" '[.[] | select(.conclusion == "success")] | .[0].databaseId // empty')"
          SUCCESS_URL="$(jq_field "${RUNS}" '[.[] | select(.conclusion == "success")] | .[0].url // empty')"
          if [ -n "${SUCCESS_ID}" ]; then
            REUSE=true
            echo "Reusing successful Fast Feedback run ${SUCCESS_ID}: ${SUCCESS_URL}"
            finish "Reused Fast Feedback run [${SUCCESS_ID}](${SUCCESS_URL}) for \`${COMMIT}\`. Android SDK / Gradle / layout steps skipped."
            exit 0
          fi

          # Inline the jq filter (same form as SUCCESS_ID). Do not assign PENDING_FILTER.
          PENDING_ID="$(jq_field "${RUNS}" '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | .[0].databaseId // empty')"
          PENDING_URL="$(jq_field "${RUNS}" '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | .[0].url // empty')"
          if [ -z "${PENDING_ID}" ]; then
            echo "Fast Feedback finished without success for ${COMMIT} — run Integration."
            finish "Fast Feedback did not succeed for \`${COMMIT}\` — ran Integration locally."
            exit 0
          fi

          echo "Waiting for in-flight Fast Feedback run ${PENDING_ID}: ${PENDING_URL}"
          set +e
          timeout 600 gh run watch "${PENDING_ID}" --repo "${GH_REPOSITORY}" --exit-status --interval 10
          WATCH_RC=$?
          set -e
          if [ "${WATCH_RC}" -eq 0 ]; then
            REUSE=true
            echo "Fast Feedback run ${PENDING_ID} succeeded — skip Android SDK / Gradle / layout."
            finish "Waited for Fast Feedback run [${PENDING_ID}](${PENDING_URL}) (success). Android SDK / Gradle / layout steps skipped."
            exit 0
          fi

          echo "Fast Feedback run ${PENDING_ID} did not succeed (watch exit=${WATCH_RC}) — run Integration."
          finish "Fast Feedback run [${PENDING_ID}](${PENDING_URL}) did not succeed (watch exit=${WATCH_RC}) — ran Integration locally."

      - name: Checkout calling repository (PR / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/build.gradle.kts
            ${{ env.APP_PATH }}/app/build.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
            ${{ env.APP_PATH }}/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        if: steps.reuse.outputs.reuse != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: >
            tools
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Ensure Gradle Wrapper is executable
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "Using Gradle Wrapper (./gradlew)"
          else
            echo "::error::gradlew not found — this pipeline expects the Gradle Wrapper in the mobile repo."
            exit 1
          fi

      - name: Resolve Gradle project (preBuild)
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --version
          ./gradlew --no-daemon :app:preBuild

      - name: Verify project layout and toolchain
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Java / Gradle versions"
          java -version
          ./gradlew --no-daemon --version
          echo "==> Required files"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/build.gradle.kts
          test -d specification
          test -f package.json
          {
            echo "### Integration checks"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner Java | \`${{ env.JAVA_VERSION }}\` (${{ env.JAVA_DISTRIBUTION }}) |"
            echo "| compileSdk | \`${{ env.ANDROID_COMPILE_SDK }}\` |"
            echo "| build-tools | \`${{ env.ANDROID_BUILD_TOOLS }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integration checks passed."

      - name: Upload Gradle project fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: integration-metadata
          path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Quality control — lint + JVM unit tests + debug APK
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/build.gradle.kts
            ${{ env.APP_PATH }}/app/build.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
            ${{ env.APP_PATH }}/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >
            tools
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Ensure Gradle Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./gradlew

      - name: Lint, JVM unit tests, assembleDebug
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          {
            echo "### Quality control"
            echo ""
            echo "lintDebug, testDebugUnitTest, and assembleDebug completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-test-reports
          path: |
            ${{ env.APP_PATH }}/app/build/reports/
            ${{ env.APP_PATH }}/app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-debug-apk
          path: ${{ env.APP_PATH }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Security testing — Semgrep + Trivy
  # ---------------------------------------------------------------------------
  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Create security reports directory
        run: mkdir -p "${GITHUB_WORKSPACE}/security-reports"

      - name: Setup Python (Semgrep)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: SAST — Semgrep (Kotlin / Java / OWASP) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          # Community packs plus custom ERROR rules for plaintext credentials
          # that p/secrets and p/gitleaks miss (generic passwords, not tokens).
          RULES_FILE="${REPORT_DIR}/semgrep-custom-rules.yml"
          cat > "${RULES_FILE}" << 'SEMGREP_CUSTOM_RULES'
          rules:
            - id: heavy-rental.mobile.hardcoded-credential-in-properties
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in a properties/env file (CWE-798). Use
                an environment variable or secrets manager. A plaintext
                password, secret, token, or API key in config is a shipping secret.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [secrets]
              paths:
                include:
                  - "*.properties"
                  - "*.env"
                  - "*.ini"
                  - ".env"
                  - ".env.*"
                  - "*.gradle"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/node_modules/**"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*=[ \t]*(?!\$\{)(?!ENC\()(?!\{cipher\})(?![ \t]*(?:#|$))[^\s#]+
            - id: heavy-rental.mobile.hardcoded-credential-in-yaml
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in YAML config (CWE-798). Use an
                environment variable or secrets manager instead of plaintext.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [secrets]
              paths:
                include:
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/.github/**"
                  - "**/node_modules/**"
              pattern-regex: >-
                (?i)^[ \t-]*["']?(?:[A-Za-z0-9._-]*[\._-])?(password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)["']?[ \t]*:[ \t]*(?!\$\{)(?!~)(?!null\b)(?!ENC\()(?!\{cipher\})(?!["']?[ \t]*(?:#|$))["']?[^\s#"']+
            - id: heavy-rental.mobile.env-placeholder-plaintext-default
              languages: [regex]
              severity: ERROR
              message: >
                Placeholder ${VAR:default} embeds a plaintext credential
                default (CWE-798). Empty defaults (${VAR:} or ${VAR}) are OK.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [secrets]
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                  - "*.env"
                  - ".env"
                  - ".env.*"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*[=:][ \t]*\$\{[^}:]+:(?![ \t]*\})[^}]+\}
            - id: heavy-rental.mobile.jdbc-url-embedded-credentials
              languages: [regex]
              severity: ERROR
              message: >
                JDBC URL embeds user:password@host (CWE-798). Use a URL without
                credentials and set username/password from the environment.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
