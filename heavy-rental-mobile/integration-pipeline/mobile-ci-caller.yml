# =============================================================================
# Install into: heavy-rental-mobile
# Path:         .github/workflows/mobile-ci-caller.yml
# =============================================================================
# GitHub Flow CI caller — validates feature-branch pull requests before merge.
#
# Place both files in the Android application repository:
#
#   .github/workflows/mobile-ci-caller.yml       ← this file (triggers)
#   .github/workflows/integration-pipeline.yml   ← reusable pipeline (called)
#
# GitHub Flow
# -----------
#   1. Branch from develop
#   2. Open a pull request into develop → this workflow runs (Integration first)
#   3. Review + green checks → merge into develop
#   4. Release packaging → mobile-release-caller.yml on workflow_dispatch
#                          (Publish creates the GitHub Release; no GHCR)
#
# Reusable workflow (same repository):
#   ./.github/workflows/integration-pipeline.yml
#
# Fast Feedback (do NOT call it from this file)
# ---------------------------------------------
# mobile-fast-feedback-caller.yml owns the Integration stage on feature-branch
# pushes. Do not `uses:` fast-feedback-pipeline.yml here — that would run Fast
# Feedback a second time when a PR is opened.
# On pull_request, integration-pipeline.yml Integration reuses a successful
# Fast Feedback run for the PR head SHA instead of repeating Android SDK /
# Gradle / layout. An in-flight Fast Feedback run is waited on.
#
# Job priority (do not reorder conceptually)
# -----------------------------------------
#   1. Integration           ← HIGHEST PRIORITY (required status check)
#   2. Quality Control       (needs Integration)
#   2. Security Testing      (needs Integration; parallel with QC)
#   2. CodeQL Analysis       (needs Integration; Java/Kotlin Code Scanning)
#   2. Mock Contract Tests   (needs Integration; Mockoon + mock:verify)
#   3. GitHub Flow CI Gate   (aggregate of the above — optional single check)
#
# Setup
# -----
# 1. Copy into the mobile repo:
#      .github/workflows/mobile-ci-caller.yml
#      .github/workflows/integration-pipeline.yml
# 2. Branch protection on develop (Settings → Branches):
#      - Require a pull request before merging
#      - Require status checks to pass before merging:
#          * Integration              ← require this first / highest priority
#          * Quality Control
#          * Security Testing
#          * CodeQL Analysis
#          * Mock Contract Tests
#          * GitHub Flow CI Gate      ← optional single aggregate check
#      - Do not allow bypassing the above for administrators (recommended)
# 3. No repository secrets required for v1.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      app_repository:
        description: Override application repository (owner/name). Empty = this repo (correct on GitHub; for act against the Android app, set Heavy-Rental/heavy-rental-mobile).
        required: false
        type: string
        default: ""
      app_ref:
        description: Override git ref. Empty = this commit.
        required: false
        type: string
        default: ""

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  checks: write

jobs:
  integration-pipeline:
    name: Integration pipeline
    uses: ./.github/workflows/integration-pipeline.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_ref: ${{ inputs.app_ref }}
    # Empty inputs on PR/push: checks out this repo at github.sha (application repo).
    # For act in pipeline-development, pass app_repository=Heavy-Rental/heavy-rental-mobile.
    # No secrets: mobile QC does not need a database.
