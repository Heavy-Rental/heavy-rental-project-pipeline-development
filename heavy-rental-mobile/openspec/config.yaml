# OpenSpec project config for the Heavy Rental mobile CI family.
# Specs live next to the workflows they describe.
schema: spec-driven
context: |
  This folder specifies GitHub Actions CI pipelines for Heavy-Rental/heavy-rental-mobile.
  The family is Fast Feedback, Integration CI, and Release (unsigned APK + MobSF DAST +
  GitHub Release on workflow_dispatch). Mock Contract Tests use Mockoon (mock:mockoon +
  mock:verify); Prism is not used in CI. There is no Academy app CD, GHCR image, or Play
  signing in this tree. Product behaviour for the Android app is NOT specified here —
  that lives in the application repository under specification/.
