# =============================================================================
# Heavy Rental Mobile — Release CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration is highest priority):
#   1. Integration      (HIGHEST) checkout, JDK 17, Android SDK, Gradle, layout
#   2. Quality Control  needs Integration — lintDebug, testDebugUnitTest, assembleDebug
#   3. Security Testing needs Integration — SAST (Semgrep) + SCA/FS (Trivy)
#   4. CodeQL Analysis  needs Integration — GitHub CodeQL (Java/Kotlin)
#   5. Packaging        needs Integration + QC + Security + CodeQL — unsigned APK
#
# Security report format (standard): SARIF 2.1.0
#   - Semgrep → semgrep.sarif + semgrep.json + semgrep.txt (all severities)
#   - Trivy FS → trivy-fs.sarif
#   - CodeQL → GitHub Code Scanning (native SARIF via analyze)
#
# GitHub Flow (https://docs.github.com/en/get-started/using-github/github-flow)
# --------------------------------------------------------------------------
# Invoked via mobile-release-caller.yml when:
#   - a GitHub Release is published, or
#   - a pull request is opened/updated from develop → master
# Feature-branch PR validation remains mobile-ci-caller.yml (Integration first).
#
#   feature → develop (CI) → PR develop→master and/or publish GitHub Release
#     → this pipeline
#
# Same gates as integration-pipeline.yml (no mock contract job), plus
# unsigned assembleRelease APK artifacts. No Play signing and no GHCR in v1.
#
# Application:
#   https://github.com/Heavy-Rental/heavy-rental-mobile
#   Android · Kotlin JVM 17 · Compose · Gradle wrapper
#
# How the mobile app uses this on release
# ---------------------------------------
# Install both files into the Android application repository:
#
#   .github/workflows/release-pipeline.yml         ← this file (reusable only)
#   .github/workflows/mobile-release-caller.yml    ← sole allowed entry point
#
# Also mirrored in the pipeline-development repo for discovery/testing:
#   .github/workflows/mobile-release.yml
#
# Local validation (pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-mobile/release-pipeline/release-pipeline.yml
#   act — see heavy-rental-mobile/act/README.md
#
# No GitHub Actions secrets required for v1 (unsigned APK only).
# =============================================================================

name: Mobile Release CI

on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository.
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha).
        required: false
        type: string
        default: ""

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/heavy-rental-mobile
  DEFAULT_APP_REF: master

jobs:
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only mobile-release-caller.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          # nektos/act does not populate github.workflow_ref. ACT=true is set by
          # act and is unset on GitHub-hosted runners — do not weaken the gate there.
          if [ "${ACT:-}" = "true" ] && [ -z "${WORKFLOW_REF}" ]; then
            echo "act local run: caller gate skipped (github.workflow_ref unset)"
            {
              echo "### Caller gate"
              echo ""
              echo "nektos/act — \`github.workflow_ref\` is empty; filename gate skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${WORKFLOW_REF}" in
            */.github/workflows/mobile-release-caller.yml@*)
              echo "Allowed caller: mobile-release-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`mobile-release-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::release-pipeline.yml may only be invoked by .github/workflows/mobile-release-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 25
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="master"
            MODE=remote
          else
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="master"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (release / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/build.gradle.kts
            ${{ env.APP_PATH }}/app/build.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
            ${{ env.APP_PATH }}/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Ensure Gradle Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "Using Gradle Wrapper (./gradlew)"
          else
            echo "::error::gradlew not found — this pipeline expects the Gradle Wrapper in the mobile repo."
            exit 1
          fi

      - name: Resolve Gradle project (preBuild)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --version
          ./gradlew --no-daemon :app:preBuild

      - name: Verify project layout and toolchain
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Java / Gradle versions"
          java -version
          ./gradlew --no-daemon --version
          echo "==> Required files"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/build.gradle.kts
          test -d specification
          test -f package.json
          {
            echo "### Integration checks"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner Java | \`${{ env.JAVA_VERSION }}\` (${{ env.JAVA_DISTRIBUTION }}) |"
            echo "| compileSdk | \`${{ env.ANDROID_COMPILE_SDK }}\` |"
            echo "| build-tools | \`${{ env.ANDROID_BUILD_TOOLS }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integration checks passed."

      - name: Upload Gradle project fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: release-integration-metadata
          path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
          retention-days: 7
          if-no-files-found: warn

  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/build.gradle.kts
            ${{ env.APP_PATH }}/app/build.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
            ${{ env.APP_PATH }}/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Ensure Gradle Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./gradlew

      - name: Lint, JVM unit tests, assembleDebug
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          {
            echo "### Quality control"
            echo ""
            echo "lintDebug, testDebugUnitTest, and assembleDebug completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-test-reports
          path: |
            ${{ env.APP_PATH }}/app/build/reports/
            ${{ env.APP_PATH }}/app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-debug-apk
          path: ${{ env.APP_PATH }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    needs: [integration, quality-control]
    outputs:
      version: ${{ steps.package.outputs.version }}
      versioned_name: ${{ steps.package.outputs.versioned_name }}
      stable_name: ${{ steps.package.outputs.stable_name }}
      short_sha: ${{ steps.package.outputs.short_sha }}
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ env.APP_PATH }}/settings.gradle.kts
            ${{ env.APP_PATH }}/build.gradle.kts
            ${{ env.APP_PATH }}/app/build.gradle.kts
            ${{ env.APP_PATH }}/gradle/libs.versions.toml
            ${{ env.APP_PATH }}/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Ensure Gradle Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./gradlew

      - name: Assemble unsigned release APK
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease
          echo "==> release outputs"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print || true

      - name: Stage versioned and stable APK
        id: package
        working-directory: ${{ env.APP_PATH }}
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUILD_FILE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "${BUILD_FILE}" ] || [ ! -f "${BUILD_FILE}" ]; then
            echo "::error::No APK produced under app/build/outputs/apk/release/ after assembleRelease"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          VERSION="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1 || true)"
          VERSION="${VERSION:-0.0.0}"
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          RUN_ID="${GH_RUN_NUMBER}"

          VERSIONED_NAME="heavy-rental-mobile-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.apk"
          STABLE_NAME="heavy-rental-mobile.apk"
          VERSIONED_PATH="${GITHUB_WORKSPACE}/${VERSIONED_NAME}"
          STABLE_PATH="${GITHUB_WORKSPACE}/${STABLE_NAME}"

          cp "${BUILD_FILE}" "${VERSIONED_PATH}"
          cp "${BUILD_FILE}" "${STABLE_PATH}"

          if [ ! -s "${VERSIONED_PATH}" ] || [ ! -s "${STABLE_PATH}" ]; then
            echo "::error::Staged APK is empty or missing."
            ls -lah "${VERSIONED_PATH}" "${STABLE_PATH}" || true
            exit 1
          fi

          {
            echo "versioned_name=${VERSIONED_NAME}"
            echo "stable_name=${STABLE_NAME}"
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Packaging"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| versionName | \`${VERSION}\` |"
            echo "| Versioned APK | \`${VERSIONED_NAME}\` |"
            echo "| Stable APK | \`${STABLE_NAME}\` |"
            echo "| Source | \`${BUILD_FILE}\` |"
            echo "| Signing | unsigned (v1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: |
            ${{ github.workspace }}/${{ steps.package.outputs.versioned_name }}
            ${{ github.workspace }}/${{ steps.package.outputs.stable_name }}
          retention-days: 14
          if-no-files-found: error

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: [packaging]
    timeout-minutes: 40
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: mobile-release-apk
          path: ${{ github.workspace }}/apk

      - name: Start MobSF
        run: |
          set -euo pipefail
          docker run -d --name mobsf -e MOBSF_API_KEY=ci-mobsf-key -p 8000:8000 \
            opensecurity/mobile-security-framework-mobsf:latest
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -H "Authorization: ci-mobsf-key" http://127.0.0.1:8000/api/v1/scans >/dev/null 2>&1 \
              || curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::MobSF did not become ready."
            docker logs mobsf || true
            exit 1
          fi

      - name: Scan APK with MobSF
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dast-reports"
          APK="$(find "${GITHUB_WORKSPACE}/apk" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "::error::No APK artifact for MobSF."
            exit 1
          fi
          UPLOAD="$(curl -fsS -H "Authorization: ci-mobsf-key" -F "file=@${APK}" http://127.0.0.1:8000/api/v1/upload)"
          echo "${UPLOAD}" | tee "${GITHUB_WORKSPACE}/dast-reports/mobsf-upload.json"
          HASH="$(python3 -c "import json,sys; print(json.load(sys.stdin).get('hash',''))" <<<"${UPLOAD}")"
          if [ -z "${HASH}" ]; then
            echo "::error::MobSF upload did not return a hash."
            exit 1
          fi
          SCAN="$(curl -fsS -H "Authorization: ci-mobsf-key" -F "hash=${HASH}" -F "scan_type=apk" \
            http://127.0.0.1:8000/api/v1/scan)"
          echo "${SCAN}" > "${GITHUB_WORKSPACE}/dast-reports/mobsf-scan.json"
          curl -fsS -H "Authorization: ci-mobsf-key" -F "hash=${HASH}" \
            http://127.0.0.1:8000/api/v1/report_json \
            > "${GITHUB_WORKSPACE}/dast-reports/mobsf-report.json" || true
          curl -fsS -H "Authorization: ci-mobsf-key" -F "hash=${HASH}" \
            http://127.0.0.1:8000/api/v1/download_pdf \
            > "${GITHUB_WORKSPACE}/dast-reports/mobsf-report.pdf" || \
          curl -fsS -H "Authorization: ci-mobsf-key" -F "hash=${HASH}" \
            http://127.0.0.1:8000/api/v1/report_pdf \
            > "${GITHUB_WORKSPACE}/dast-reports/mobsf-report.pdf" || true
          if [ ! -s "${GITHUB_WORKSPACE}/dast-reports/mobsf-report.json" ]; then
            echo '{"error":"MobSF JSON report missing"}' > "${GITHUB_WORKSPACE}/dast-reports/mobsf-report.json"
          fi
          HIGH="$(python3 -c "
          import json
          p='${GITHUB_WORKSPACE}/dast-reports/mobsf-report.json'
          try:
              d=json.load(open(p))
          except Exception:
              d={}
          n=0
          for key in ('high','High','severity'):
              v=d.get(key)
              if isinstance(v, list):
                  n=max(n,len(v))
              elif isinstance(v, dict):
                  n=max(n,len(v))
          print(n)
          ")"
          echo "MobSF high-count heuristic=${HIGH}"
          if [ "${HIGH}" -gt 0 ]; then
            echo "::warning::MobSF report contains high-severity items; inspect dast-reports/mobsf-report.json."
          fi

      - name: Index DAST reports
        if: always()
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          {
            echo "# DAST reports (MobSF)"
            echo ""
            echo "| File | Bytes |"
            echo "| --- | --- |"
            find "${REPORTS}" -maxdepth 1 -type f ! -name INDEX.md -print | sort | while read -r f; do
              echo "| \`$(basename "$f")\` | $(wc -c < "$f") |"
            done
          } | tee "${REPORTS}/INDEX.md"
          cat "${REPORTS}/INDEX.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf >/dev/null 2>&1 || true

      - name: Upload MobSF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-dast
          path: ${{ github.workspace }}/dast-reports/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [integration, packaging, dast]
    timeout-minutes: 15
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: mobile-release-apk
          path: ${{ github.workspace }}/release-package

      - name: Download DAST reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mobile-release-dast
          path: ${{ github.workspace }}/release-dast

      - name: Create GitHub Release on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.integration.outputs.app_repository }}
          VERSION: ${{ needs.packaging.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES="$(
            printf '%s\n' \
              "Release **${TAG}** from \`master\`." \
              "" \
              "Unsigned APK attached. DAST: MobSF static scan (reports in workflow artifacts)."
          )"
          mapfile -t ATTACH < <(find "${GITHUB_WORKSPACE}/release-package" "${GITHUB_WORKSPACE}/release-dast" -type f 2>/dev/null | sort)
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --target master \
            --title "${TAG}" \
            --notes "${NOTES}" \
            "${ATTACH[@]}"
          echo "Created GitHub Release ${TAG} on ${GH_REPO} (target master)."
