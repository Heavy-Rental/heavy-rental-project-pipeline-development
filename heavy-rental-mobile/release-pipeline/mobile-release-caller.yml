# =============================================================================
# Install into: heavy-rental-mobile
# Path:         .github/workflows/mobile-release-caller.yml
# =============================================================================
# Release caller — manual dispatch only (Actions → Release → Run workflow).
# Checks out master, QC, unsigned APK, MobSF, then GitHub Release (no GHCR).
# Do not use on: release — Publish in the reusable workflow creates the
# GitHub Release.
#
# Feature-branch PR validation remains CI (mobile-ci-caller.yml).
# SAST / CodeQL / Mock Contract Tests live on Integration CI, not this caller.
#
# Place both files in the Android application repository:
#
#   .github/workflows/mobile-release-caller.yml  ← this file (triggers)
#   .github/workflows/release-pipeline.yml       ← reusable pipeline (called)
#
# When this runs
# --------------
#   workflow_dispatch only (Actions → this workflow → Run workflow)
#
#   Does NOT run on:
#     - published GitHub Release (this pipeline creates that Release)
#     - pull request develop → master
#     - push to master/develop alone
#     - PRs from feature branches
#     - PRs into develop
#     - tag push alone
#
# Flow
# ----
#   feature → develop (CI) → merge to master → workflow_dispatch this pipeline
#     → Integration → QC → Packaging → DAST → Publish
#       (unsigned APK + MobSF + GitHub Release; no GHCR)
#
# Reusable workflow (same repository):
#   ./.github/workflows/release-pipeline.yml
#
# Setup
# -----
# 1. Copy into the mobile repo:
#      .github/workflows/mobile-release-caller.yml
#      .github/workflows/release-pipeline.yml
# 2. No signing / Play / GHCR secrets in v1.
# =============================================================================

name: Release

on:
  workflow_dispatch:

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  release-pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
