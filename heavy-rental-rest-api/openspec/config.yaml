# OpenSpec project config for the Heavy Rental Spring REST API pipeline family.
# Specs live next to the workflows they describe.
schema: spec-driven
context: |
  This folder specifies GitHub Actions pipelines for Heavy-Rental/heavy-rental-spring-rest-api.
  Two families live here:
    1. CI — Fast Feedback, Integration CI, and Release packaging
       (openspec/changes/add-rest-ci-pipeline/). As-implemented of existing YAML.
    2. App CD — discover asg-rest and compose (academy Vocareum +
       paid OIDC callers: add-rest-cd-academy-skeleton,
       add-rest-cd-academy-deploy, add-rest-cd-paid-deploy).
  Product behaviour for the Spring service is NOT specified here.
  Infrastructure setup and operate (stop / destroy) belong to the infra project.
  ALB tg-rest health is GET <instance>:8080/actuator/health matcher 200-299 (2xx).
  App CD verify uses the same path; GET / 401 is not healthy.
  Fast Feedback DEFAULT_APP_REPOSITORY is SA62-team1/... (local act).
  Integration CI and Release DEFAULT_APP_REPOSITORY is
  Heavy-Rental/heavy-rental-spring-rest-api. Release checkout is always master.
  When Fast Feedback / Integration CI run in the Heavy-Rental Spring repo,
  checkout is the calling commit.
  Feature-branch push runs Fast Feedback (Integration only). PR Integration Check
  reuses that SHA and does not call fast-feedback-pipeline.yml. Integration CI
  job name is Integration Check. Integration caller passes REST_API_DB_* via an
  explicit secrets map (Repository secrets); Release QC reads Environment production.
