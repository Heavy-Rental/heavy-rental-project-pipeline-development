# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/release.yml
# =============================================================================
# GitHub Flow release caller — runs after merge to master/main (or on tags).
# PR validation is CI (rest-api-ci-caller.yml), not this workflow.
#
# GitHub Flow
# -----------
#   feature branch → PR (CI, Integration first) → merge → this Release pipeline
#   optional: tag v* → versioned package
#
# Reusable workflow:
#   SA62-team1/heavy-rental-project-pipeline-development
#     .github/workflows/rest-api-release.yml
#
# Job priority inside the reusable workflow
# -----------------------------------------
#   1. Integration           ← HIGHEST PRIORITY
#   2. Quality Control       (needs Integration)
#   2. Security Testing      (needs Integration)
#   3. Packaging             (needs Integration + QC + Security)
#      → WAR artifact + Docker image (tar + GHCR push)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   REST_API_DB_NAME, REST_API_DB_USER, REST_API_DB_PASSWORD,
#   REST_API_DB_PORT, REST_API_DB_URL
#
# Forwarded via secrets: inherit. Do not put secret values in this file.
# =============================================================================

name: Release

on:
  # GitHub Flow: package only after merge to the default branch (not on PRs)
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

# Do not cancel an in-flight release mid-packaging
concurrency:
  group: rest-api-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Forwarded to reusable workflow for github/codeql-action/upload-sarif@v2
  security-events: write
  actions: read
  # Required so packaging can push the Docker image to GHCR
  packages: write

jobs:
  release-pipeline:
    name: Release pipeline
    uses: SA62-team1/heavy-rental-project-pipeline-development/.github/workflows/rest-api-release.yml@master
    # Forward repository secrets (REST_API_DB_*) into the reusable workflow.
    # Required: REST_API_DB_NAME, REST_API_DB_USER, REST_API_DB_PASSWORD,
    #           REST_API_DB_PORT, REST_API_DB_URL
    secrets: inherit
