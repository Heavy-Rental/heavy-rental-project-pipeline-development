# =============================================================================
# Heavy Rental Web Portal — Integration CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration Check is highest priority):
#   1. Integration Check (HIGHEST) checkout, Node 22, npm ci, install health
#      On pull_request: reuse a successful Fast Feedback CI run for the PR head
#      SHA instead of repeating those steps (wait if in-flight; inlined pending-run
#      jq, no PENDING_FILTER). Fast Feedback owns the Integration stage on
#      feature-branch pushes; this job must not invoke that workflow.
#      Push to develop / workflow_dispatch / missing Fast Feedback → run fully.
#   2. Quality Control     — ESLint + TypeScript (needs Integration Check)
#   3. Security Testing    — Semgrep + npm audit + Trivy (needs Integration Check)
#   4. CodeQL Analysis     — GitHub CodeQL for JavaScript/TypeScript (needs Integration Check)
#   5. REST Endpoint Tests — mock server HTTP tests (needs Integration Check)
#   6. GitHub Flow CI Gate — aggregate: Integration Check first, then QC + Security + CodeQL + REST
#   Security report format (standard): SARIF 2.1.0
#     - Semgrep → semgrep.sarif
#     - npm audit → npm-audit.sarif (converted from audit JSON)
#     - Trivy FS → trivy-fs.sarif
#     - CodeQL → GitHub Code Scanning (native SARIF via analyze)
#   Human-readable combined report: security-reports/combined-security-report.pdf
#     Artifact: security-combined-report-pdf
#     PR Checks tab: open this workflow → Summary → Artifacts, or Security Testing job summary.
#   Human-readable .txt logs are optional log excerpts only, not the report standard.
#   REST endpoint tests: against a local mock server (not a live backend)
#     Skips cleanly until both scripts exist in the portal package.json.
#
# GitHub Flow for develop (validate only — NEVER deploys)
# --------------------------------------------------------------------------
#   1. Branch from develop
#   2. Push feature branch → portal-fast-feedback-caller (Integration stage once)
#   3. Open PR → develop (or push to develop) → portal-ci-caller → this workflow
#      PR Integration Check reuses Fast Feedback for the head SHA; do not call
#      fast-feedback-pipeline.yml from portal-ci-caller.yml (that would run it twice).
#   4. Branch protection on develop should require:
#        - "Integration Check"        ← highest priority / must pass first
#        - "Quality Control"
#        - "Security Testing"
#        - "CodeQL Analysis"
#        - "REST Endpoint Tests"
#        - "GitHub Flow CI Gate"       ← optional single aggregate check
#   5. Merge when green → develop is integration-tested, not production-deployed
#   6. Deploy packaging / GHCR lives only in release-pipeline.yml
#      (workflow_dispatch via portal-release-caller.yml; creates the GitHub Release)
#
# How the portal uses this
# ------------------------
# Install both files into the React web portal repository:
#
#   .github/workflows/integration-pipeline.yml   ← this file (reusable only)
#   .github/workflows/portal-ci-caller.yml       ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than portal-ci-caller.yml.
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/integration-pipeline.yml
#
# Authoring copy lives in this tree. Install into the portal repo as
#   .github/workflows/integration-pipeline.yml
# A `.github/workflows/web-portal-ci.yml` copy in pipeline-development (if present) can lag.
#
# Local validation (from pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-web-portal-pipeline/integration_pipeline/integration-pipeline.yml
# =============================================================================

name: Web Portal CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/portal-ci-caller.yml (enforced below).
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required for PR checks on the portal).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for pull_request events.
        required: false
        type: string
        default: ""

# GitHub Flow: one concurrent run per PR (or branch); newer pushes cancel stale runs
concurrency:
  group: web-portal-ci-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # Required for github/codeql-action/analyze and optional SARIF uploads
  security-events: write
  actions: read
  # Publish a Checks-tab download link for the combined security PDF
  checks: write

env:
  NODE_VERSION: "22"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/heavy-rental-react-web-portal
  # Integration CI is develop-only (portal-ci-caller.yml push/PR → develop)
  DEFAULT_APP_REF: develop
  # Local mock REST server used only by rest-endpoint-tests (no live backend)
  MOCK_API_HOST: "127.0.0.1"
  MOCK_API_PORT: "4010"
  MOCK_API_BASE_URL: "http://127.0.0.1:4010"
  MOCK_API_HEALTH_PATH: "/health"
  MOCK_API_READY_TIMEOUT_SECONDS: "60"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only portal-ci-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only portal-ci-caller.yml
        env:
          # github context is that of the caller workflow for reusable workflows
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/portal-ci-caller.yml@*)
              echo "Allowed caller: portal-ci-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`portal-ci-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::integration-pipeline.yml may only be invoked by .github/workflows/portal-ci-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration Check — HIGHEST PRIORITY (GitHub Flow PR gate starts here)
  #    All other jobs declare needs: integration-check so they never run if this fails.
  #    Job id is integration-check so it is not confused with Fast Feedback Integration.
  #    Always run this job (never if: skip it) so QC / Security / CodeQL / REST tests
  #    keep their needs: and branch protection still sees the check.
  #    On pull_request, skip npm ci / install health when Fast Feedback already passed
  #    for the PR head SHA. In-flight Fast Feedback is waited on; pending-run jq is
  #    inlined (do not assign PENDING_FILTER). Do not uses: fast-feedback-pipeline.yml
  #    from the CI caller.
  # ---------------------------------------------------------------------------
  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 20
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
      node-modules-cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="${INPUT_REF:-${DEFAULT_APP_REF_VALUE}}"
            MODE=remote
          else
            # Same-repo caller: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="${INPUT_REF:-${GH_SHA}}"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Reuse Fast Feedback Integration when it already passed
        id: reuse
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          FF_WORKFLOW_FILE: portal-fast-feedback-caller.yml
        run: |
          set -euo pipefail
          REUSE=false

          finish() {
            echo "reuse=${REUSE}" >> "$GITHUB_OUTPUT"
            {
              echo "### Fast Feedback reuse"
              echo ""
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME} (not pull_request) — run Integration Check."
            finish "Event \`${EVENT_NAME}\` — ran Integration Check locally (Fast Feedback is feature-branch push only)."
            exit 0
          fi

          COMMIT="${HEAD_SHA}"
          if [ -z "${COMMIT}" ]; then
            echo "PR head SHA is empty — run Integration Check."
            finish "PR head SHA empty — ran Integration Check locally."
            exit 0
          fi

          echo "Looking up Fast Feedback (${FF_WORKFLOW_FILE}) for commit ${COMMIT}"

          list_runs() {
            gh run list \
              --repo "${GH_REPOSITORY}" \
              --workflow "${FF_WORKFLOW_FILE}" \
              --commit "${COMMIT}" \
              --json databaseId,status,conclusion,url \
              --limit 20 \
              2>/dev/null || echo "[]"
          }

          run_count() {
            echo "${1}" | jq 'length' 2>/dev/null || echo 0
          }

          jq_field() {
            echo "${1}" | jq -r "${2}" 2>/dev/null || true
          }

          # PR opened in the same moment as the push: the Fast Feedback run may
          # not exist yet. Retry briefly before falling back to local checks.
          ATTEMPT=1
          MAX_APPEAR=12
          RUNS="[]"
          while [ "${ATTEMPT}" -le "${MAX_APPEAR}" ]; do
            RUNS="$(list_runs)"
            [ -n "${RUNS}" ] || RUNS="[]"
            if [ "$(run_count "${RUNS}")" -gt 0 ]; then
              break
            fi
            echo "No Fast Feedback run for ${COMMIT} yet (attempt ${ATTEMPT}/${MAX_APPEAR})"
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

          [ -n "${RUNS}" ] || RUNS="[]"
          if [ "$(run_count "${RUNS}")" -eq 0 ]; then
            echo "No Fast Feedback run for ${COMMIT} — run Integration Check."
            finish "No Fast Feedback run for \`${COMMIT}\` — ran Integration Check locally."
            exit 0
          fi

          jq_field "${RUNS}" '.[] | "id=\(.databaseId) status=\(.status) conclusion=\(.conclusion // "null") url=\(.url)"'

          SUCCESS_ID="$(jq_field "${RUNS}" '[.[] | select(.conclusion == "success")] | .[0].databaseId // empty')"
          SUCCESS_URL="$(jq_field "${RUNS}" '[.[] | select(.conclusion == "success")] | .[0].url // empty')"
          if [ -n "${SUCCESS_ID}" ]; then
            REUSE=true
            echo "Reusing successful Fast Feedback run ${SUCCESS_ID}: ${SUCCESS_URL}"
            finish "Reused Fast Feedback run [${SUCCESS_ID}](${SUCCESS_URL}) for \`${COMMIT}\`. npm ci / install-health steps skipped."
            exit 0
          fi

          # Inline the jq filter (same form as SUCCESS_ID). Do not assign PENDING_FILTER.
          PENDING_ID="$(jq_field "${RUNS}" '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | .[0].databaseId // empty')"
          PENDING_URL="$(jq_field "${RUNS}" '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | .[0].url // empty')"
          if [ -z "${PENDING_ID}" ]; then
            echo "Fast Feedback finished without success for ${COMMIT} — run Integration Check."
            finish "Fast Feedback did not succeed for \`${COMMIT}\` — ran Integration Check locally."
            exit 0
          fi

          echo "Waiting for in-flight Fast Feedback run ${PENDING_ID}: ${PENDING_URL}"
          set +e
          timeout 600 gh run watch "${PENDING_ID}" --repo "${GH_REPOSITORY}" --exit-status --interval 10
          WATCH_RC=$?
          set -e
          if [ "${WATCH_RC}" -eq 0 ]; then
            REUSE=true
            echo "Fast Feedback run ${PENDING_ID} succeeded — skip npm ci / install health."
            finish "Waited for Fast Feedback run [${PENDING_ID}](${PENDING_URL}) (success). npm ci / install-health steps skipped."
            exit 0
          fi

          echo "Fast Feedback run ${PENDING_ID} did not succeed (watch exit=${WATCH_RC}) — run Integration Check."
          finish "Fast Feedback run [${PENDING_ID}](${PENDING_URL}) did not succeed (watch exit=${WATCH_RC}) — ran Integration Check locally."

      - name: Checkout calling repository (PR / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        if: steps.reuse.outputs.reuse != 'true'
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.reuse.outputs.reuse != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Report dependency cache status
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" = "true" ]; then
            echo "node_modules restored from cache (skipped npm ci)."
          else
            echo "node_modules cache miss — installed with npm ci; cache will be saved at job end."
          fi
          echo "Lockfile hash key uses package-lock.json + Node ${{ env.NODE_VERSION }} + ${{ runner.os }}"

      - name: Verify install integrity
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Node / npm versions"
          node --version
          npm --version
          echo "==> package.json scripts"
          npm run | head -n 50 || true
          echo "==> Dependency tree (top level)"
          npm ls --depth=0
          test -f package-lock.json
          test -d node_modules
          echo "Integration checks passed."

      - name: Upload lockfile fingerprint for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: integration-metadata
          path: |
            ${{ env.APP_PATH }}/package.json
            ${{ env.APP_PATH }}/package-lock.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Quality control — lint + TypeScript project build (typecheck)
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration-check]
    timeout-minutes: 15
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration-check.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration-check.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: ESLint (static analysis)
        working-directory: ${{ env.APP_PATH }}
        run: npm run lint

      - name: TypeScript typecheck (tsc -b)
        working-directory: ${{ env.APP_PATH }}
        run: npx tsc -b --pretty false

  # ---------------------------------------------------------------------------
  # 3. Security testing — SAST + SCA + filesystem vulnerability scan
  # ---------------------------------------------------------------------------
  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    needs: [integration-check]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration-check.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration-check.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Create security reports directory
        run: mkdir -p "${GITHUB_WORKSPACE}/security-reports"

      # --- SAST: static analysis (standard report format: SARIF) ---
      - name: Setup Python (Semgrep)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: SAST — Semgrep (TypeScript / React / OWASP) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          # Community packs plus custom ERROR rules for plaintext credentials
          # that p/secrets and p/gitleaks miss (generic passwords, not tokens).
          RULES_FILE="${REPORT_DIR}/semgrep-custom-rules.yml"
          cat > "${RULES_FILE}" << 'SEMGREP_CUSTOM_RULES'
          rules:
            - id: heavy-rental.portal.hardcoded-credential-in-properties
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in a properties/env file (CWE-798). Use
                an environment variable or secrets manager. A plaintext
                password, secret, token, or API key in config is a shipping secret.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [secrets]
              paths:
                include:
                  - "*.properties"
                  - "*.env"
                  - "*.ini"
                  - ".env"
                  - ".env.*"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/node_modules/**"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*=[ \t]*(?!\$\{)(?!ENC\()(?!\{cipher\})(?![ \t]*(?:#|$))[^\s#]+
            - id: heavy-rental.portal.hardcoded-credential-in-yaml
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in YAML config (CWE-798). Use an
                environment variable or secrets manager instead of plaintext.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [secrets]
              paths:
                include:
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/.github/**"
                  - "**/node_modules/**"
              pattern-regex: >-
                (?i)^[ \t-]*["']?(?:[A-Za-z0-9._-]*[\._-])?(password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)["']?[ \t]*:[ \t]*(?!\$\{)(?!~)(?!null\b)(?!ENC\()(?!\{cipher\})(?!["']?[ \t]*(?:#|$))["']?[^\s#"']+
            - id: heavy-rental.portal.env-placeholder-plaintext-default
              languages: [regex]
              severity: ERROR
              message: >
                Placeholder ${VAR:default} embeds a plaintext credential
                default (CWE-798). Empty defaults (${VAR:} or ${VAR}) are OK.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [secrets]
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                  - "*.env"
                  - ".env"
                  - ".env.*"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*[=:][ \t]*\$\{[^}:]+:(?![ \t]*\})[^}]+\}
            - id: heavy-rental.portal.js-hardcoded-secret-assignment
              languages: [javascript, typescript]
              severity: ERROR
              message: >
                Hard-coded credential assigned in JavaScript/TypeScript (CWE-798).
                Inject the value from the environment or a secrets manager.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
                technology: [javascript, typescript, secrets]
              paths:
                exclude:
                  - "**/src/test/**"
                  - "**/*.spec.js"
                  - "**/*.spec.ts"
                  - "**/*.test.js"
                  - "**/*.test.ts"
                  - "**/node_modules/**"
                  - "**/dist/**"
              patterns:
                - pattern-either:
                    - pattern: const $VAR = "$VAL"
                    - pattern: let $VAR = "$VAL"
                    - pattern: var $VAR = "$VAL"
                    - pattern: $OBJ.$VAR = "$VAL"
                - metavariable-regex:
                    metavariable: $VAR
                    regex: (?i).*(password|passwd|secret|api[_]?key|token|credential).*
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?!\$\{|process\.env|import\.meta).{3,}
          SEMGREP_CUSTOM_RULES
          # run: | already strips this step's indent from the heredoc. A second
          # de-indent (sed) would pull nested list items to column 1 and break YAML.
          echo "==> Validating custom Semgrep rules"
          semgrep --validate --config="${RULES_FILE}" --metrics=off
          SEMGREP_COMMON=(
            --config=p/typescript
            --config=p/react
            --config=p/javascript
            --config=p/nodejs
            --config=p/owasp-top-ten
            --config=p/security-audit
            --config=p/secrets
            --config=p/cwe-top-25
            --config=p/gitleaks
            --config=p/sql-injection
            --config=p/jwt
            --config=p/insecure-transport
            --config="${RULES_FILE}"
            --metrics=off
          )

          # --- Pass 1: always write SARIF (standard report). Does not fail the step. ---
          echo "==> Semgrep report (SARIF 2.1.0)"
          set +e
          semgrep scan "${SEMGREP_COMMON[@]}" \
            --sarif \
            --output="${REPORT_DIR}/semgrep.sarif" \
            .
          SARIF_RC=$?
          set -e
          if [ -f "${REPORT_DIR}/semgrep.sarif" ]; then
            echo "SARIF written: ${REPORT_DIR}/semgrep.sarif (semgrep exit=${SARIF_RC}; non-zero is OK for report pass)"
          else
            echo "::warning::semgrep.sarif was not produced (exit=${SARIF_RC})"
          fi

          # --- Pass 2: CI gate — fail only if ERROR-severity findings exist. ---
          echo "==> SAST gate (ERROR severity only; exit 1 if findings)"
          set +e
          semgrep scan "${SEMGREP_COMMON[@]}" \
            --severity=ERROR \
            --error \
            --text \
            .
          GATE_RC=$?
          set -e
          if [ "${GATE_RC}" -ne 0 ]; then
            echo "::error::Semgrep SAST gate failed (exit=${GATE_RC})."
            echo "The SARIF report may still have been written successfully."
            echo "This step fails because --severity=ERROR --error found ERROR-level issues"
            echo "(or Semgrep could not complete the gate scan)."
            echo "Open security-reports/semgrep.sarif or the text findings above."
            exit "${GATE_RC}"
          fi
          echo "SAST (Semgrep) gate passed — no ERROR-level findings. SARIF: security-reports/semgrep.sarif"

      # --- SCA: dependency vulnerabilities (npm audit → SARIF) ---
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: SCA — npm audit (high / critical) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          mkdir -p "${REPORT_DIR}"
          # Gate + intermediate JSON; SARIF is the standard report artifact
          set +e
          npm audit --audit-level=high --json > "${REPORT_DIR}/npm-audit.json" 2>"${REPORT_DIR}/npm-audit-stderr.txt"
          AUDIT_EXIT=$?
          set -e
          # Convert npm audit JSON → SARIF 2.1.0 (standard security report format).
          # <<'PY' is unexpanded — read paths from the environment, not shell ${VAR}.
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          report_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "security-reports"
          report_dir.mkdir(parents=True, exist_ok=True)
          src = report_dir / "npm-audit.json"
          out = report_dir / "npm-audit.sarif"
          try:
              data = json.loads(src.read_text(encoding="utf-8") or "{}")
          except Exception as e:
              print(f"::warning::Could not parse npm audit JSON: {e}")
              data = {}
          results = []
          # npm audit v2: vulnerabilities map
          vulns = data.get("vulnerabilities") or {}
          if isinstance(vulns, dict):
              for name, v in vulns.items():
                  if not isinstance(v, dict):
                      continue
                  severity = (v.get("severity") or "warning").lower()
                  level = {
                      "critical": "error", "high": "error",
                      "moderate": "warning", "medium": "warning",
                      "low": "note", "info": "note",
                  }.get(severity, "warning")
                  via = v.get("via") or []
                  title = name
                  help_uri = ""
                  if via and isinstance(via[0], dict):
                      title = via[0].get("title") or name
                      help_uri = via[0].get("url") or ""
                  msg = f"{name}: {title} (severity={severity}, range={v.get('range', '')})"
                  results.append({
                      "ruleId": f"npm-audit/{name}",
                      "level": level,
                      "message": {"text": msg},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": "package-lock.json"},
                          }
                      }],
                      **({"properties": {"helpUri": help_uri}} if help_uri else {}),
                  })
          # npm audit v1: advisories map
          advisories = data.get("advisories") or {}
          if isinstance(advisories, dict):
              for adv_id, a in advisories.items():
                  if not isinstance(a, dict):
                      continue
                  severity = (a.get("severity") or "warning").lower()
                  level = {
                      "critical": "error", "high": "error",
                      "moderate": "warning", "medium": "warning",
                      "low": "note", "info": "note",
                  }.get(severity, "warning")
                  module = a.get("module_name") or "dependency"
                  title = a.get("title") or module
                  msg = f"{module}: {title} (severity={severity})"
                  results.append({
                      "ruleId": f"npm-audit/{adv_id}",
                      "level": level,
                      "message": {"text": msg},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": "package-lock.json"},
                          }
                      }],
                  })
          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "npm-audit",
                          "informationUri": "https://docs.npmjs.com/cli/commands/npm-audit",
                          "rules": [],
                      }
                  },
                  "results": results,
              }],
          }
          out.write_text(json.dumps(sarif, indent=2), encoding="utf-8")
          print(f"Wrote SARIF report: {out} ({len(results)} result(s))")
          PY
          if [ "${AUDIT_EXIT}" -ne 0 ]; then
            echo "::error::npm audit found high or critical vulnerabilities. See npm-audit.sarif"
            npm audit --audit-level=high || true
            exit "${AUDIT_EXIT}"
          fi
          echo "npm audit passed — SARIF report: security-reports/npm-audit.sarif"

      # --- Filesystem / supply-chain scan (standard report format: SARIF) ---
      # One shared Actions cache for vuln DB (avoids ~100MB re-download per step).
      # Weekly key; restore-keys fall back to any prior OS cache. Per-step trivy cache is off.
      - name: Trivy cache key
        id: trivy-cache-meta
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DBs
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache-meta.outputs.week }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Pass 1: always write SARIF (standard report). Do not fail the step on findings —
      # otherwise SARIF mode hides the vulns in the log and only shows exit code 1.
      - name: Trivy filesystem scan (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: security-reports/trivy-fs.sarif
          ignore-unfixed: true
          scanners: vuln
          # Shared job-level cache above; disable nested restore/save per scan
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # Pass 2: human-readable findings in the job log (never blocks).
      - name: Trivy filesystem scan (console table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          ignore-unfixed: true
          scanners: vuln
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # Pass 3: CI gate — fail only on CRITICAL, unfixed vulns (mirrors Semgrep ERROR gate).
      - name: Trivy SCA gate (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true
          scanners: vuln
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # --- Publish SARIF security reports to GitHub Code Scanning ---
      - name: Upload Semgrep SARIF to Code Scanning
        if: always() && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: web-portal-semgrep
        continue-on-error: true

      - name: Upload npm audit SARIF to Code Scanning
        if: always() && hashFiles('security-reports/npm-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/npm-audit.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: web-portal-npm-audit
        continue-on-error: true

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('security-reports/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/trivy-fs.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: web-portal-trivy-fs
        continue-on-error: true

      # Combined human-readable PDF. Keep in sync with
      # heavy-rental-project-pipeline-development/scripts/combine-security-report.py
      # Download on a pull request: Checks → this workflow → Summary → Artifacts
      # (`security-combined-report-pdf`), or the Security Testing job summary link.
      - name: Install reportlab (combined security PDF)
        if: always()
        run: pip install --quiet reportlab

      - name: Combine security reports into PDF
        if: always()
        env:
          COMBINED_PDF_TITLE: Heavy Rental Web Portal — Combined security report
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          mkdir -p "${REPORT_DIR}"
          cat > "${REPORT_DIR}/combine-security-report.py" << 'COMBINE_SECURITY_REPORT_PY'
          #!/usr/bin/env python3
          """Combine SARIF 2.1.0 files (and optional pip-audit JSON) into one PDF.

          Keep this file in sync with the heredoc in each Integration CI
          ``integration-pipeline.yml`` Security Testing job.

          Code snippets from SARIF regions are never copied into the PDF (secret-scanner
          hits can echo credentials).
          """

          from __future__ import annotations

          import argparse
          import json
          import sys
          from collections import Counter
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.sax.saxutils import escape as xml_escape

          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import inch
          from reportlab.platypus import (
              PageBreak,
              Paragraph,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )

          MAX_MESSAGE = 400
          MAX_FINDINGS_PER_TOOL = 200
          SKIP_NAMES = {
              "combined-security-report.pdf",
              "combine-security-report.py",
          }


          @dataclass
          class Finding:
              rule_id: str
              level: str
              location: str
              message: str


          @dataclass
          class ToolReport:
              name: str
              source_file: str
              present: bool
              findings: list[Finding] = field(default_factory=list)
              note: str = ""


          def pdf_safe(text: str) -> str:
              raw = "" if text is None else str(text)
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              raw = raw.encode("latin-1", "replace").decode("latin-1")
              return xml_escape(raw)


          def truncate(text: str, limit: int = MAX_MESSAGE) -> str:
              text = " ".join((text or "").split())
              if len(text) <= limit:
                  return text
              return text[: limit - 1] + "…"


          def result_level(result: dict, rules_by_id: dict) -> str:
              level = (result.get("level") or "").strip().lower()
              if level:
                  return level
              rule_id = result.get("ruleId") or ""
              rule = rules_by_id.get(rule_id) or {}
              default = (rule.get("defaultConfiguration") or {}).get("level") or ""
              return (default or "warning").strip().lower()


          def result_location(result: dict) -> str:
              locations = result.get("locations") or []
              if not locations or not isinstance(locations[0], dict):
                  return "—"
              phys = locations[0].get("physicalLocation") or {}
              uri = ((phys.get("artifactLocation") or {}).get("uri")) or "—"
              region = phys.get("region") or {}
              line = region.get("startLine")
              if line:
                  return f"{uri}:{line}"
              return str(uri)


          def result_message(result: dict) -> str:
              message = result.get("message") or {}
              if isinstance(message, dict):
                  return truncate(message.get("text") or message.get("markdown") or "")
              return truncate(str(message))


          def parse_sarif(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return ToolReport(
                      name=path.stem,
                      source_file=path.name,
                      present=True,
                      note=f"Could not parse SARIF: {exc}",
                  )
              findings: list[Finding] = []
              tool_names: list[str] = []
              for run in data.get("runs") or []:
                  if not isinstance(run, dict):
                      continue
                  driver = ((run.get("tool") or {}).get("driver")) or {}
                  name = driver.get("name") or path.stem
                  tool_names.append(str(name))
                  rules_by_id = {}
                  for rule in driver.get("rules") or []:
                      if isinstance(rule, dict) and rule.get("id"):
                          rules_by_id[rule["id"]] = rule
                  for result in run.get("results") or []:
                      if not isinstance(result, dict):
                          continue
                      findings.append(
                          Finding(
                              rule_id=str(result.get("ruleId") or "—"),
                              level=result_level(result, rules_by_id),
                              location=result_location(result),
                              message=result_message(result),
                          )
                      )
              display = tool_names[0] if len(set(tool_names)) == 1 else (tool_names[0] if tool_names else path.stem)
              if len(set(tool_names)) > 1:
                  display = f"{display} (+{len(set(tool_names)) - 1} tools)"
              return ToolReport(name=str(display), source_file=path.name, present=True, findings=findings)


          def _pip_audit_rows(data: object) -> list[dict]:
              if isinstance(data, list):
                  return [row for row in data if isinstance(row, dict)]
              if isinstance(data, dict):
                  deps = data.get("dependencies")
                  if isinstance(deps, list):
                      return [row for row in deps if isinstance(row, dict)]
              return []


          def parse_pip_audit(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return ToolReport(
                      name="pip-audit",
                      source_file=path.name,
                      present=True,
                      note=f"Could not parse pip-audit JSON: {exc}",
                  )
              findings: list[Finding] = []
              for dep in _pip_audit_rows(data):
                  pkg = dep.get("name") or "package"
                  version = dep.get("version") or "?"
                  for vuln in dep.get("vulns") or []:
                      if not isinstance(vuln, dict):
                          continue
                      vuln_id = vuln.get("id") or "unspecified"
                      fixes = vuln.get("fix_versions") or []
                      if isinstance(fixes, list):
                          fix_txt = ", ".join(str(v) for v in fixes) or "none listed"
                      else:
                          fix_txt = str(fixes)
                      desc = truncate(vuln.get("description") or "")
                      msg = f"{pkg} {version}; fix: {fix_txt}"
                      if desc:
                          msg = f"{msg}. {desc}"
                      findings.append(
                          Finding(
                              rule_id=str(vuln_id),
                              level="warning",
                              location=f"{pkg}=={version}",
                              message=truncate(msg),
                          )
                      )
              return ToolReport(name="pip-audit", source_file=path.name, present=True, findings=findings)


          def collect_reports(input_dir: Path) -> list[ToolReport]:
              reports: list[ToolReport] = []
              if not input_dir.is_dir():
                  return reports
              for path in sorted(input_dir.glob("*.sarif")):
                  if path.name in SKIP_NAMES:
                      continue
                  reports.append(parse_sarif(path))
              pip_audit = input_dir / "pip-audit.json"
              if pip_audit.is_file():
                  reports.append(parse_pip_audit(pip_audit))
              return reports


          def level_counts(findings: list[Finding]) -> str:
              counts = Counter(f.level for f in findings)
              if not findings:
                  return "0"
              order = ["error", "warning", "note", "none"]
              parts = [f"{lvl}={counts[lvl]}" for lvl in order if counts.get(lvl)]
              extra = sorted(k for k in counts if k not in order)
              parts.extend(f"{lvl}={counts[lvl]}" for lvl in extra)
              return f"{len(findings)} ({', '.join(parts)})"


          def _styles() -> dict:
              styles = getSampleStyleSheet()
              styles.add(
                  ParagraphStyle(
                      name="Meta",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=9,
                      leading=12,
                      textColor=colors.HexColor("#333333"),
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="Cell",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=8,
                      leading=10,
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="CellHead",
                      parent=styles["Normal"],
                      fontName="Helvetica-Bold",
                      fontSize=8,
                      leading=10,
                  )
              )
              return styles


          def _table(rows: list[list], col_widths: list[float]) -> Table:
              table = Table(rows, colWidths=col_widths, repeatRows=1)
              table.setStyle(
                  TableStyle(
                      [
                          ("GRID", (0, 0), (-1, -1), 0.4, colors.grey),
                          ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#e8eef4")),
                          ("VALIGN", (0, 0), (-1, -1), "TOP"),
                          ("LEFTPADDING", (0, 0), (-1, -1), 4),
                          ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                          ("TOPPADDING", (0, 0), (-1, -1), 3),
                          ("BOTTOMPADDING", (0, 0), (-1, -1), 3),
                      ]
                  )
              )
              return table


          def build_story(reports: list[ToolReport], args: argparse.Namespace) -> list:
              styles = _styles()
              cell, head = styles["Cell"], styles["CellHead"]
              story: list = [
                  Paragraph(pdf_safe(args.title), styles["Title"]),
                  Spacer(1, 8),
                  Paragraph(f"<b>Repository:</b> {pdf_safe(args.repo)}", styles["Meta"]),
                  Paragraph(f"<b>Commit:</b> {pdf_safe(args.sha)}", styles["Meta"]),
                  Paragraph(f"<b>Workflow run:</b> {pdf_safe(args.run_url)}", styles["Meta"]),
                  Paragraph(
                      f"<b>Generated (UTC):</b> {pdf_safe(datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ'))}",
                      styles["Meta"],
                  ),
                  Paragraph(
                      "Machine-readable reports remain SARIF 2.1.0. This PDF is a human download. "
                      "Source snippets are omitted so secret-scanner matches are not echoed.",
                      styles["Meta"],
                  ),
                  Spacer(1, 14),
                  Paragraph("Summary", styles["Heading1"]),
              ]
              usable = 7.5 * inch
              if not reports:
                  story.append(Paragraph("No scanner outputs were produced in security-reports/.", styles["Normal"]))
                  return story

              summary_rows = [[
                  Paragraph("Tool", head),
                  Paragraph("File", head),
                  Paragraph("Present", head),
                  Paragraph("Findings", head),
              ]]
              for report in reports:
                  summary_rows.append([
                      Paragraph(pdf_safe(report.name), cell),
                      Paragraph(pdf_safe(report.source_file), cell),
                      Paragraph("yes" if report.present else "no", cell),
                      Paragraph(pdf_safe(level_counts(report.findings)), cell),
                  ])
              story.append(_table(summary_rows, [1.6 * inch, 2.0 * inch, 0.8 * inch, usable - 4.4 * inch]))
              story.append(Spacer(1, 12))

              for index, report in enumerate(reports):
                  if index:
                      story.append(PageBreak())
                  story.append(Paragraph(pdf_safe(f"{report.name} ({report.source_file})"), styles["Heading1"]))
                  if report.note:
                      story.append(Paragraph(pdf_safe(report.note), styles["Normal"]))
                  if not report.findings:
                      story.append(Paragraph("No findings in this report.", styles["Normal"]))
                      continue
                  shown = report.findings[:MAX_FINDINGS_PER_TOOL]
                  omitted = len(report.findings) - len(shown)
                  rows = [[
                      Paragraph("Level", head),
                      Paragraph("Rule", head),
                      Paragraph("Location", head),
                      Paragraph("Message", head),
                  ]]
                  for finding in shown:
                      rows.append([
                          Paragraph(pdf_safe(finding.level), cell),
                          Paragraph(pdf_safe(finding.rule_id), cell),
                          Paragraph(pdf_safe(finding.location), cell),
                          Paragraph(pdf_safe(finding.message).replace("\n", "<br/>"), cell),
                      ])
                  story.append(
                      _table(rows, [0.8 * inch, 1.6 * inch, 2.0 * inch, usable - 4.4 * inch])
                  )
                  if omitted > 0:
                      story.append(Spacer(1, 6))
                      story.append(
                          Paragraph(pdf_safe(f"… and {omitted} more finding(s) not listed."), styles["Meta"])
                      )
              return story


          def add_page_number(canvas, doc) -> None:
              canvas.saveState()
              canvas.setFont("Helvetica", 8)
              canvas.setFillColor(colors.HexColor("#555555"))
              canvas.drawString(0.75 * inch, 0.45 * inch, "Combined security report")
              canvas.drawRightString(letter[0] - 0.75 * inch, 0.45 * inch, f"Page {doc.page}")
              canvas.restoreState()


          def write_pdf(reports: list[ToolReport], args: argparse.Namespace) -> None:
              output = Path(args.output)
              output.parent.mkdir(parents=True, exist_ok=True)
              doc = SimpleDocTemplate(
                  str(output),
                  pagesize=letter,
                  leftMargin=0.75 * inch,
                  rightMargin=0.75 * inch,
                  topMargin=0.7 * inch,
                  bottomMargin=0.7 * inch,
                  title=args.title,
                  author="Heavy Rental Integration CI",
              )
              doc.build(build_story(reports, args), onFirstPage=add_page_number, onLaterPages=add_page_number)


          def parse_args(argv: list[str] | None = None) -> argparse.Namespace:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--input-dir", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--title", default="Combined security report")
              parser.add_argument("--repo", default="")
              parser.add_argument("--sha", default="")
              parser.add_argument("--run-url", default="")
              return parser.parse_args(argv)


          def main(argv: list[str] | None = None) -> int:
              args = parse_args(argv)
              reports = collect_reports(Path(args.input_dir))
              write_pdf(reports, args)
              output = Path(args.output)
              if not output.is_file() or output.stat().st_size == 0:
                  print(f"error: PDF was not written: {output}", file=sys.stderr)
                  return 1
              print(f"Wrote {output} ({output.stat().st_size} bytes, {len(reports)} report(s))")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          COMBINE_SECURITY_REPORT_PY
          python3 "${REPORT_DIR}/combine-security-report.py" \
            --input-dir "${REPORT_DIR}" \
            --output "${REPORT_DIR}/combined-security-report.pdf" \
            --title "${COMBINED_PDF_TITLE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -s "${REPORT_DIR}/combined-security-report.pdf"

      - name: Upload combined security report (PDF)
        if: always() && hashFiles('security-reports/combined-security-report.pdf') != ''
        id: upload-security-pdf
        uses: actions/upload-artifact@v7
        with:
          name: security-combined-report-pdf
          path: security-reports/combined-security-report.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Publish PDF download on Checks
        if: always() && steps.upload-security-pdf.outputs.artifact-url != ''
        env:
          PDF_URL: ${{ steps.upload-security-pdf.outputs.artifact-url }}
        run: |
          {
            echo "### Combined security report (PDF)"
            echo ""
            echo "Download from this check: [combined-security-report.pdf](${PDF_URL})"
            echo ""
            echo "Artifact: \`security-combined-report-pdf\`."
            echo "On a pull request: Checks → this workflow run → Artifacts, or this job summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PDF check on pull request
        if: always() && github.event_name == 'pull_request' && steps.upload-security-pdf.outputs.artifact-url != ''
        continue-on-error: true
        env:
          PDF_URL: ${{ steps.upload-security-pdf.outputs.artifact-url }}
        uses: actions/github-script@v9
        with:
          script: |
            const url = process.env.PDF_URL;
            const sha = context.payload.pull_request.head.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Security combined report (PDF)',
              head_sha: sha,
              status: 'completed',
              conclusion: 'neutral',
              details_url: url,
              output: {
                title: 'Download combined security report PDF',
                summary: [
                  'Combined SAST/SCA report for this pull request.',
                  '',
                  '[Download combined-security-report.pdf](' + url + ')',
                  '',
                  'Also on this workflow run: Checks → Summary → Artifacts → `security-combined-report-pdf`.',
                ].join('\n'),
              },
            });

      - name: Upload security reports (SARIF)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-sarif
          path: |
            security-reports/*.sarif
            security-reports/combined-security-report.pdf
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 4. CodeQL analysis — GitHub CodeQL for JavaScript / TypeScript
  #    Runs after Integration Check; parallel with QC, Security, and REST tests.
  #    Results appear under the repository Security → Code scanning alerts.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [integration-check]
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration-check.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration-check.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Initialize CodeQL (JavaScript / TypeScript)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: ${{ env.APP_PATH }}
          # security-and-quality: security rules + maintainability / reliability
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies for CodeQL (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      # Optional build improves extraction for TypeScript projects that emit JS
      - name: Build for CodeQL (TypeScript project build)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          # Prefer tsc project build; fall back to vite build if no tsc -b setup
          if npx tsc -b --pretty false 2>/dev/null; then
            echo "TypeScript project build completed for CodeQL."
          elif npm run build --if-present; then
            echo "npm run build completed for CodeQL."
          else
            echo "No build step available; CodeQL will analyze sources as-is."
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "web-portal-ci-codeql-js"

      - name: CodeQL summary
        if: always()
        run: |
          {
            echo "### CodeQL Analysis"
            echo ""
            echo "Language: JavaScript / TypeScript"
            echo "Query suite: security-and-quality"
            echo "Category: web-portal-ci-codeql-js"
            echo ""
            echo "View results: repository → Security → Code scanning alerts"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. REST endpoint tests against a local mock server
  # ---------------------------------------------------------------------------
  # Flow (no live backend):
  #   start mock server → wait until healthy → run HTTP tests → stop mock server
  #
  # Contract with the portal application (when endpoints exist):
  #
  #   Mock server scripts (first match wins):
  #     - mock:server     (preferred)  e.g. "prism mock openapi/openapi.yaml -h 127.0.0.1 -p 4010"
  #     - api:mock
  #     - start:mock
  #
  #   Test scripts (first match wins):
  #     - test:api        (preferred)  e.g. "vitest run --config vitest.api.config.ts"
  #     - test:endpoints
  #     - test:rest
  #
  # Tests must call the mock via MOCK_API_BASE_URL (default http://127.0.0.1:4010).
  # Prefer a /health (or equivalent) route on the mock so CI can wait for readiness.
  # Override readiness with MOCK_API_HEALTH_PATH if needed.
  #
  # Until both a mock-server script and a test script exist, this job succeeds
  # with an explicit "not ready" note so CI stays green during API development.
  # ---------------------------------------------------------------------------
  rest-endpoint-tests:
    name: REST Endpoint Tests
    runs-on: ubuntu-latest
    needs: [integration-check]
    timeout-minutes: 20
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration-check.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration-check.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Detect mock server and REST test scripts
        id: detect
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail

          has_script() {
            local name="$1"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              process.exit(p.scripts && p.scripts['${name}'] ? 0 : 1);
            "
          }

          MOCK_SCRIPT=""
          for script in mock:server api:mock start:mock; do
            if has_script "$script"; then
              MOCK_SCRIPT="$script"
              break
            fi
          done

          TEST_SCRIPT=""
          for script in test:api test:endpoints test:rest; do
            if has_script "$script"; then
              TEST_SCRIPT="$script"
              break
            fi
          done

          echo "mock_script=${MOCK_SCRIPT}" >> "$GITHUB_OUTPUT"
          echo "test_script=${TEST_SCRIPT}" >> "$GITHUB_OUTPUT"

          if [ -n "$MOCK_SCRIPT" ] && [ -n "$TEST_SCRIPT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Detected mock server: npm run $MOCK_SCRIPT"
            echo "Detected tests:       npm run $TEST_SCRIPT"
            echo "Mock base URL:        ${{ env.MOCK_API_BASE_URL }}"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Mock script found: ${MOCK_SCRIPT:-<none>}"
            echo "Test script found: ${TEST_SCRIPT:-<none>}"
            echo "Both are required to run REST endpoint tests against a mock server."
          fi

      - name: REST endpoint mock-server tests (placeholder — not defined yet)
        if: steps.detect.outputs.ready != 'true'
        run: |
          set -euo pipefail
          {
            echo "### REST endpoint tests (mock server)"
            echo ""
            echo "Status: **skipped (placeholder)** — mock server and/or endpoint tests not defined yet."
            echo ""
            echo "When ready, expose **both** of the following in the portal \`package.json\`:"
            echo ""
            echo "#### 1. Mock server (long-running process)"
            echo ""
            echo "| Priority | npm script | Example |"
            echo "| --- | --- | --- |"
            echo "| 1 (preferred) | \`mock:server\` | \`prism mock openapi/openapi.yaml -h 127.0.0.1 -p 4010\` |"
            echo "| 2 | \`api:mock\` | \`json-server --host 127.0.0.1 --port 4010 mock/db.json\` |"
            echo "| 3 | \`start:mock\` | \`node mocks/server.js\` |"
            echo ""
            echo "#### 2. Tests that call the mock over HTTP"
            echo ""
            echo "| Priority | npm script | Example |"
            echo "| --- | --- | --- |"
            echo "| 1 (preferred) | \`test:api\` | \`vitest run --config vitest.api.config.ts\` |"
            echo "| 2 | \`test:endpoints\` | \`jest --config jest.endpoints.config.js\` |"
            echo "| 3 | \`test:rest\` | \`npm run test -- --grep rest\` |"
            echo ""
            echo "CI sets:"
            echo ""
            echo "- \`MOCK_API_BASE_URL=${{ env.MOCK_API_BASE_URL }}\`"
            echo "- \`MOCK_API_HOST=${{ env.MOCK_API_HOST }}\`"
            echo "- \`MOCK_API_PORT=${{ env.MOCK_API_PORT }}\`"
            echo ""
            echo "Point client code / tests at \`process.env.MOCK_API_BASE_URL\` (or \`API_BASE_URL\`)."
            echo "Expose a health route (default \`${{ env.MOCK_API_HEALTH_PATH }}\`) so CI can wait for readiness."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "REST endpoint mock-server tests not defined yet — placeholder step passed."

      - name: Start mock REST server
        id: mock-server
        if: steps.detect.outputs.ready == 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/test-reports"
          mkdir -p "$REPORT_DIR"

          MOCK_SCRIPT="${{ steps.detect.outputs.mock_script }}"
          LOG_FILE="${REPORT_DIR}/mock-server.log"
          PID_FILE="${REPORT_DIR}/mock-server.pid"

          echo "==> Starting mock server: npm run $MOCK_SCRIPT"
          echo "    MOCK_API_BASE_URL=${MOCK_API_BASE_URL}"
          echo "    health check: ${MOCK_API_BASE_URL}${MOCK_API_HEALTH_PATH}"

          # Background the mock server; capture logs for artifacts.
          # Prefer the portal binding to MOCK_API_HOST/PORT from the environment.
          nohup npm run "$MOCK_SCRIPT" >"$LOG_FILE" 2>&1 &
          echo $! >"$PID_FILE"
          echo "Mock server PID $(cat "$PID_FILE")"

          # Wait until the mock accepts HTTP (health path preferred, then base URL).
          READY_URLS=(
            "${MOCK_API_BASE_URL}${MOCK_API_HEALTH_PATH}"
            "${MOCK_API_BASE_URL}/"
            "${MOCK_API_BASE_URL}"
          )
          deadline=$((SECONDS + MOCK_API_READY_TIMEOUT_SECONDS))
          ready=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "::error::Mock server process exited before becoming ready. Log:"
              cat "$LOG_FILE" || true
              exit 1
            fi
            for url in "${READY_URLS[@]}"; do
              # Any HTTP response (including 4xx) means the server is listening.
              if curl -sS -o /dev/null -w "%{http_code}" --max-time 2 "$url" | grep -Eq '^[0-9]{3}$'; then
                echo "Mock server is accepting requests at $url"
                ready=true
                break 2
              fi
            done
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Timed out after ${MOCK_API_READY_TIMEOUT_SECONDS}s waiting for mock server at ${MOCK_API_BASE_URL}"
            echo "--- mock server log ---"
            cat "$LOG_FILE" || true
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            exit 1
          fi

          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Run REST endpoint tests against mock server
        if: steps.detect.outputs.ready == 'true'
        working-directory: ${{ env.APP_PATH }}
        env:
          # Explicit aliases so tests / client code can use either name
          API_BASE_URL: ${{ env.MOCK_API_BASE_URL }}
          VITE_API_BASE_URL: ${{ env.MOCK_API_BASE_URL }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/test-reports"
          mkdir -p "$REPORT_DIR"
          TEST_SCRIPT="${{ steps.detect.outputs.test_script }}"

          echo "==> Running REST endpoint tests against mock server"
          echo "    npm run $TEST_SCRIPT"
          echo "    MOCK_API_BASE_URL=${MOCK_API_BASE_URL}"
          echo "    API_BASE_URL=${API_BASE_URL}"

          set -o pipefail
          npm run "$TEST_SCRIPT" 2>&1 | tee "${REPORT_DIR}/rest-endpoint-tests.txt"

          {
            echo "### REST endpoint tests (mock server)"
            echo ""
            echo "Status: **passed**"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mock script | \`npm run ${{ steps.detect.outputs.mock_script }}\` |"
            echo "| Test script | \`npm run $TEST_SCRIPT\` |"
            echo "| Base URL | \`${MOCK_API_BASE_URL}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "REST endpoint tests against mock server passed."

      - name: Stop mock REST server
        if: always() && steps.detect.outputs.ready == 'true' && steps.mock-server.outputs.started == 'true'
        run: |
          set -euo pipefail
          PID_FILE="${GITHUB_WORKSPACE}/test-reports/mock-server.pid"
          if [ -f "$PID_FILE" ]; then
            PID="$(cat "$PID_FILE")"
            echo "Stopping mock server PID $PID"
            # Kill the npm process and its process group children if possible.
            kill "$PID" 2>/dev/null || true
            # Best-effort: also stop anything still bound to the mock port.
            if command -v fuser >/dev/null 2>&1; then
              fuser -k "${{ env.MOCK_API_PORT }}/tcp" 2>/dev/null || true
            fi
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
            echo "Mock server stopped."
          else
            echo "No mock server PID file found; nothing to stop."
          fi

      - name: Upload REST endpoint test reports
        if: always() && steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rest-endpoint-test-reports
          path: test-reports/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 6. GitHub Flow CI gate — aggregate status for branch protection
  #    Integration Check is evaluated first (highest priority); then QC, Security,
  #    CodeQL, and REST Endpoint Tests.
  # ---------------------------------------------------------------------------
  github-flow-gate:
    name: GitHub Flow CI Gate
    runs-on: ubuntu-latest
    # Always run so a failed Integration Check still produces a red gate check
    if: always()
    needs:
      - integration-check
      - quality-control
      - security-testing
      - codeql
      - rest-endpoint-tests
    timeout-minutes: 5
    steps:
      - name: Enforce Integration Check priority and full CI green
        env:
          INTEGRATION: ${{ needs.integration-check.result }}
          QUALITY: ${{ needs.quality-control.result }}
          SECURITY: ${{ needs.security-testing.result }}
          CODEQL: ${{ needs.codeql.result }}
          REST_TESTS: ${{ needs.rest-endpoint-tests.result }}
        run: |
          set -euo pipefail

          {
            echo "### GitHub Flow CI gate (web portal)"
            echo ""
            echo "| Job | Result | Priority |"
            echo "| --- | --- | --- |"
            echo "| Integration Check | \`${INTEGRATION}\` | **1 (highest)** |"
            echo "| Quality Control | \`${QUALITY}\` | 2 |"
            echo "| Security Testing | \`${SECURITY}\` | 2 |"
            echo "| CodeQL Analysis | \`${CODEQL}\` | 2 |"
            echo "| REST Endpoint Tests | \`${REST_TESTS}\` | 3 |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Integration Check (priority 1): ${INTEGRATION}"
          echo "Quality Control (priority 2): ${QUALITY}"
          echo "Security Testing (priority 2): ${SECURITY}"
          echo "CodeQL Analysis (priority 2): ${CODEQL}"
          echo "REST Endpoint Tests (priority 3): ${REST_TESTS}"

          if [ "${INTEGRATION}" != "success" ]; then
            echo "::error::Integration Check is the highest-priority gate and did not succeed (result=${INTEGRATION})."
            echo "Fix Integration Check before Quality Control / Security / CodeQL / REST tests can proceed."
            exit 1
          fi
          if [ "${QUALITY}" != "success" ]; then
            echo "::error::Quality Control did not succeed (result=${QUALITY})."
            exit 1
          fi
          if [ "${SECURITY}" != "success" ]; then
            echo "::error::Security Testing did not succeed (result=${SECURITY})."
            exit 1
          fi
          if [ "${CODEQL}" != "success" ]; then
            echo "::error::CodeQL Analysis did not succeed (result=${CODEQL})."
            exit 1
          fi
          if [ "${REST_TESTS}" != "success" ]; then
            echo "::error::REST Endpoint Tests did not succeed (result=${REST_TESTS})."
            exit 1
          fi

          echo "GitHub Flow CI gate passed: Integration Check first, then QC + Security + CodeQL + REST Endpoint Tests."
