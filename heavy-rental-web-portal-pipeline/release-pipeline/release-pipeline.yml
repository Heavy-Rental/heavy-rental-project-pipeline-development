# =============================================================================
# Heavy Rental Web Portal — Release CI Pipeline (reusable)
# =============================================================================
# Stages:
#   1. Integration       — checkout, Node 22, npm ci, install health
#   2. Quality Control   — ESLint + TypeScript (needs Integration)
#   3. Security Testing  — Semgrep + npm audit + Trivy (needs Integration)
#   4. CodeQL Analysis   — GitHub CodeQL for JavaScript/TypeScript (needs Integration)
#   5. Packaging         — Vite dist zip + Docker image (needs Integration + QC + Security + CodeQL)
#   Security report format (standard): SARIF 2.1.0
#     - Semgrep → semgrep.sarif
#     - npm audit → npm-audit.sarif (converted from audit JSON)
#     - Trivy FS → trivy-fs.sarif
#     - CodeQL → GitHub Code Scanning (native SARIF via analyze)
#   DAST (Release): ZAP JSON/HTML, Dastardly XML, Nuclei JSONL, plus
#     combined-dast-report.pdf (artifact dast-combined-report-pdf).
#
# Same gates as integration-pipeline.yml, plus production build + versioned
# archive artifacts for deploy pipelines to consume.
#
# Packaging output (Vite SPA static deploy):
#   npm run build → dist/ (index.html + assets/*.js|*.css|…)
#   Deploy archive: .zip of dist/ contents (web-server static root)
#   Docker image:   always-generated nginx serving dist/ (SPA try_files);
#                   app Dockerfile is not the deploy image. GHCR
#                   heavy_rental_web_portal:<semver> + :latest (not on PR)
#                   <semver> is previous GHCR x.y.z patch-bumped (first: 1.0.0)
#                   Packaging starts the image and requires GET / + SPA fallback
#   Cloud-ready: tsc + vite build --mode api (Spring login / cart / deposit).
#   Empty VITE_API_TARGET and VITE_* backends (same-origin /api).
#   No REST_BASE_URL / Stripe sk_ / AWS keys in ENV/ARG or COPY .env.
#   Baked nginx is try_files only so CD can mount /api → SM REST_BASE_URL.
#
# Application:
#   https://github.com/SA62-team1/heavy-rental-react-web-portal
#   React 19 + TypeScript + Vite 8 (npm)
#
# How the portal uses this on release
# -----------------------------------
# Install both files into the React web portal repository:
#
#   .github/workflows/release-pipeline.yml       ← this file (reusable only)
#   .github/workflows/portal-release-caller.yml  ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than portal-release-caller.yml.
#
# Invoked via portal-release-caller.yml when:
#   - a GitHub Release is published, or
#   - a pull request is opened/updated from develop → master
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/release-pipeline.yml
#
# Also mirrored in the pipeline-development repo for discovery/testing:
#   .github/workflows/web-portal-release.yml
# Keep this file and that mirror in sync when developing here.
#
# Local validation (from pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-web-portal-pipeline/release-pipeline/release-pipeline.yml
#   actionlint .github/workflows/web-portal-release.yml
# =============================================================================

name: Web Portal Release CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/portal-release-caller.yml (enforced below).
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required when the portal invokes this workflow).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for release / develop→master PR.
        required: false
        type: string
        default: ""

# One run per release tag or develop→master PR; do not cancel in-flight packaging
concurrency:
  group: web-portal-release-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  # Required for github/codeql-action/analyze
  security-events: write
  actions: read
  # Required to push release images to GHCR
  packages: write

env:
  NODE_VERSION: "22"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/heavy-rental-react-web-portal
  DEFAULT_APP_REF: master
  IMAGE_NAME: heavy_rental_web_portal
  NGINX_BASE_IMAGE: nginx:1.27-alpine
  # Stable artifact names so DAST/Publish do not depend on packaging job outputs
  # (needs.*.outputs is empty for jobs with environment: in this reusable workflow).
  IMAGE_ARCHIVE: heavy_rental_web_portal-image.tar.gz
  IMAGE_META: image-meta.env

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only portal-release-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only portal-release-caller.yml
        env:
          # github context is that of the caller workflow for reusable workflows
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/portal-release-caller.yml@*)
              echo "Allowed caller: portal-release-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`portal-release-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::release-pipeline.yml may only be invoked by .github/workflows/portal-release-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration — fetch source, install dependencies, verify install health
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 15
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
      node-modules-cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="master"
            MODE=remote
          else
            # portal-release-caller.yml in the same repo: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="master"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (release / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Report dependency cache status
        run: |
          if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" = "true" ]; then
            echo "node_modules restored from cache (skipped npm ci)."
          else
            echo "node_modules cache miss — installed with npm ci; cache will be saved at job end."
          fi
          echo "Lockfile hash key uses package-lock.json + Node ${{ env.NODE_VERSION }} + ${{ runner.os }}"

      - name: Verify install integrity
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Node / npm versions"
          node --version
          npm --version
          echo "==> package.json scripts"
          npm run | head -n 50 || true
          echo "==> Dependency tree (top level)"
          npm ls --depth=0
          test -f package-lock.json
          test -d node_modules
          echo "Integration checks passed."

      - name: Upload lockfile fingerprint for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-integration-metadata
          path: |
            ${{ env.APP_PATH }}/package.json
            ${{ env.APP_PATH }}/package-lock.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Quality control — lint + TypeScript project build (typecheck)
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 15
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: ESLint (static analysis)
        working-directory: ${{ env.APP_PATH }}
        run: npm run lint

      - name: TypeScript typecheck (tsc -b)
        working-directory: ${{ env.APP_PATH }}
        run: npx tsc -b --pretty false

  # ---------------------------------------------------------------------------
  # 3. Security testing — SAST + SCA + filesystem vulnerability scan
  # ---------------------------------------------------------------------------
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    # Academy var VITE_STRIPE_PUBLISHABLE_KEY is only visible with environment:.
    # Other Release jobs stay unscoped (no Vocareum on Integration/QC).
    environment: academy
    # Integration first; packaging waits for QC
    needs: [integration, quality-control]
    outputs:
      image_tag: ${{ steps.package.outputs.image_tag }}
      image_local: ${{ steps.package.outputs.image_local }}
      image_remote: ${{ steps.package.outputs.image_remote }}
      image_remote_latest: ${{ steps.package.outputs.image_remote_latest }}
      image_tar: ${{ steps.package.outputs.image_tar }}
      version: ${{ steps.package.outputs.version }}
    timeout-minutes: 30
    env:
      # Vite default outDir — change only if portal vite.config sets build.outDir
      VITE_DIST_DIR: dist
      # Deploy archive extension for static Vite SPA web-server deployment
      PACKAGE_EXT: zip
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Seed and scan Vite .env.production
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          fallback = (
              "# Generated by portal Release Packaging (Vite production profile)\n"
              "# Empty backends: SPA uses same-origin /api (CD mounts REST_BASE_URL).\n"
              "VITE_API_URL=\n"
              "VITE_REST_URL=\n"
              "VITE_REST_BASE_URL=\n"
              "VITE_HAYSTACK_URL=\n"
              "VITE_HAYSTACK_BASE_URL=\n"
          )
          candidates = [Path(".env.production"), Path("docs/samples/.env.production")]
          src = next((p for p in candidates if p.is_file()), None)
          if src is None:
              Path(".env.production").write_text(fallback, encoding="utf-8")
              print("Wrote .env.production from generated Vite production defaults.")
              text = fallback
              origin = "generated defaults"
          else:
              dest = Path(".env.production")
              if src.resolve() != dest.resolve():
                  dest.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
              text = dest.read_text(encoding="utf-8")
              origin = str(src)
              print(f"Using Vite production profile from {origin}")

          secret_re = re.compile(
              r"(?i)(sk_live_|sk_test_|whsec_|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE KEY)"
          )
          backend_keys = {
              "VITE_API_URL", "VITE_REST_URL", "VITE_REST_BASE_URL",
              "VITE_HAYSTACK_URL", "VITE_HAYSTACK_BASE_URL",
              "REST_BASE_URL", "HAYSTACK_BASE_URL",
          }
          forbidden_assign = {
              "STRIPE_API_KEY", "STRIPE_WEBHOOK_SECRET", "APP_JWT_SECRET",
              "POSTGRES_PASSWORD", "POSTGRES_HOSTNAME", "AWS_SECRET_ACCESS_KEY",
              "ONEMAP_PASSWORD",
          }
          for raw in text.splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, _, val = line.partition("=")
              key = key.strip()
              val = val.strip().strip("'").strip('"')
              if secret_re.search(val) or secret_re.search(key + "=" + val):
                  print(f"::error::{origin} looks like it contains a secret ({key}).")
                  sys.exit(1)
              if key in forbidden_assign and val:
                  print(f"::error::{origin} sets {key}. That belongs on Spring REST / AWS SM, not Vite.")
                  sys.exit(1)
              if key in backend_keys and val and not val.startswith("/"):
                  print(
                      f"::error::{origin} sets {key}={val}. "
                      "Academy SPA must use same-origin /api; REST_BASE_URL comes from Terraform rest ALB via SM."
                  )
                  sys.exit(1)
              if "localhost:8080" in val or "localhost:8000" in val or "127.0.0.1:8080" in val:
                  print(f"::error::{origin} bakes a lab backend URL in {key}.")
                  sys.exit(1)
          print("Vite .env.production is safe (no estate hosts or REST secrets).")
          PY

      - name: Production build (tsc -b && vite build --mode api)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          npx tsc -b --pretty false
          # MODE=api: App.tsx / CustomerPortal use Spring login, rental-plan cart, deposit.
          # package.json "build" is vite build (MODE=production) — do not use it for GHCR.
          PK="${VITE_STRIPE_PUBLISHABLE_KEY:-}"
          if [ -z "${PK}" ]; then
            echo "::warning::Environment academy variable VITE_STRIPE_PUBLISHABLE_KEY is empty. Stripe.js will use .env.api or stay unset."
          elif printf '%s' "${PK}" | grep -Eq '^(sk_|whsec_)'; then
            echo "::error::VITE_STRIPE_PUBLISHABLE_KEY must be a publishable pk_ key, not sk_ / whsec_."
            exit 1
          else
            echo "Using academy VITE_STRIPE_PUBLISHABLE_KEY (value not printed)."
          fi
          npx vite build --mode api
        env:
          CI: true
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Same-origin /api (guest nginx → SM REST_BASE_URL). Override .env.api compose host.
          VITE_API_TARGET: ""
          VITE_API_URL: ""
          VITE_REST_URL: ""
          VITE_REST_BASE_URL: ""
          VITE_HAYSTACK_URL: ""
          VITE_HAYSTACK_BASE_URL: ""
          STRIPE_API_KEY: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SESSION_TOKEN: ""

      - name: Verify Vite build output (static SPA for web server)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          DIST="${VITE_DIST_DIR}"

          echo "==> Expect Vite static SPA under ${DIST}/"
          test -d "${DIST}"
          test -f "${DIST}/index.html"

          # Vite emits hashed JS/CSS under dist/assets/ (or flat files in dist/)
          JS_COUNT="$(find "${DIST}" -type f \( -name '*.js' -o -name '*.mjs' \) | wc -l | tr -d ' ')"
          CSS_COUNT="$(find "${DIST}" -type f -name '*.css' | wc -l | tr -d ' ')"
          if [ "${JS_COUNT}" -lt 1 ]; then
            echo "::error::No JavaScript bundles found under ${DIST}/ — Vite build looks incomplete."
            find "${DIST}" -type f | sort | head -n 100 || true
            exit 1
          fi

          # Reject packaging wrong artifact types (source tarballs, Node server bundles, etc.)
          if [ -f "${DIST}/package.json" ] || [ -d "${DIST}/node_modules" ]; then
            echo "::error::${DIST}/ looks like source/runtime, not a Vite static build."
            exit 1
          fi

          echo "==> ${DIST} layout (sample)"
          find "${DIST}" -maxdepth 3 -type f | sort | head -n 80
          echo "==> counts: js/mjs=${JS_COUNT} css=${CSS_COUNT}"
          du -sh "${DIST}"
          echo "Vite static build verified (index.html + JS present)."

          echo "==> Scan dist/ for secrets and baked lab backends"
          HITS="$(
            grep -RInE --binary-files=without-match \
              'sk_live_|sk_test_|AWS_SECRET_ACCESS_KEY|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE|jdbc:postgresql://|localhost:8080|localhost:8000|127\.0\.0\.1:8080|127\.0\.0\.1:8000|127\.0\.0\.1:4010|heavy-rental-rest-api' \
              "${DIST}" || true
          )"
          if [ -n "${HITS}" ]; then
            echo "::error::dist/ contains secrets or lab backend URLs. Academy SPA must use same-origin /api; do not bake VITE_API_TARGET / VITE_* hosts or sk_."
            echo "${HITS}" | head -n 80
            exit 1
          fi
          echo "dist/ has no sk_/AWS/JDBC/localhost:8080|8000|4010/heavy-rental-rest-api bake-in."

      - name: Resolve next heavy_rental_web_portal version
        id: image-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi

          PREV="$(printf '%s\n' "${TAGS}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "${PREV}" ]; then
            NEXT="1.0.0"
            PREV_DISPLAY="none"
          else
            IFS=. read -r MAJ MIN PAT <<< "${PREV}"
            NEXT="${MAJ}.${MIN}.$((PAT + 1))"
            PREV_DISPLAY="${PREV}"
          fi

          echo "previous_version=${PREV_DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "image_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Resolved GHCR image version: previous=${PREV_DISPLAY} next=${NEXT}"
          {
            echo "### GHCR image version"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${PKG}\` |"
            echo "| Previous semver | \`${PREV_DISPLAY}\` |"
            echo "| Next semver | \`${NEXT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release package (.zip for Vite static web deploy)
        id: package
        working-directory: ${{ env.APP_PATH }}
        env:
          # Bind github context for use in shell (Semgrep: no github context in run: scripts)
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}
          PREVIOUS_IMAGE_VERSION: ${{ steps.image-version.outputs.previous_version }}
        run: |
          set -euo pipefail
          DIST="${VITE_DIST_DIR}"
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          RUN_ID="${GH_RUN_NUMBER}"

          # Versioned + stable names; both are .zip of dist/ contents (document root).
          ARCHIVE_NAME="heavy-rental-web-portal-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.${PACKAGE_EXT}"
          STABLE_NAME="heavy-rental-web-portal-dist.${PACKAGE_EXT}"
          ARCHIVE_PATH="${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"
          STABLE_PATH="${GITHUB_WORKSPACE}/${STABLE_NAME}"

          # zip from inside dist so extract lands index.html at archive root (web server root).
          # Requires zip(1) on ubuntu-latest runners.
          (
            cd "${DIST}"
            zip -r "${ARCHIVE_PATH}" .
          )

          # Validate archive extension and that index.html is at zip root
          case "${ARCHIVE_NAME}" in
            *.zip) ;;
            *)
              echo "::error::Expected .${PACKAGE_EXT} package for Vite static deploy, got: ${ARCHIVE_NAME}"
              exit 1
              ;;
          esac
          if ! unzip -l "${ARCHIVE_PATH}" | awk '{print $NF}' | grep -qx 'index.html'; then
            echo "::error::Package must contain index.html at archive root for static web-server deploy."
            unzip -l "${ARCHIVE_PATH}" | head -n 40 || true
            exit 1
          fi

          cp "${ARCHIVE_PATH}" "${STABLE_PATH}"

          # Record magic / type for deploy consumers
          file "${ARCHIVE_PATH}" || true
          ls -lh "${ARCHIVE_PATH}" "${STABLE_PATH}"

          IMAGE_TAG="${IMAGE_VERSION}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "::error::Resolved image version is empty"
            exit 1
          fi
          # GHCR requires lowercase image repository path segments
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_LOCAL_LATEST="${IMAGE_NAME_LC}:latest"
          IMAGE_REMOTE="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_REMOTE_LATEST="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:latest"
          IMAGE_TAR="heavy_rental_web_portal-${IMAGE_TAG}.tar.gz"

          {
            echo "archive_name=${ARCHIVE_NAME}"
            echo "stable_name=${STABLE_NAME}"
            echo "package_ext=${PACKAGE_EXT}"
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "previous_image_version=${PREVIOUS_IMAGE_VERSION}"
            echo "image_local=${IMAGE_LOCAL}"
            echo "image_local_latest=${IMAGE_LOCAL_LATEST}"
            echo "image_remote=${IMAGE_REMOTE}"
            echo "image_remote_latest=${IMAGE_REMOTE_LATEST}"
            echo "image_tar=${IMAGE_TAR}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload dist directory
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-dist
          path: ${{ env.APP_PATH }}/${{ env.VITE_DIST_DIR }}/
          retention-days: 14

      - name: Upload packaged archive (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-package
          path: |
            ${{ github.workspace }}/${{ steps.package.outputs.archive_name }}
            ${{ github.workspace }}/${{ steps.package.outputs.stable_name }}
          retention-days: 14

      # -------------------------------------------------------------------
      # Docker image: always nginx + Vite dist/ so Academy CD can deploy.
      # An app Dockerfile (Node/Vite preview, etc.) is not the deploy image.
      # CD later mounts default.conf with /api → REST_BASE_URL.
      # -------------------------------------------------------------------
      - name: Prepare Dockerfile for static SPA image
        working-directory: ${{ env.APP_PATH }}
        env:
          DIST_DIR: ${{ env.VITE_DIST_DIR }}
          NGINX_BASE_IMAGE: ${{ env.NGINX_BASE_IMAGE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          DIST="${DIST_DIR}"
          if [ ! -d "${DIST}" ] || [ ! -f "${DIST}/index.html" ]; then
            echo "::error::Vite dist for Docker build not found under ${DIST}/"
            exit 1
          fi

          if [ -f .dockerignore ] && grep -Eiq '^[[:space:]]*(\./)?dist(/|\*|/\*)?[[:space:]]*$' .dockerignore; then
            echo "::error::.dockerignore excludes dist/; Release cannot COPY the Vite SPA into nginx."
            cat .dockerignore
            exit 1
          fi

          if [ -f Dockerfile ]; then
            echo "Application Dockerfile present — moving aside. Release always builds nginx + Vite dist/ for GHCR/CD."
            mv Dockerfile Dockerfile.app-repo
          fi

          echo "Generating nginx SPA Dockerfile (React/Vite dist → ${NGINX_BASE_IMAGE})"
          {
            echo "# Generated by web-portal release packaging (Vite dist → nginx)"
            echo "# Academy CD mounts a new default.conf with location /api/ → REST_BASE_URL."
            echo "# This file must stay try_files-only (no proxy_pass hostname)."
            echo "server {"
            echo "  listen 80;"
            echo "  server_name _;"
            echo "  root /usr/share/nginx/html;"
            echo "  index index.html;"
            echo "  # SPA client-side routing"
            echo "  location / {"
            echo "    try_files \$uri \$uri/ /index.html;"
            echo "  }"
            echo "  # Cache hashed Vite assets aggressively"
            echo "  location /assets/ {"
            echo "    try_files \$uri =404;"
            echo "    add_header Cache-Control \"public, max-age=31536000, immutable\";"
            echo "  }"
            echo "}"
          } > nginx-spa.conf

          {
            echo "# Generated by web-portal release packaging (Vite dist → nginx)"
            echo "# Runtime: static files only. Do not ENV REST_BASE_URL / VITE_* / STRIPE_ / AWS_."
            echo "# Guest nginx /api proxy is mounted by Academy CD, not baked here."
            echo "FROM ${NGINX_BASE_IMAGE}"
            echo "LABEL org.opencontainers.image.title=\"${IMAGE_NAME}\""
            echo "LABEL org.opencontainers.image.description=\"Heavy Rental React Web Portal (Vite SPA on nginx)\""
            echo "LABEL org.opencontainers.image.source=\"https://github.com/${APP_REPOSITORY}\""
            echo "LABEL org.opencontainers.image.revision=\"${SHORT_SHA}\""
            echo "LABEL org.opencontainers.image.version=\"${VERSION}\""
            echo ""
            echo "COPY nginx-spa.conf /etc/nginx/conf.d/default.conf"
            echo "COPY ${DIST}/ /usr/share/nginx/html/"
            echo ""
            echo "EXPOSE 80"
            echo "HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\"
            echo "  CMD wget -qO- http://127.0.0.1/ >/dev/null || exit 1"
            echo 'CMD ["nginx", "-g", "daemon off;"]'
          } > Dockerfile

          echo "==> Dockerfile"
          cat Dockerfile
          echo "==> dist for image: ${DIST}/ ($(du -sh "${DIST}" | awk '{print $1}'))"

          if grep -Eiq 'proxy_pass[[:space:]]+https?://' nginx-spa.conf; then
            echo "::error::Generated nginx-spa.conf must not proxy_pass to a hostname. CD mounts /api."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*(ENV|ARG)[[:space:]]+(REST_BASE_URL|VITE_|STRIPE_|AWS_|PORTAL_IMAGE)' Dockerfile; then
            echo "::error::Dockerfile bakes REST/Vite/Stripe/AWS config (ENV/ARG). Guest nginx + SM own /api."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*COPY[[:space:]]+[^[:space:]]*\.env' Dockerfile; then
            echo "::error::Dockerfile copies a .env file. Do not bake portal secrets into the SPA image."
            exit 1
          fi

      - name: Build Docker image
        id: docker
        working-directory: ${{ env.APP_PATH }}
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_LOCAL_LATEST: ${{ steps.package.outputs.image_local_latest }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
        run: |
          set -euo pipefail
          # Enforce lowercase repository path (GHCR rejects mixed-case names)
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          IMAGE_LOCAL_LATEST="${IMAGE_LOCAL_LATEST,,}"
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"

          # No --build-arg for REST_BASE_URL / VITE_ / STRIPE_ / AWS_ / PORTAL_IMAGE
          docker build \
            --pull \
            -t "${IMAGE_LOCAL}" \
            -t "${IMAGE_LOCAL_LATEST}" \
            -t "${IMAGE_REMOTE}" \
            -t "${IMAGE_REMOTE_LATEST}" \
            .

          echo "==> Images built"
          echo "Local:  ${IMAGE_LOCAL}"
          echo "GHCR:   ${IMAGE_REMOTE}"
          docker images "${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          docker images "ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true

          # Export every tag so docker load matches compose (local + GHCR + :latest).
          # Use the stable IMAGE_ARCHIVE name so DAST/Publish can find it without job outputs.
          TAR_PATH="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          docker save \
            "${IMAGE_LOCAL}" \
            "${IMAGE_LOCAL_LATEST}" \
            "${IMAGE_REMOTE}" \
            "${IMAGE_REMOTE_LATEST}" \
            | gzip -c > "${TAR_PATH}"
          ls -lh "${TAR_PATH}"
          if [ ! -s "${TAR_PATH}" ]; then
            echo "::error::Docker image tar is missing or empty: ${TAR_PATH}"
            exit 1
          fi

          {
            echo "IMAGE_LOCAL=${IMAGE_LOCAL}"
            echo "IMAGE_LOCAL_LATEST=${IMAGE_LOCAL_LATEST}"
            echo "IMAGE_REMOTE=${IMAGE_REMOTE}"
            echo "IMAGE_REMOTE_LATEST=${IMAGE_REMOTE_LATEST}"
            echo "IMAGE_TAG=${IMAGE_LOCAL##*:}"
          } > "${GITHUB_WORKSPACE}/${IMAGE_META}"
          echo "==> ${IMAGE_META}"
          cat "${GITHUB_WORKSPACE}/${IMAGE_META}"

          {
            echo "image_id=$(docker image inspect -f '{{.Id}}' "${IMAGE_LOCAL}")"
            echo "tar_path=${TAR_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Prove image is deployable
        env:
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          NAME="portal-smoke-${GITHUB_RUN_ID:-$$}"

          ENV_JSON="$(docker image inspect -f '{{json .Config.Env}}' "${IMAGE_LOCAL}")"
          echo "Image Config.Env: ${ENV_JSON}"
          if printf '%s' "${ENV_JSON}" | grep -Eq '"REST_BASE_URL=|"VITE_|"STRIPE_|"AWS_|"PORTAL_IMAGE='; then
            echo "::error::Image bakes REST/Vite/Stripe/AWS env. Guest nginx + heavy-rental/portal own /api."
            exit 1
          fi

          EXPOSED="$(docker image inspect -f '{{json .Config.ExposedPorts}}' "${IMAGE_LOCAL}")"
          echo "Image ExposedPorts: ${EXPOSED}"
          if ! printf '%s' "${EXPOSED}" | grep -q '80/tcp'; then
            echo "::error::Image does not EXPOSE 80/tcp. Academy compose maps 80:80."
            exit 1
          fi

          docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c \
            'test -f /usr/share/nginx/html/index.html && test "$(find /usr/share/nginx/html -type f \( -name "*.js" -o -name "*.mjs" \) | wc -l)" -ge 1'
          echo "Image contains /usr/share/nginx/html/index.html and at least one JS bundle"

          HITS="$(
            docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c \
              'grep -RInE "sk_live_|sk_test_|AWS_SECRET_ACCESS_KEY|jdbc:postgresql://|localhost:8080|localhost:8000|127.0.0.1:8080|127.0.0.1:8000|127.0.0.1:4010|heavy-rental-rest-api" /usr/share/nginx/html || true'
          )"
          if [ -n "${HITS}" ]; then
            echo "::error::Image html tree contains secrets or lab backend URLs."
            echo "${HITS}" | head -n 80
            exit 1
          fi

          cleanup() { docker rm -f "${NAME}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "${NAME}" "${IMAGE_LOCAL}"
          ok=0
          for _ in $(seq 1 15); do
            if docker exec "${NAME}" wget -qO- http://127.0.0.1/ >/tmp/portal-index.html 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::Portal image did not serve GET / on port 80 (not deployable)."
            docker logs "${NAME}" || true
            exit 1
          fi
          if ! grep -Eiq '<html|<!doctype' /tmp/portal-index.html; then
            echo "::error::GET / did not return HTML."
            head -n 20 /tmp/portal-index.html || true
            exit 1
          fi
          if ! docker exec "${NAME}" wget -qO- http://127.0.0.1/spa-fallback-check >/tmp/portal-spa.html 2>/dev/null; then
            echo "::error::GET /spa-fallback-check failed — SPA try_files is required for React routes."
            docker logs "${NAME}" || true
            exit 1
          fi
          if ! grep -Eiq '<html|<!doctype' /tmp/portal-spa.html; then
            echo "::error::GET /spa-fallback-check did not return HTML (React client routes would 404)."
            head -n 20 /tmp/portal-spa.html || true
            exit 1
          fi
          echo "GET / and GET /spa-fallback-check returned HTML; image is deployable (nginx SPA on :80)."

          {
            echo "### Deployable image"
            echo ""
            echo "Generated \`nginx:1.27-alpine\` image with Vite \`dist/\` at \`/usr/share/nginx/html\`."
            echo "No baked REST_BASE_URL / VITE_ / STRIPE_ / AWS_ in Config.Env."
            echo "Static \`index.html\` + JS bundle present. Bundle has no sk_/JDBC/localhost:8080|8000."
            echo "Container served \`GET /\` and SPA fallback \`GET /spa-fallback-check\` (HTML) on port 80, then was removed."
            echo "Academy CD mounts nginx \`/api\` → \`REST_BASE_URL\` from \`heavy-rental/portal\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-release-docker-image
          path: |
            ${{ github.workspace }}/${{ env.IMAGE_ARCHIVE }}
            ${{ github.workspace }}/${{ env.IMAGE_META }}
          retention-days: 14
          if-no-files-found: error

      - name: Packaging summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          APP_REF: ${{ needs.integration.outputs.app_ref }}
          VERSION: ${{ steps.package.outputs.version }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          PACKAGE_EXT: ${{ steps.package.outputs.package_ext }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          STABLE_NAME: ${{ steps.package.outputs.stable_name }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
          IMAGE_ID: ${{ steps.docker.outputs.image_id }}
        run: |
          {
            echo "### Packaging complete (Vite static SPA)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Application | \`${APP_REPOSITORY}\` |"
            echo "| Ref | \`${APP_REF}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Package format | \`.${PACKAGE_EXT}\` (static web-server deploy) |"
            echo "| Versioned archive | \`${ARCHIVE_NAME}\` |"
            echo "| Stable archive | \`${STABLE_NAME}\` |"
            echo "| Docker image (local) | \`${IMAGE_LOCAL}\` |"
            echo "| Docker image (GHCR) | \`${IMAGE_REMOTE}\` |"
            echo "| Docker image (GHCR latest) | \`${IMAGE_REMOTE_LATEST}\` |"
            echo "| Image archive | \`${IMAGE_ARCHIVE}\` |"
            echo "| Image ID | \`${IMAGE_ID}\` |"
            echo "| Artifacts | \`web-portal-dist\`, \`web-portal-package\`, \`web-portal-release-docker-image\` |"
            echo ""
            echo "### Deploy options"
            echo ""
            echo "1. **Zip** — download \`web-portal-package\` and unzip so \`index.html\` is the web root (nginx/IIS/S3/Azure static)."
            echo "2. **Image archive** — \`gzip -dc ${IMAGE_ARCHIVE} | docker load\` then run \`${IMAGE_LOCAL}\` (maps port 80)."
            if [ "${EVENT_NAME}" != "pull_request" ]; then
              echo "3. **GHCR** — \`docker pull ${IMAGE_REMOTE}\` or \`docker pull ${IMAGE_REMOTE_LATEST}\`."
            else
              echo "3. **GHCR** — push skipped on pull_request; image is available as the tar artifact only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: [packaging]
    timeout-minutes: 40
    steps:
      - name: Download Docker image archive
        uses: actions/download-artifact@v4
        with:
          name: web-portal-release-docker-image
          path: ${{ github.workspace }}

      - name: Load image and start target
        id: start-dast
        run: |
          set -euo pipefail
          # Do not use needs.packaging.outputs here: packaging sets environment:
          # academy, and those job outputs are empty in this reusable workflow.
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          ARCHIVE="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            ARCHIVE="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -name '*.tar.gz' | head -n 1 || true)"
          fi
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Docker image archive not found after downloading web-portal-release-docker-image."
            echo "Expected ${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE} (and ${IMAGE_META})."
            ls -la "${GITHUB_WORKSPACE}" || true
            find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f | head -n 50 || true
            exit 1
          fi
          echo "Loading ${ARCHIVE} ($(wc -c < "${ARCHIVE}") bytes)"
          gzip -dc "${ARCHIVE}" | docker load
          docker images
          if [ -z "${IMAGE_LOCAL:-}" ]; then
            IMAGE_LOCAL="$(docker images --format '{{.Repository}}:{{.Tag}}' "${IMAGE_NAME}" \
              | grep -vE ':(latest|<none>)$' | head -n 1 || true)"
          fi
          if [ -z "${IMAGE_LOCAL:-}" ]; then
            echo "::error::Could not determine IMAGE_LOCAL after docker load. ${IMAGE_META} missing?"
            exit 1
          fi
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          echo "Using IMAGE_LOCAL=${IMAGE_LOCAL}"

          docker network inspect dastnet >/dev/null 2>&1 || docker network create dastnet
          docker rm -f dast-app >/dev/null 2>&1 || true
          docker run -d --name dast-app --network dastnet --network-alias dast-app \
            -p 80:80 \
            "${IMAGE_LOCAL}"
          ok=0
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null --max-time 3 "http://127.0.0.1:80/" \
              || curl -sS -o /dev/null --max-time 3 "http://127.0.0.1:80/docs" \
              || curl -sS -o /dev/null --max-time 3 "http://127.0.0.1:80/health"; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::DAST target did not become ready on :80."
            docker logs dast-app || true
            exit 1
          fi
          echo "DAST target is up at http://dast-app:80 (also http://127.0.0.1:80)"

      - name: Prepare DAST reports directory
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dast-reports"
          chmod 777 "${GITHUB_WORKSPACE}/dast-reports"

      - name: OWASP ZAP baseline
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          set +e
          docker run --rm --network dastnet \
            -v "${REPORTS}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://dast-app:80" -J zap.json -r zap.html -w zap.md -I
          ZAP_RC=$?
          set -e
          echo "ZAP exit=${ZAP_RC} (0=pass, 1=warn, 2=fail)"
          ls -la "${REPORTS}" || true
          for f in zap.json zap.html zap.md; do
            if [ ! -s "${REPORTS}/${f}" ]; then
              echo "ZAP did not write ${f} (exit=${ZAP_RC})" > "${REPORTS}/${f}"
            fi
          done
          if [ "${ZAP_RC}" -ge 2 ]; then
            echo "::error::OWASP ZAP baseline failed (high-severity findings or scan error)."
            exit "${ZAP_RC}"
          fi

      - name: Dastardly
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          set +e
          docker run --rm --network dastnet \
            -v "${REPORTS}:/dastardly" \
            -e DASTARDLY_TARGET_URL="http://dast-app:80" \
            -e DASTARDLY_OUTPUT_FILE=/dastardly/dastardly-report.xml \
            public.ecr.aws/portswigger/dastardly:latest
          DAST_RC=$?
          set -e
          echo "Dastardly exit=${DAST_RC}"
          ls -la "${REPORTS}" || true
          if [ ! -s "${REPORTS}/dastardly-report.xml" ]; then
            printf '%s\n' '<testsuites name="dastardly"/>' > "${REPORTS}/dastardly-report.xml"
          fi
          if [ "${DAST_RC}" -ne 0 ]; then
            echo "::error::Dastardly reported high-severity findings (or the scan failed)."
            exit "${DAST_RC}"
          fi

      - name: Nuclei (report-only)
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          docker run --rm --network dastnet \
            -v "${REPORTS}:/out" \
            projectdiscovery/nuclei:latest \
            -u "http://dast-app:80" -silent -jsonl -o /out/nuclei.jsonl || true
          if [ ! -f "${REPORTS}/nuclei.jsonl" ]; then
            touch "${REPORTS}/nuclei.jsonl"
          fi

      # Combined human-readable DAST PDF. Keep in sync with
      # heavy-rental-project-pipeline-development/scripts/combine-dast-report.py
      # Download: Summary → Artifacts (`dast-combined-report-pdf`), job summary link,
      # or the GitHub Release asset.
      - name: Install reportlab (combined DAST PDF)
        if: always()
        run: pip install --quiet reportlab

      - name: Combine DAST reports into PDF
        if: always()
        env:
          COMBINED_PDF_TITLE: Heavy Rental Web Portal — Combined DAST report
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORT_DIR}"
          cat > "${REPORT_DIR}/combine-dast-report.py" << 'COMBINE_DAST_REPORT_PY'
          #!/usr/bin/env python3
          """Combine Release DAST tool outputs into one PDF.
          
          Keep this file in sync with the heredoc in each Release CI
          ``release-pipeline.yml`` DAST job.
          
          Supported inputs (all optional):
            - zap.json (OWASP ZAP baseline)
            - dastardly-report.xml (Dastardly JUnit XML)
            - nuclei.jsonl (Nuclei)
            - mobsf-report.json (MobSF)
          
          Request bodies, ZAP evidence, and SARIF-style snippets are never copied
          into the PDF (scanner hits can echo credentials).
          """
          
          from __future__ import annotations
          
          import argparse
          import json
          import re
          import sys
          from collections import Counter
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.etree import ElementTree
          from xml.sax.saxutils import escape as xml_escape
          
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import inch
          from reportlab.platypus import (
              PageBreak,
              Paragraph,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )
          
          MAX_MESSAGE = 400
          MAX_FINDINGS_PER_TOOL = 200
          SKIP_NAMES = {
              "combined-dast-report.pdf",
              "combine-dast-report.py",
              "INDEX.md",
              "zap.html",
              "zap.md",
              "mobsf-upload.json",
              "mobsf-scan.json",
              "mobsf-report.pdf",
          }
          HTML_TAG_RE = re.compile(r"<[^>]+>")
          ZAP_RISK = {"0": "info", "1": "low", "2": "medium", "3": "high", "4": "critical"}
          
          
          @dataclass
          class Finding:
              rule_id: str
              level: str
              location: str
              message: str
          
          
          @dataclass
          class ToolReport:
              name: str
              source_file: str
              present: bool
              findings: list[Finding] = field(default_factory=list)
              note: str = ""
          
          
          def pdf_safe(text: str) -> str:
              raw = "" if text is None else str(text)
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              raw = raw.encode("latin-1", "replace").decode("latin-1")
              return xml_escape(raw)
          
          
          def truncate(text: str, limit: int = MAX_MESSAGE) -> str:
              text = " ".join((text or "").split())
              if len(text) <= limit:
                  return text
              return text[: limit - 1] + "…"
          
          
          def strip_html(text: str) -> str:
              return HTML_TAG_RE.sub(" ", text or "")
          
          
          def _unreadable(path: Path, name: str, exc: Exception) -> ToolReport:
              return ToolReport(
                  name=name,
                  source_file=path.name,
                  present=True,
                  note=f"Could not parse {path.name}: {exc}",
              )
          
          
          def _placeholder_note(path: Path, prefix: str) -> str | None:
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return None
              stripped = text.strip()
              if stripped.startswith(prefix) or stripped.startswith("ZAP did not write"):
                  return truncate(stripped, 200)
              return None
          
          
          def parse_zap(path: Path) -> ToolReport:
              note = _placeholder_note(path, "ZAP did not write")
              if note:
                  return ToolReport(name="OWASP ZAP", source_file=path.name, present=True, note=note)
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return _unreadable(path, "OWASP ZAP", exc)
              if not isinstance(data, dict):
                  return ToolReport(
                      name="OWASP ZAP",
                      source_file=path.name,
                      present=True,
                      note="ZAP JSON was not an object.",
                  )
              findings: list[Finding] = []
              for site in data.get("site") or []:
                  if not isinstance(site, dict):
                      continue
                  site_name = site.get("@name") or site.get("name") or ""
                  for alert in site.get("alerts") or []:
                      if not isinstance(alert, dict):
                          continue
                      riskcode = str(alert.get("riskcode") or "")
                      level = (alert.get("riskdesc") or ZAP_RISK.get(riskcode) or "warning").split()[0].lower()
                      name = alert.get("alert") or alert.get("name") or "alert"
                      instances = alert.get("instances") or []
                      uri = site_name or "—"
                      if instances and isinstance(instances[0], dict):
                          uri = instances[0].get("uri") or uri
                      desc = truncate(strip_html(str(alert.get("desc") or "")))
                      findings.append(
                          Finding(
                              rule_id=str(alert.get("pluginid") or alert.get("alertRef") or name),
                              level=level or "warning",
                              location=str(uri),
                              message=desc or truncate(str(name)),
                          )
                      )
              return ToolReport(name="OWASP ZAP", source_file=path.name, present=True, findings=findings)
          
          
          def parse_dastardly(path: Path) -> ToolReport:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  return _unreadable(path, "Dastardly", exc)
              stripped = text.strip()
              if stripped in {"<testsuites name=\"dastardly\"/>", "<testsuites name='dastardly'/>"}:
                  return ToolReport(
                      name="Dastardly",
                      source_file=path.name,
                      present=True,
                      note="Placeholder empty Dastardly report (scanner did not write XML).",
                  )
              try:
                  root = ElementTree.fromstring(text)
              except ElementTree.ParseError as exc:
                  return _unreadable(path, "Dastardly", exc)
              findings: list[Finding] = []
              for case in root.iter("testcase"):
                  name = case.get("name") or case.get("classname") or "testcase"
                  location = case.get("classname") or "—"
                  for child in list(case):
                      tag = child.tag.split("}", 1)[-1]
                      if tag not in {"failure", "error"}:
                          continue
                      msg = child.get("message") or ""
                      findings.append(
                          Finding(
                              rule_id=str(name),
                              level="high" if tag == "failure" else "error",
                              location=str(location),
                              message=truncate(msg or (child.text or tag)),
                          )
                      )
              return ToolReport(name="Dastardly", source_file=path.name, present=True, findings=findings)
          
          
          def parse_nuclei(path: Path) -> ToolReport:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  return _unreadable(path, "Nuclei", exc)
              findings: list[Finding] = []
              notes: list[str] = []
              for line_no, raw in enumerate(text.splitlines(), start=1):
                  line = raw.strip()
                  if not line:
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError as exc:
                      notes.append(f"line {line_no}: {exc}")
                      continue
                  if not isinstance(row, dict):
                      continue
                  info = row.get("info") if isinstance(row.get("info"), dict) else {}
                  name = info.get("name") or row.get("template-id") or row.get("template_id") or "nuclei"
                  level = str(info.get("severity") or "info").lower()
                  location = str(row.get("matched-at") or row.get("matched_at") or row.get("host") or "—")
                  desc = info.get("description") or name
                  findings.append(
                      Finding(
                          rule_id=str(row.get("template-id") or row.get("template_id") or name),
                          level=level,
                          location=location,
                          message=truncate(str(desc)),
                      )
                  )
              note = ""
              if notes:
                  note = truncate("; ".join(notes[:5]))
              return ToolReport(
                  name="Nuclei",
                  source_file=path.name,
                  present=True,
                  findings=findings,
                  note=note,
              )
          
          
          def _mobsf_finding(rule_id: str, level: str, location: str, message: str) -> Finding:
              return Finding(
                  rule_id=truncate(str(rule_id), 80),
                  level=(level or "warning").lower(),
                  location=truncate(str(location or "—"), 120),
                  message=truncate(str(message)),
              )
          
          
          def _walk_mobsf_list(items: object, default_level: str, location: str) -> list[Finding]:
              findings: list[Finding] = []
              if not isinstance(items, list):
                  return findings
              for item in items:
                  if isinstance(item, str):
                      findings.append(_mobsf_finding(item, default_level, location, item))
                  elif isinstance(item, (list, tuple)) and item:
                      level = default_level
                      msg = item[-1] if len(item) > 1 else item[0]
                      if len(item) >= 2 and isinstance(item[0], str):
                          level = str(item[0])
                      rule = item[1] if len(item) > 1 else item[0]
                      findings.append(_mobsf_finding(str(rule), level, location, str(msg)))
                  elif isinstance(item, dict):
                      level = str(
                          item.get("severity")
                          or item.get("level")
                          or item.get("stat")
                          or default_level
                      )
                      title = item.get("title") or item.get("rule") or item.get("name") or "finding"
                      desc = item.get("description") or item.get("desc") or title
                      loc = item.get("file") or item.get("path") or location
                      findings.append(_mobsf_finding(str(title), level, str(loc), str(desc)))
              return findings
          
          
          def parse_mobsf(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return _unreadable(path, "MobSF", exc)
              if not isinstance(data, dict):
                  return ToolReport(
                      name="MobSF",
                      source_file=path.name,
                      present=True,
                      note="MobSF JSON was not an object.",
                  )
              if data.get("error") and len(data) <= 2:
                  return ToolReport(
                      name="MobSF",
                      source_file=path.name,
                      present=True,
                      note=truncate(str(data.get("error"))),
                  )
              findings: list[Finding] = []
              for key, level in (("high", "high"), ("warning", "warning"), ("info", "info")):
                  findings.extend(_walk_mobsf_list(data.get(key), level, key))
              cert = data.get("certificate_analysis")
              if isinstance(cert, dict):
                  findings.extend(
                      _walk_mobsf_list(cert.get("certificate_findings"), "warning", "certificate")
                  )
              manifest = data.get("manifest_analysis")
              if isinstance(manifest, dict):
                  findings.extend(
                      _walk_mobsf_list(manifest.get("manifest_findings"), "warning", "manifest")
                  )
              network = data.get("network_security")
              if isinstance(network, dict):
                  findings.extend(
                      _walk_mobsf_list(network.get("network_findings"), "warning", "network")
                  )
              code = data.get("code_analysis")
              if isinstance(code, dict):
                  code_findings = code.get("findings")
                  if isinstance(code_findings, dict):
                      for rule_id, body in code_findings.items():
                          if not isinstance(body, dict):
                              continue
                          meta = body.get("metadata") if isinstance(body.get("metadata"), dict) else {}
                          level = str(meta.get("severity") or "info")
                          desc = meta.get("description") or rule_id
                          files = body.get("files")
                          loc = "code"
                          if isinstance(files, dict) and files:
                              loc = next(iter(files))
                          findings.append(_mobsf_finding(str(rule_id), level, str(loc), str(desc)))
              return ToolReport(name="MobSF", source_file=path.name, present=True, findings=findings)
          
          
          PARSERS = {
              "zap.json": parse_zap,
              "dastardly-report.xml": parse_dastardly,
              "nuclei.jsonl": parse_nuclei,
              "mobsf-report.json": parse_mobsf,
          }
          
          
          def collect_reports(input_dir: Path) -> list[ToolReport]:
              reports: list[ToolReport] = []
              if not input_dir.is_dir():
                  return reports
              for filename, parser in PARSERS.items():
                  path = input_dir / filename
                  if path.is_file():
                      reports.append(parser(path))
              return reports
          
          
          def level_counts(findings: list[Finding]) -> str:
              counts = Counter(f.level for f in findings)
              if not findings:
                  return "0"
              order = ["critical", "high", "medium", "low", "error", "warning", "info", "note", "none"]
              parts = [f"{lvl}={counts[lvl]}" for lvl in order if counts.get(lvl)]
              extra = sorted(k for k in counts if k not in order)
              parts.extend(f"{lvl}={counts[lvl]}" for lvl in extra)
              return f"{len(findings)} ({', '.join(parts)})"
          
          
          def _styles() -> dict:
              styles = getSampleStyleSheet()
              styles.add(
                  ParagraphStyle(
                      name="Meta",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=9,
                      leading=12,
                      textColor=colors.HexColor("#333333"),
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="Cell",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=8,
                      leading=10,
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="CellHead",
                      parent=styles["Normal"],
                      fontName="Helvetica-Bold",
                      fontSize=8,
                      leading=10,
                  )
              )
              return styles
          
          
          def _table(rows: list[list], col_widths: list[float]) -> Table:
              table = Table(rows, colWidths=col_widths, repeatRows=1)
              table.setStyle(
                  TableStyle(
                      [
                          ("GRID", (0, 0), (-1, -1), 0.4, colors.grey),
                          ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#e8eef4")),
                          ("VALIGN", (0, 0), (-1, -1), "TOP"),
                          ("LEFTPADDING", (0, 0), (-1, -1), 4),
                          ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                          ("TOPPADDING", (0, 0), (-1, -1), 3),
                          ("BOTTOMPADDING", (0, 0), (-1, -1), 3),
                      ]
                  )
              )
              return table
          
          
          def build_story(reports: list[ToolReport], args: argparse.Namespace) -> list:
              styles = _styles()
              cell, head = styles["Cell"], styles["CellHead"]
              story: list = [
                  Paragraph(pdf_safe(args.title), styles["Title"]),
                  Spacer(1, 8),
                  Paragraph(f"<b>Repository:</b> {pdf_safe(args.repo)}", styles["Meta"]),
                  Paragraph(f"<b>Commit:</b> {pdf_safe(args.sha)}", styles["Meta"]),
                  Paragraph(f"<b>Workflow run:</b> {pdf_safe(args.run_url)}", styles["Meta"]),
                  Paragraph(
                      f"<b>Generated (UTC):</b> {pdf_safe(datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ'))}",
                      styles["Meta"],
                  ),
                  Paragraph(
                      "Machine-readable DAST outputs remain in this artifact (ZAP JSON/HTML, "
                      "Dastardly XML, Nuclei JSONL, MobSF JSON). This PDF is a human download. "
                      "Request bodies and scanner evidence snippets are omitted.",
                      styles["Meta"],
                  ),
                  Spacer(1, 14),
                  Paragraph("Summary", styles["Heading1"]),
              ]
              usable = 7.5 * inch
              if not reports:
                  story.append(Paragraph("No DAST scanner outputs were produced in dast-reports/.", styles["Normal"]))
                  return story
          
              summary_rows = [[
                  Paragraph("Tool", head),
                  Paragraph("File", head),
                  Paragraph("Present", head),
                  Paragraph("Findings", head),
              ]]
              for report in reports:
                  summary_rows.append([
                      Paragraph(pdf_safe(report.name), cell),
                      Paragraph(pdf_safe(report.source_file), cell),
                      Paragraph("yes" if report.present else "no", cell),
                      Paragraph(pdf_safe(level_counts(report.findings)), cell),
                  ])
              story.append(_table(summary_rows, [1.6 * inch, 2.0 * inch, 0.8 * inch, usable - 4.4 * inch]))
              story.append(Spacer(1, 12))
          
              for index, report in enumerate(reports):
                  if index:
                      story.append(PageBreak())
                  story.append(Paragraph(pdf_safe(f"{report.name} ({report.source_file})"), styles["Heading1"]))
                  if report.note:
                      story.append(Paragraph(pdf_safe(report.note), styles["Normal"]))
                  if not report.findings:
                      story.append(Paragraph("No findings in this report.", styles["Normal"]))
                      continue
                  shown = report.findings[:MAX_FINDINGS_PER_TOOL]
                  omitted = len(report.findings) - len(shown)
                  rows = [[
                      Paragraph("Level", head),
                      Paragraph("Rule", head),
                      Paragraph("Location", head),
                      Paragraph("Message", head),
                  ]]
                  for finding in shown:
                      rows.append([
                          Paragraph(pdf_safe(finding.level), cell),
                          Paragraph(pdf_safe(finding.rule_id), cell),
                          Paragraph(pdf_safe(finding.location), cell),
                          Paragraph(pdf_safe(finding.message).replace("\n", "<br/>"), cell),
                      ])
                  story.append(
                      _table(rows, [0.8 * inch, 1.6 * inch, 2.0 * inch, usable - 4.4 * inch])
                  )
                  if omitted > 0:
                      story.append(Spacer(1, 6))
                      story.append(
                          Paragraph(pdf_safe(f"… and {omitted} more finding(s) not listed."), styles["Meta"])
                      )
              return story
          
          
          def add_page_number(canvas, doc) -> None:
              canvas.saveState()
              canvas.setFont("Helvetica", 8)
              canvas.setFillColor(colors.HexColor("#555555"))
              canvas.drawString(0.75 * inch, 0.45 * inch, "Combined DAST report")
              canvas.drawRightString(letter[0] - 0.75 * inch, 0.45 * inch, f"Page {doc.page}")
              canvas.restoreState()
          
          
          def write_pdf(reports: list[ToolReport], args: argparse.Namespace) -> None:
              output = Path(args.output)
              output.parent.mkdir(parents=True, exist_ok=True)
              doc = SimpleDocTemplate(
                  str(output),
                  pagesize=letter,
                  leftMargin=0.75 * inch,
                  rightMargin=0.75 * inch,
                  topMargin=0.7 * inch,
                  bottomMargin=0.7 * inch,
                  title=args.title,
                  author="Heavy Rental Release CI",
              )
              doc.build(build_story(reports, args), onFirstPage=add_page_number, onLaterPages=add_page_number)
          
          
          def parse_args(argv: list[str] | None = None) -> argparse.Namespace:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--input-dir", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--title", default="Combined DAST report")
              parser.add_argument("--repo", default="")
              parser.add_argument("--sha", default="")
              parser.add_argument("--run-url", default="")
              return parser.parse_args(argv)
          
          
          def main(argv: list[str] | None = None) -> int:
              args = parse_args(argv)
              reports = collect_reports(Path(args.input_dir))
              write_pdf(reports, args)
              output = Path(args.output)
              if not output.is_file() or output.stat().st_size == 0:
                  print(f"error: PDF was not written: {output}", file=sys.stderr)
                  return 1
              print(f"Wrote {output} ({output.stat().st_size} bytes, {len(reports)} report(s))")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          COMBINE_DAST_REPORT_PY
          python3 "${REPORT_DIR}/combine-dast-report.py" \
            --input-dir "${REPORT_DIR}" \
            --output "${REPORT_DIR}/combined-dast-report.pdf" \
            --title "${COMBINED_PDF_TITLE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -s "${REPORT_DIR}/combined-dast-report.pdf"

      - name: Upload combined DAST report (PDF)
        if: always() && hashFiles('dast-reports/combined-dast-report.pdf') != ''
        id: upload-dast-pdf
        uses: actions/upload-artifact@v4
        with:
          name: dast-combined-report-pdf
          path: dast-reports/combined-dast-report.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Publish DAST PDF download
        if: always() && steps.upload-dast-pdf.outputs.artifact-url != ''
        env:
          PDF_URL: ${{ steps.upload-dast-pdf.outputs.artifact-url }}
        run: |
          {
            echo "### Combined DAST report (PDF)"
            echo ""
            echo "Download: [combined-dast-report.pdf](${PDF_URL})"
            echo ""
            echo "Artifact: \`dast-combined-report-pdf\` (also inside the DAST reports artifact)."
            echo "On this run: Summary → Artifacts. Also attached to the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Index DAST reports
        if: always()
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          {
            echo "# DAST reports"
            echo ""
            echo "| File | Bytes |"
            echo "| --- | --- |"
            find "${REPORTS}" -maxdepth 1 -type f ! -name INDEX.md -print | sort | while read -r f; do
              echo "| \`$(basename "$f")\` | $(wc -c < "$f") |"
            done
          } | tee "${REPORTS}/INDEX.md"
          cat "${REPORTS}/INDEX.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop DAST target
        if: always()
        run: |
          docker rm -f dast-app >/dev/null 2>&1 || true
          docker network rm dastnet >/dev/null 2>&1 || true

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-release-dast
          path: ${{ github.workspace }}/dast-reports/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [integration, packaging, dast]
    timeout-minutes: 20
    steps:
      - name: Download Docker image archive
        uses: actions/download-artifact@v4
        with:
          name: web-portal-release-docker-image
          path: ${{ github.workspace }}

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: web-portal-package
          path: ${{ github.workspace }}/release-package

      - name: Download DAST reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-portal-release-dast
          path: ${{ github.workspace }}/release-dast

      - name: Load image
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          ARCHIVE="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            ARCHIVE="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -name '*.tar.gz' | head -n 1 || true)"
          fi
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Docker image archive not found after downloading web-portal-release-docker-image."
            ls -la "${GITHUB_WORKSPACE}" || true
            exit 1
          fi
          echo "Loading ${ARCHIVE} ($(wc -c < "${ARCHIVE}") bytes)"
          gzip -dc "${ARCHIVE}" | docker load
          docker images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR and set public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ -z "${IMAGE_REMOTE:-}" ] || [ -z "${IMAGE_REMOTE_LATEST:-}" ] || [ -z "${IMAGE_TAG:-}" ]; then
            echo "::error::IMAGE_REMOTE/IMAGE_TAG missing. Expected ${IMAGE_META} in web-portal-release-docker-image."
            cat "${META}" || true
            exit 1
          fi
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi
          if printf '%s\n' "${TAGS}" | grep -qx "${IMAGE_TAG}"; then
            echo "::error::GHCR tag ${IMAGE_REMOTE} already exists; will not overwrite a version tag."
            exit 1
          fi

          docker push "${IMAGE_REMOTE}"
          docker push "${IMAGE_REMOTE_LATEST}"
          echo "Pushed ${IMAGE_REMOTE} and ${IMAGE_REMOTE_LATEST}"

          # GitHub has no public REST endpoint to change package visibility
          # (POST .../visibility is not in the Packages API and returns 404).
          # Read current visibility; if it is already public, continue. Otherwise
          # warn with the UI path and do not fail — the image is already on GHCR.
          PKG_HTML="https://github.com/orgs/${OWNER}/packages/container/${PKG}/settings"
          VISIBILITY=""
          set +e
          VISIBILITY="$(gh api "/orgs/${OWNER}/packages/container/${PKG}" --jq '.visibility' 2>/dev/null)"
          if [ -z "${VISIBILITY}" ]; then
            VISIBILITY="$(gh api "/users/${OWNER}/packages/container/${PKG}" --jq '.visibility' 2>/dev/null)"
            PKG_HTML="https://github.com/users/${OWNER}/packages/container/${PKG}/settings"
          fi
          set -e
          if [ "${VISIBILITY}" = "public" ]; then
            echo "GHCR package ${PKG} is already public."
          else
            echo "::warning::GHCR package '${PKG}' visibility is '${VISIBILITY:-unknown}'. GITHUB_TOKEN cannot change it (no Packages visibility API). Image tags were still pushed."
            echo "Make it public once (org owners): ${PKG_HTML} → Danger Zone → Change visibility → Public."
            echo "Also enable org Package Creation → Public: https://github.com/organizations/${OWNER}/settings/packages"
            {
              echo "### GHCR visibility"
              echo ""
              echo "Pushed \`${IMAGE_REMOTE}\` and \`${IMAGE_REMOTE_LATEST}\`."
              echo "Package visibility is **${VISIBILITY:-unknown}** (not flipped by this job)."
              echo "One-time UI: [package settings](${PKG_HTML}) → Danger Zone → Public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.integration.outputs.app_repository }}
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ -z "${IMAGE_TAG:-}" ] || [ -z "${IMAGE_REMOTE:-}" ]; then
            echo "::error::IMAGE_TAG/IMAGE_REMOTE missing. Expected ${IMAGE_META} in web-portal-release-docker-image."
            cat "${META}" || true
            exit 1
          fi
          TAG="v${IMAGE_TAG}"
          NOTES="$(
            printf '%s\n' \
              "Release **${TAG}** from \`master\`." \
              "" \
              "GHCR (public):" \
              "- \`docker pull ${IMAGE_REMOTE}\`" \
              "- \`docker pull ${IMAGE_REMOTE_LATEST}\`" \
              "" \
              "DAST: OWASP ZAP baseline + Dastardly (gate) and Nuclei (report-only)." \
              "Combined DAST PDF: \`combined-dast-report.pdf\` (artifact \`dast-combined-report-pdf\`)."
          )"
          mapfile -t ATTACH < <(find "${GITHUB_WORKSPACE}/release-package" "${GITHUB_WORKSPACE}/release-dast" -type f 2>/dev/null | sort)
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --target master \
            --title "${TAG}" \
            --notes "${NOTES}" \
            "${ATTACH[@]}"
          echo "Created GitHub Release ${TAG} on ${GH_REPO} (target master)."
