# =============================================================================
# Heavy Rental Web Portal — Release CI Pipeline (reusable)
# =============================================================================
# Stages:
#   1. Integration       — checkout, Node 22, npm ci, install health
#   2. Quality Control   — ESLint + TypeScript (needs Integration)
#   3. Security Testing  — Semgrep + npm audit + Trivy (needs Integration)
#   4. CodeQL Analysis   — GitHub CodeQL for JavaScript/TypeScript (needs Integration)
#   5. Packaging         — Vite dist zip + Docker image (needs Integration + QC + Security + CodeQL)
#   Security report format (standard): SARIF 2.1.0
#     - Semgrep → semgrep.sarif
#     - npm audit → npm-audit.sarif (converted from audit JSON)
#     - Trivy FS → trivy-fs.sarif
#     - CodeQL → GitHub Code Scanning (native SARIF via analyze)
#
# Same gates as integration-pipeline.yml, plus production build + versioned
# archive artifacts for deploy pipelines to consume.
#
# Packaging output (Vite SPA static deploy):
#   npm run build → dist/ (index.html + assets/*.js|*.css|…)
#   Deploy archive: .zip of dist/ contents (web-server static root)
#   Docker image:   always-generated nginx serving dist/ (SPA try_files);
#                   app Dockerfile is not the deploy image. GHCR
#                   heavy_rental_web_portal:<semver> + :latest (not on PR)
#                   <semver> is previous GHCR x.y.z patch-bumped (first: 1.0.0)
#                   Packaging starts the image and requires GET / + SPA fallback
#   Cloud-ready: no VITE_* lab URLs in the bundle; no REST_BASE_URL / Stripe sk_ /
#   AWS keys in ENV/ARG/.env. Baked nginx is try_files only so CD can mount /api.
#
# Application:
#   https://github.com/SA62-team1/heavy-rental-react-web-portal
#   React 19 + TypeScript + Vite 8 (npm)
#
# How the portal uses this on release
# -----------------------------------
# Install both files into the React web portal repository:
#
#   .github/workflows/release-pipeline.yml       ← this file (reusable only)
#   .github/workflows/portal-release-caller.yml  ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than portal-release-caller.yml.
#
# Invoked via portal-release-caller.yml when:
#   - a GitHub Release is published, or
#   - a pull request is opened/updated from develop → master
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/release-pipeline.yml
#
# Also mirrored in the pipeline-development repo for discovery/testing:
#   .github/workflows/web-portal-release.yml
# Keep this file and that mirror in sync when developing here.
#
# Local validation (from pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-web-portal-pipeline/release-pipeline/release-pipeline.yml
#   actionlint .github/workflows/web-portal-release.yml
# =============================================================================

name: Web Portal Release CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/portal-release-caller.yml (enforced below).
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required when the portal invokes this workflow).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for release / develop→master PR.
        required: false
        type: string
        default: ""

# One run per release tag or develop→master PR; do not cancel in-flight packaging
concurrency:
  group: web-portal-release-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # Required for github/codeql-action/analyze
  security-events: write
  actions: read
  # Required to push release images to GHCR
  packages: write

env:
  NODE_VERSION: "22"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: SA62-team1/heavy-rental-react-web-portal
  DEFAULT_APP_REF: master
  IMAGE_NAME: heavy_rental_web_portal
  NGINX_BASE_IMAGE: nginx:1.27-alpine

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only portal-release-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only portal-release-caller.yml
        env:
          # github context is that of the caller workflow for reusable workflows
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/portal-release-caller.yml@*)
              echo "Allowed caller: portal-release-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`portal-release-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::release-pipeline.yml may only be invoked by .github/workflows/portal-release-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration — fetch source, install dependencies, verify install health
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 15
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
      node-modules-cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="${INPUT_REF:-${DEFAULT_APP_REF_VALUE}}"
            MODE=remote
          else
            # portal-release-caller.yml in the same repo: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="${INPUT_REF:-${GH_SHA}}"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (release / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Report dependency cache status
        run: |
          if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" = "true" ]; then
            echo "node_modules restored from cache (skipped npm ci)."
          else
            echo "node_modules cache miss — installed with npm ci; cache will be saved at job end."
          fi
          echo "Lockfile hash key uses package-lock.json + Node ${{ env.NODE_VERSION }} + ${{ runner.os }}"

      - name: Verify install integrity
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Node / npm versions"
          node --version
          npm --version
          echo "==> package.json scripts"
          npm run | head -n 50 || true
          echo "==> Dependency tree (top level)"
          npm ls --depth=0
          test -f package-lock.json
          test -d node_modules
          echo "Integration checks passed."

      - name: Upload lockfile fingerprint for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-integration-metadata
          path: |
            ${{ env.APP_PATH }}/package.json
            ${{ env.APP_PATH }}/package-lock.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Quality control — lint + TypeScript project build (typecheck)
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 15
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: ESLint (static analysis)
        working-directory: ${{ env.APP_PATH }}
        run: npm run lint

      - name: TypeScript typecheck (tsc -b)
        working-directory: ${{ env.APP_PATH }}
        run: npx tsc -b --pretty false

  # ---------------------------------------------------------------------------
  # 3. Security testing — SAST + SCA + filesystem vulnerability scan
  # ---------------------------------------------------------------------------
  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 25
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Create security reports directory
        run: mkdir -p "${GITHUB_WORKSPACE}/security-reports"

      # --- SAST: static analysis (standard report format: SARIF) ---
      - name: Setup Python (Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: SAST — Semgrep (TypeScript / React / OWASP) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          SEMGREP_COMMON=(
            --config=p/typescript
            --config=p/react
            --config=p/javascript
            --config=p/owasp-top-ten
            --config=p/security-audit
            --config=p/secrets
            --metrics=off
          )

          # --- Pass 1: always write SARIF (standard report). Does not fail the step. ---
          echo "==> Semgrep report (SARIF 2.1.0)"
          set +e
          semgrep scan "${SEMGREP_COMMON[@]}" \
            --sarif \
            --output="${REPORT_DIR}/semgrep.sarif" \
            .
          SARIF_RC=$?
          set -e
          if [ -f "${REPORT_DIR}/semgrep.sarif" ]; then
            echo "SARIF written: ${REPORT_DIR}/semgrep.sarif (semgrep exit=${SARIF_RC}; non-zero is OK for report pass)"
          else
            echo "::warning::semgrep.sarif was not produced (exit=${SARIF_RC})"
          fi

          # --- Pass 2: CI gate — fail only if ERROR-severity findings exist. ---
          echo "==> SAST gate (ERROR severity only; exit 1 if findings)"
          set +e
          semgrep scan "${SEMGREP_COMMON[@]}" \
            --severity=ERROR \
            --error \
            --text \
            .
          GATE_RC=$?
          set -e
          if [ "${GATE_RC}" -ne 0 ]; then
            echo "::error::Semgrep SAST gate failed (exit=${GATE_RC})."
            echo "The SARIF report may still have been written successfully."
            echo "This step fails because --severity=ERROR --error found ERROR-level issues"
            echo "(or Semgrep could not complete the gate scan)."
            echo "Open security-reports/semgrep.sarif or the text findings above."
            exit "${GATE_RC}"
          fi
          echo "SAST (Semgrep) gate passed — no ERROR-level findings. SARIF: security-reports/semgrep.sarif"

      # --- SCA: dependency vulnerabilities (npm audit → SARIF) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: SCA — npm audit (high / critical) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          mkdir -p "${REPORT_DIR}"
          set +e
          npm audit --audit-level=high --json > "${REPORT_DIR}/npm-audit.json" 2>"${REPORT_DIR}/npm-audit-stderr.txt"
          AUDIT_EXIT=$?
          set -e
          # Quoted heredoc (<<'PY') does not expand shell vars; use os.environ in Python.
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          report_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "security-reports"
          report_dir.mkdir(parents=True, exist_ok=True)
          src = report_dir / "npm-audit.json"
          out = report_dir / "npm-audit.sarif"
          try:
              data = json.loads(src.read_text(encoding="utf-8") or "{}")
          except Exception as e:
              print(f"::warning::Could not parse npm audit JSON: {e}")
              data = {}
          results = []
          vulns = data.get("vulnerabilities") or {}
          if isinstance(vulns, dict):
              for name, v in vulns.items():
                  if not isinstance(v, dict):
                      continue
                  severity = (v.get("severity") or "warning").lower()
                  level = {
                      "critical": "error", "high": "error",
                      "moderate": "warning", "medium": "warning",
                      "low": "note", "info": "note",
                  }.get(severity, "warning")
                  via = v.get("via") or []
                  title = name
                  help_uri = ""
                  if via and isinstance(via[0], dict):
                      title = via[0].get("title") or name
                      help_uri = via[0].get("url") or ""
                  msg = f"{name}: {title} (severity={severity}, range={v.get('range', '')})"
                  results.append({
                      "ruleId": f"npm-audit/{name}",
                      "level": level,
                      "message": {"text": msg},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": "package-lock.json"},
                          }
                      }],
                      **({"properties": {"helpUri": help_uri}} if help_uri else {}),
                  })
          advisories = data.get("advisories") or {}
          if isinstance(advisories, dict):
              for adv_id, a in advisories.items():
                  if not isinstance(a, dict):
                      continue
                  severity = (a.get("severity") or "warning").lower()
                  level = {
                      "critical": "error", "high": "error",
                      "moderate": "warning", "medium": "warning",
                      "low": "note", "info": "note",
                  }.get(severity, "warning")
                  module = a.get("module_name") or "dependency"
                  title = a.get("title") or module
                  msg = f"{module}: {title} (severity={severity})"
                  results.append({
                      "ruleId": f"npm-audit/{adv_id}",
                      "level": level,
                      "message": {"text": msg},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": "package-lock.json"},
                          }
                      }],
                  })
          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "npm-audit",
                          "informationUri": "https://docs.npmjs.com/cli/commands/npm-audit",
                          "rules": [],
                      }
                  },
                  "results": results,
              }],
          }
          out.write_text(json.dumps(sarif, indent=2), encoding="utf-8")
          print(f"Wrote SARIF report: {out} ({len(results)} result(s))")
          PY
          if [ "${AUDIT_EXIT}" -ne 0 ]; then
            echo "::error::npm audit found high or critical vulnerabilities. See npm-audit.sarif"
            npm audit --audit-level=high || true
            exit "${AUDIT_EXIT}"
          fi
          echo "npm audit passed — SARIF report: security-reports/npm-audit.sarif"

      # --- Filesystem / supply-chain scan (standard report format: SARIF) ---
      # One shared Actions cache for vuln DB (avoids ~100MB re-download per step).
      # Weekly key; restore-keys fall back to any prior OS cache. Per-step trivy cache is off.
      - name: Trivy cache key
        id: trivy-cache-meta
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DBs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache-meta.outputs.week }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Pass 1: always write SARIF (standard report). Do not fail the step on findings —
      # otherwise SARIF mode hides the vulns in the log and only shows exit code 1.
      - name: Trivy filesystem scan (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: security-reports/trivy-fs.sarif
          ignore-unfixed: true
          scanners: vuln
          # Shared job-level cache above; disable nested restore/save per scan
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # Pass 2: human-readable findings in the job log (never blocks).
      - name: Trivy filesystem scan (console table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          ignore-unfixed: true
          scanners: vuln
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # Pass 3: CI gate — fail only on CRITICAL, unfixed vulns (mirrors Semgrep ERROR gate).
      - name: Trivy SCA gate (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true
          scanners: vuln
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # --- Publish SARIF security reports to GitHub Code Scanning ---
      - name: Upload Semgrep SARIF to Code Scanning
        if: always() && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: web-portal-release-semgrep
        continue-on-error: true

      - name: Upload npm audit SARIF to Code Scanning
        if: always() && hashFiles('security-reports/npm-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/npm-audit.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: web-portal-release-npm-audit
        continue-on-error: true

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('security-reports/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/trivy-fs.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: web-portal-release-trivy-fs
        continue-on-error: true

      - name: Upload security reports (SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-reports-sarif
          path: |
            security-reports/*.sarif
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 4. CodeQL analysis — GitHub CodeQL for JavaScript / TypeScript
  #    Runs after Integration; parallel with QC and Security.
  #    Packaging waits for CodeQL (and QC + Security) to succeed.
  #    Results appear under the repository Security → Code scanning alerts.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Initialize CodeQL (JavaScript / TypeScript)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: ${{ env.APP_PATH }}
          # security-and-quality: security rules + maintainability / reliability
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies for CodeQL (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      # Optional build improves extraction for TypeScript projects that emit JS
      - name: Build for CodeQL (TypeScript project build)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          # Prefer tsc project build; fall back to vite build if no tsc -b setup
          if npx tsc -b --pretty false 2>/dev/null; then
            echo "TypeScript project build completed for CodeQL."
          elif npm run build --if-present; then
            echo "npm run build completed for CodeQL."
          else
            echo "No build step available; CodeQL will analyze sources as-is."
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "web-portal-release-codeql-js"

      - name: CodeQL summary
        if: always()
        run: |
          {
            echo "### CodeQL Analysis"
            echo ""
            echo "Language: JavaScript / TypeScript"
            echo "Query suite: security-and-quality"
            echo "Category: web-portal-release-codeql-js"
            echo ""
            echo "View results: repository → Security → Code scanning alerts"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Packaging — Vite production build + .zip + Docker (nginx) image
  # ---------------------------------------------------------------------------
  # Vite SPA deploy model:
  #   - build output dir: dist/ (default; index.html is the document root)
  #   - zip unit:         .zip of dist/ *contents* (extract → web server root)
  #   - docker unit:      nginx:alpine serving dist/ (SPA fallback to index.html)
  #   - GHCR:             heavy_rental_web_portal:<semver> + :latest
  #                       on release (skipped on pull_request)
  # Do not ship source or node_modules in either package.
  # ---------------------------------------------------------------------------
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    # Integration first; packaging waits for QC, Security, and CodeQL
    needs: [integration, quality-control, security-testing, codeql]
    timeout-minutes: 30
    env:
      # Vite default outDir — change only if portal vite.config sets build.outDir
      VITE_DIST_DIR: dist
      # Deploy archive extension for static Vite SPA web-server deployment
      PACKAGE_EXT: zip
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Production build (tsc -b && vite build)
        working-directory: ${{ env.APP_PATH }}
        run: npm run build
        env:
          CI: true
          # Academy SPA uses same-origin /api (guest nginx). Do not inline lab hosts.
          VITE_API_URL: ""
          VITE_REST_URL: ""
          VITE_REST_BASE_URL: ""
          VITE_HAYSTACK_URL: ""
          VITE_HAYSTACK_BASE_URL: ""
          STRIPE_API_KEY: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SESSION_TOKEN: ""

      - name: Verify Vite build output (static SPA for web server)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          DIST="${VITE_DIST_DIR}"

          echo "==> Expect Vite static SPA under ${DIST}/"
          test -d "${DIST}"
          test -f "${DIST}/index.html"

          # Vite emits hashed JS/CSS under dist/assets/ (or flat files in dist/)
          JS_COUNT="$(find "${DIST}" -type f \( -name '*.js' -o -name '*.mjs' \) | wc -l | tr -d ' ')"
          CSS_COUNT="$(find "${DIST}" -type f -name '*.css' | wc -l | tr -d ' ')"
          if [ "${JS_COUNT}" -lt 1 ]; then
            echo "::error::No JavaScript bundles found under ${DIST}/ — Vite build looks incomplete."
            find "${DIST}" -type f | sort | head -n 100 || true
            exit 1
          fi

          # Reject packaging wrong artifact types (source tarballs, Node server bundles, etc.)
          if [ -f "${DIST}/package.json" ] || [ -d "${DIST}/node_modules" ]; then
            echo "::error::${DIST}/ looks like source/runtime, not a Vite static build."
            exit 1
          fi

          echo "==> ${DIST} layout (sample)"
          find "${DIST}" -maxdepth 3 -type f | sort | head -n 80
          echo "==> counts: js/mjs=${JS_COUNT} css=${CSS_COUNT}"
          du -sh "${DIST}"
          echo "Vite static build verified (index.html + JS present)."

          echo "==> Scan dist/ for secrets and baked lab backends"
          HITS="$(
            grep -RInE --binary-files=without-match \
              'sk_live_|sk_test_|AWS_SECRET_ACCESS_KEY|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE|jdbc:postgresql://|localhost:8080|localhost:8000|127\.0\.0\.1:8080|127\.0\.0\.1:8000' \
              "${DIST}" || true
          )"
          if [ -n "${HITS}" ]; then
            echo "::error::dist/ contains secrets or lab backend URLs. Academy SPA must use same-origin /api; do not bake VITE_* hosts or sk_."
            echo "${HITS}" | head -n 80
            exit 1
          fi
          echo "dist/ has no sk_/AWS/JDBC/localhost:8080|8000 bake-in."

      - name: Resolve next heavy_rental_web_portal version
        id: image-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi

          PREV="$(printf '%s\n' "${TAGS}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "${PREV}" ]; then
            NEXT="1.0.0"
            PREV_DISPLAY="none"
          else
            IFS=. read -r MAJ MIN PAT <<< "${PREV}"
            NEXT="${MAJ}.${MIN}.$((PAT + 1))"
            PREV_DISPLAY="${PREV}"
          fi

          echo "previous_version=${PREV_DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "image_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Resolved GHCR image version: previous=${PREV_DISPLAY} next=${NEXT}"
          {
            echo "### GHCR image version"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${PKG}\` |"
            echo "| Previous semver | \`${PREV_DISPLAY}\` |"
            echo "| Next semver | \`${NEXT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release package (.zip for Vite static web deploy)
        id: package
        working-directory: ${{ env.APP_PATH }}
        env:
          # Bind github context for use in shell (Semgrep: no github context in run: scripts)
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}
          PREVIOUS_IMAGE_VERSION: ${{ steps.image-version.outputs.previous_version }}
        run: |
          set -euo pipefail
          DIST="${VITE_DIST_DIR}"
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          RUN_ID="${GH_RUN_NUMBER}"

          # Versioned + stable names; both are .zip of dist/ contents (document root).
          ARCHIVE_NAME="heavy-rental-web-portal-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.${PACKAGE_EXT}"
          STABLE_NAME="heavy-rental-web-portal-dist.${PACKAGE_EXT}"
          ARCHIVE_PATH="${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"
          STABLE_PATH="${GITHUB_WORKSPACE}/${STABLE_NAME}"

          # zip from inside dist so extract lands index.html at archive root (web server root).
          # Requires zip(1) on ubuntu-latest runners.
          (
            cd "${DIST}"
            zip -r "${ARCHIVE_PATH}" .
          )

          # Validate archive extension and that index.html is at zip root
          case "${ARCHIVE_NAME}" in
            *.zip) ;;
            *)
              echo "::error::Expected .${PACKAGE_EXT} package for Vite static deploy, got: ${ARCHIVE_NAME}"
              exit 1
              ;;
          esac
          if ! unzip -l "${ARCHIVE_PATH}" | awk '{print $NF}' | grep -qx 'index.html'; then
            echo "::error::Package must contain index.html at archive root for static web-server deploy."
            unzip -l "${ARCHIVE_PATH}" | head -n 40 || true
            exit 1
          fi

          cp "${ARCHIVE_PATH}" "${STABLE_PATH}"

          # Record magic / type for deploy consumers
          file "${ARCHIVE_PATH}" || true
          ls -lh "${ARCHIVE_PATH}" "${STABLE_PATH}"

          IMAGE_TAG="${IMAGE_VERSION}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "::error::Resolved image version is empty"
            exit 1
          fi
          # GHCR requires lowercase image repository path segments
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_LOCAL_LATEST="${IMAGE_NAME_LC}:latest"
          IMAGE_REMOTE="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_REMOTE_LATEST="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:latest"
          IMAGE_TAR="heavy_rental_web_portal-${IMAGE_TAG}.tar.gz"

          {
            echo "archive_name=${ARCHIVE_NAME}"
            echo "stable_name=${STABLE_NAME}"
            echo "package_ext=${PACKAGE_EXT}"
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "previous_image_version=${PREVIOUS_IMAGE_VERSION}"
            echo "image_local=${IMAGE_LOCAL}"
            echo "image_local_latest=${IMAGE_LOCAL_LATEST}"
            echo "image_remote=${IMAGE_REMOTE}"
            echo "image_remote_latest=${IMAGE_REMOTE_LATEST}"
            echo "image_tar=${IMAGE_TAR}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload dist directory
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-dist
          path: ${{ env.APP_PATH }}/${{ env.VITE_DIST_DIR }}/
          retention-days: 14

      - name: Upload packaged archive (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-package
          path: |
            ${{ github.workspace }}/${{ steps.package.outputs.archive_name }}
            ${{ github.workspace }}/${{ steps.package.outputs.stable_name }}
          retention-days: 14

      # -------------------------------------------------------------------
      # Docker image: always nginx + Vite dist/ so Academy CD can deploy.
      # An app Dockerfile (Node/Vite preview, etc.) is not the deploy image.
      # CD later mounts default.conf with /api → REST_BASE_URL.
      # -------------------------------------------------------------------
      - name: Prepare Dockerfile for static SPA image
        working-directory: ${{ env.APP_PATH }}
        env:
          DIST_DIR: ${{ env.VITE_DIST_DIR }}
          NGINX_BASE_IMAGE: ${{ env.NGINX_BASE_IMAGE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          DIST="${DIST_DIR}"
          if [ ! -d "${DIST}" ] || [ ! -f "${DIST}/index.html" ]; then
            echo "::error::Vite dist for Docker build not found under ${DIST}/"
            exit 1
          fi

          if [ -f .dockerignore ] && grep -Eiq '^[[:space:]]*(\./)?dist(/|\*|/\*)?[[:space:]]*$' .dockerignore; then
            echo "::error::.dockerignore excludes dist/; Release cannot COPY the Vite SPA into nginx."
            cat .dockerignore
            exit 1
          fi

          if [ -f Dockerfile ]; then
            echo "Application Dockerfile present — moving aside. Release always builds nginx + Vite dist/ for GHCR/CD."
            mv Dockerfile Dockerfile.app-repo
          fi

          echo "Generating nginx SPA Dockerfile (React/Vite dist → ${NGINX_BASE_IMAGE})"
          {
            echo "# Generated by web-portal release packaging (Vite dist → nginx)"
            echo "# Academy CD mounts a new default.conf with location /api/ → REST_BASE_URL."
            echo "# This file must stay try_files-only (no proxy_pass hostname)."
            echo "server {"
            echo "  listen 80;"
            echo "  server_name _;"
            echo "  root /usr/share/nginx/html;"
            echo "  index index.html;"
            echo "  # SPA client-side routing"
            echo "  location / {"
            echo "    try_files \$uri \$uri/ /index.html;"
            echo "  }"
            echo "  # Cache hashed Vite assets aggressively"
            echo "  location /assets/ {"
            echo "    try_files \$uri =404;"
            echo "    add_header Cache-Control \"public, max-age=31536000, immutable\";"
            echo "  }"
            echo "}"
          } > nginx-spa.conf

          {
            echo "# Generated by web-portal release packaging (Vite dist → nginx)"
            echo "# Runtime: static files only. Do not ENV REST_BASE_URL / VITE_* / STRIPE_ / AWS_."
            echo "# Guest nginx /api proxy is mounted by Academy CD, not baked here."
            echo "FROM ${NGINX_BASE_IMAGE}"
            echo "LABEL org.opencontainers.image.title=\"${IMAGE_NAME}\""
            echo "LABEL org.opencontainers.image.description=\"Heavy Rental React Web Portal (Vite SPA on nginx)\""
            echo "LABEL org.opencontainers.image.source=\"https://github.com/${APP_REPOSITORY}\""
            echo "LABEL org.opencontainers.image.revision=\"${SHORT_SHA}\""
            echo "LABEL org.opencontainers.image.version=\"${VERSION}\""
            echo ""
            echo "COPY nginx-spa.conf /etc/nginx/conf.d/default.conf"
            echo "COPY ${DIST}/ /usr/share/nginx/html/"
            echo ""
            echo "EXPOSE 80"
            echo "HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\"
            echo "  CMD wget -qO- http://127.0.0.1/ >/dev/null || exit 1"
            echo 'CMD ["nginx", "-g", "daemon off;"]'
          } > Dockerfile

          echo "==> Dockerfile"
          cat Dockerfile
          echo "==> dist for image: ${DIST}/ ($(du -sh "${DIST}" | awk '{print $1}'))"

          if grep -Eiq 'proxy_pass[[:space:]]+https?://' nginx-spa.conf; then
            echo "::error::Generated nginx-spa.conf must not proxy_pass to a hostname. CD mounts /api."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*(ENV|ARG)[[:space:]]+(REST_BASE_URL|VITE_|STRIPE_|AWS_|PORTAL_IMAGE)' Dockerfile; then
            echo "::error::Dockerfile bakes REST/Vite/Stripe/AWS config (ENV/ARG). Guest nginx + SM own /api."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*COPY[[:space:]]+[^[:space:]]*\.env' Dockerfile; then
            echo "::error::Dockerfile copies a .env file. Do not bake portal secrets into the SPA image."
            exit 1
          fi

      - name: Build Docker image
        id: docker
        working-directory: ${{ env.APP_PATH }}
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_LOCAL_LATEST: ${{ steps.package.outputs.image_local_latest }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
        run: |
          set -euo pipefail
          # Enforce lowercase repository path (GHCR rejects mixed-case names)
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          IMAGE_LOCAL_LATEST="${IMAGE_LOCAL_LATEST,,}"
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"

          # No --build-arg for REST_BASE_URL / VITE_ / STRIPE_ / AWS_ / PORTAL_IMAGE
          docker build \
            --pull \
            -t "${IMAGE_LOCAL}" \
            -t "${IMAGE_LOCAL_LATEST}" \
            -t "${IMAGE_REMOTE}" \
            -t "${IMAGE_REMOTE_LATEST}" \
            .

          echo "==> Images built"
          echo "Local:  ${IMAGE_LOCAL}"
          echo "GHCR:   ${IMAGE_REMOTE}"
          docker images "${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          docker images "ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true

          # Export every tag so docker load matches compose (local + GHCR + :latest)
          TAR_PATH="${GITHUB_WORKSPACE}/${IMAGE_TAR}"
          docker save \
            "${IMAGE_LOCAL}" \
            "${IMAGE_LOCAL_LATEST}" \
            "${IMAGE_REMOTE}" \
            "${IMAGE_REMOTE_LATEST}" \
            | gzip -c > "${TAR_PATH}"
          ls -lh "${TAR_PATH}"
          if [ ! -s "${TAR_PATH}" ]; then
            echo "::error::Docker image tar is missing or empty: ${TAR_PATH}"
            exit 1
          fi

          {
            echo "image_id=$(docker image inspect -f '{{.Id}}' "${IMAGE_LOCAL}")"
            echo "tar_path=${TAR_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Prove image is deployable
        env:
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          NAME="portal-smoke-${GITHUB_RUN_ID:-$$}"

          ENV_JSON="$(docker image inspect -f '{{json .Config.Env}}' "${IMAGE_LOCAL}")"
          echo "Image Config.Env: ${ENV_JSON}"
          if printf '%s' "${ENV_JSON}" | grep -Eq '"REST_BASE_URL=|"VITE_|"STRIPE_|"AWS_|"PORTAL_IMAGE='; then
            echo "::error::Image bakes REST/Vite/Stripe/AWS env. Guest nginx + heavy-rental/portal own /api."
            exit 1
          fi

          EXPOSED="$(docker image inspect -f '{{json .Config.ExposedPorts}}' "${IMAGE_LOCAL}")"
          echo "Image ExposedPorts: ${EXPOSED}"
          if ! printf '%s' "${EXPOSED}" | grep -q '80/tcp'; then
            echo "::error::Image does not EXPOSE 80/tcp. Academy compose maps 80:80."
            exit 1
          fi

          docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c \
            'test -f /usr/share/nginx/html/index.html && test "$(find /usr/share/nginx/html -type f \( -name "*.js" -o -name "*.mjs" \) | wc -l)" -ge 1'
          echo "Image contains /usr/share/nginx/html/index.html and at least one JS bundle"

          HITS="$(
            docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c \
              'grep -RInE "sk_live_|sk_test_|AWS_SECRET_ACCESS_KEY|jdbc:postgresql://|localhost:8080|localhost:8000|127.0.0.1:8080|127.0.0.1:8000" /usr/share/nginx/html || true'
          )"
          if [ -n "${HITS}" ]; then
            echo "::error::Image html tree contains secrets or lab backend URLs."
            echo "${HITS}" | head -n 80
            exit 1
          fi

          cleanup() { docker rm -f "${NAME}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "${NAME}" "${IMAGE_LOCAL}"
          ok=0
          for _ in $(seq 1 15); do
            if docker exec "${NAME}" wget -qO- http://127.0.0.1/ >/tmp/portal-index.html 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::Portal image did not serve GET / on port 80 (not deployable)."
            docker logs "${NAME}" || true
            exit 1
          fi
          if ! grep -Eiq '<html|<!doctype' /tmp/portal-index.html; then
            echo "::error::GET / did not return HTML."
            head -n 20 /tmp/portal-index.html || true
            exit 1
          fi
          if ! docker exec "${NAME}" wget -qO- http://127.0.0.1/spa-fallback-check >/tmp/portal-spa.html 2>/dev/null; then
            echo "::error::GET /spa-fallback-check failed — SPA try_files is required for React routes."
            docker logs "${NAME}" || true
            exit 1
          fi
          if ! grep -Eiq '<html|<!doctype' /tmp/portal-spa.html; then
            echo "::error::GET /spa-fallback-check did not return HTML (React client routes would 404)."
            head -n 20 /tmp/portal-spa.html || true
            exit 1
          fi
          echo "GET / and GET /spa-fallback-check returned HTML; image is deployable (nginx SPA on :80)."

          {
            echo "### Deployable image"
            echo ""
            echo "Generated \`nginx:1.27-alpine\` image with Vite \`dist/\` at \`/usr/share/nginx/html\`."
            echo "No baked REST_BASE_URL / VITE_ / STRIPE_ / AWS_ in Config.Env."
            echo "Static \`index.html\` + JS bundle present. Bundle has no sk_/JDBC/localhost:8080|8000."
            echo "Container served \`GET /\` and SPA fallback \`GET /spa-fallback-check\` (HTML) on port 80, then was removed."
            echo "Academy CD mounts nginx \`/api\` → \`REST_BASE_URL\` from \`heavy-rental/portal\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: web-portal-release-docker-image
          path: ${{ github.workspace }}/${{ steps.package.outputs.image_tar }}
          retention-days: 14
          if-no-files-found: error

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.package.outputs.image_tag }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
        run: |
          set -euo pipefail
          # Repository path already lowercased at package time; re-enforce for GHCR
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi
          if printf '%s\n' "${TAGS}" | grep -qx "${IMAGE_TAG}"; then
            echo "::error::GHCR tag ${IMAGE_REMOTE} already exists; will not overwrite a version tag."
            exit 1
          fi

          docker push "${IMAGE_REMOTE}"
          docker push "${IMAGE_REMOTE_LATEST}"
          echo "Pushed:"
          echo "  ${IMAGE_REMOTE}"
          echo "  ${IMAGE_REMOTE_LATEST}"

      - name: Packaging summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          APP_REF: ${{ needs.integration.outputs.app_ref }}
          VERSION: ${{ steps.package.outputs.version }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          PACKAGE_EXT: ${{ steps.package.outputs.package_ext }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          STABLE_NAME: ${{ steps.package.outputs.stable_name }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
          IMAGE_ID: ${{ steps.docker.outputs.image_id }}
        run: |
          {
            echo "### Packaging complete (Vite static SPA)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Application | \`${APP_REPOSITORY}\` |"
            echo "| Ref | \`${APP_REF}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Package format | \`.${PACKAGE_EXT}\` (static web-server deploy) |"
            echo "| Versioned archive | \`${ARCHIVE_NAME}\` |"
            echo "| Stable archive | \`${STABLE_NAME}\` |"
            echo "| Docker image (local) | \`${IMAGE_LOCAL}\` |"
            echo "| Docker image (GHCR) | \`${IMAGE_REMOTE}\` |"
            echo "| Docker image (GHCR latest) | \`${IMAGE_REMOTE_LATEST}\` |"
            echo "| Image archive | \`${IMAGE_TAR}\` |"
            echo "| Image ID | \`${IMAGE_ID}\` |"
            echo "| Artifacts | \`web-portal-dist\`, \`web-portal-package\`, \`web-portal-release-docker-image\` |"
            echo ""
            echo "### Deploy options"
            echo ""
            echo "1. **Zip** — download \`web-portal-package\` and unzip so \`index.html\` is the web root (nginx/IIS/S3/Azure static)."
            echo "2. **Image archive** — \`docker load < ${IMAGE_TAR}\` then run \`${IMAGE_LOCAL}\` (maps port 80)."
            if [ "${EVENT_NAME}" != "pull_request" ]; then
              echo "3. **GHCR** — \`docker pull ${IMAGE_REMOTE}\` or \`docker pull ${IMAGE_REMOTE_LATEST}\`."
            else
              echo "3. **GHCR** — push skipped on pull_request; image is available as the tar artifact only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
