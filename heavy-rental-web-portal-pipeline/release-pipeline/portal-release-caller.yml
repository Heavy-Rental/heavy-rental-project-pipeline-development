# =============================================================================
# Install into: heavy-rental-react-web-portal
# Path:         .github/workflows/portal-release-caller.yml
# =============================================================================
# Release caller — manual dispatch only (Actions → Release → Run workflow).
# Checks out master, QC, image, DAST, then public GHCR + GitHub Release.
#
# Feature-branch PR validation remains CI (portal-ci-caller.yml).
#
# Place both files in the React web portal repository:
#
#   .github/workflows/portal-release-caller.yml  ← this file (triggers)
#   .github/workflows/release-pipeline.yml       ← reusable pipeline (called)
#
# When this runs
# --------------
#   A) GitHub → Releases → Publish release
#      (or gh release create / API that publishes a release)
#
#   B) Pull request whose head is develop and base is master
#      (opened, synchronize, reopened, ready_for_review)
#
#   Does NOT run on:
#     - push to master/develop alone
#     - PRs from feature branches (even into master)
#     - PRs into develop
#     - tag push alone (publish a GitHub Release, or open develop→master PR)
#
# Flow
# ----
#   feature → develop (CI) → PR develop→master (this release pipeline)
#   and/or: publish GitHub Release → this pipeline
#     → Integration → QC → Security → CodeQL → Packaging
#
# Reusable workflow (same repository):
#   ./.github/workflows/release-pipeline.yml
#
# Job priority inside the reusable workflow
# -----------------------------------------
#   1. Integration           ← HIGHEST PRIORITY
#   2. Quality Control       (needs Integration)
#   2. Security Testing      (needs Integration)
#   2. CodeQL Analysis       (needs Integration; JS/TS Code Scanning)
#   3. Packaging             (needs Integration + QC + Security + CodeQL)
#      → Vite dist/ .zip + Docker (nginx) image
#        → GHCR heavy_rental_web_portal:<semver> and :latest on release
#
# Setup
# -----
# 1. Copy into the portal repo:
#      .github/workflows/portal-release-caller.yml
#      .github/workflows/release-pipeline.yml
# =============================================================================

name: Release

on:
  workflow_dispatch:

concurrency:
  group: portal-release-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read
  packages: write

jobs:
  release-pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
