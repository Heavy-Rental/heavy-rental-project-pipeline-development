# =============================================================================
# Install into: heavy-rental-react-web-portal
# Path:         .github/workflows/portal-release-caller.yml
# =============================================================================
# Release caller — manual dispatch only (Actions → Release → Run workflow).
# Checks out master, QC, image, DAST, then public GHCR + GitHub Release.
# Do not use on: release — Publish in the reusable workflow creates the
# GitHub Release.
#
# Feature-branch PR validation remains CI (portal-ci-caller.yml).
# SAST / CodeQL / REST Endpoint Tests live on Integration CI, not this caller.
#
# Place both files in the React web portal repository:
#
#   .github/workflows/portal-release-caller.yml  ← this file (triggers)
#   .github/workflows/release-pipeline.yml       ← reusable pipeline (called)
#
# When this runs
# --------------
#   workflow_dispatch only (Actions → this workflow → Run workflow).
#   The operator keys in run_name; that string is this workflow run's name
#   in the Actions list. GitHub Release title and GHCR tags are unchanged.
#
#   Does NOT run on:
#     - published GitHub Release (this pipeline creates that Release)
#     - pull request develop → master
#     - push to master/develop alone
#     - PRs from feature branches
#     - PRs into develop
#     - tag push alone
#
# Flow
# ----
#   feature → develop (CI) → merge to master → workflow_dispatch this pipeline
#     → Integration → QC → Packaging → DAST → Publish
#       (public GHCR heavy_rental_web_portal:<semver> + :latest + GitHub Release)
#
# Reusable workflow (same repository):
#   ./.github/workflows/release-pipeline.yml
#
# Setup
# -----
# 1. Copy into the portal repo:
#      .github/workflows/portal-release-caller.yml
#      .github/workflows/release-pipeline.yml
# =============================================================================

name: Release

run-name: ${{ inputs.run_name }}

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: Name shown for this run in the Actions list (e.g. "Release v1.1.0").
        required: true
        type: string

concurrency:
  group: portal-release-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  # Nested reusable workflows cannot request more than the caller grants;
  # omitted scopes become none.
  pull-requests: read
  security-events: write
  actions: read
  packages: write

jobs:
  release-pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
