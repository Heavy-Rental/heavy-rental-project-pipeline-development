# =============================================================================
# Heavy Rental Web Portal — Fast Feedback CI Pipeline (reusable)
# =============================================================================
# Purpose: quick Integration-only check (same steps as Integration Check in
# integration-pipeline.yml when Fast Feedback is not reused). No Quality Control,
# Security, REST endpoint tests, or packaging.
#
# Stages:
#   1. Integration only — checkout, Node 22, npm ci, install health
#
# Use this for early signal on feature-branch pushes (no pull_request trigger).
# Sole Integration-stage run for a feature-branch SHA. Integration CI must not
# call this workflow on PR; it reuses a successful run of this pipeline for the
# PR head SHA and skips repeating npm ci / install health in Integration Check.
# Full gates remain in:
#   integration-pipeline.yml  (portal-ci-caller.yml)
#   release-pipeline.yml      (portal-release-caller.yml)
#
# How the portal uses this
# ------------------------
# Install both files into the React web portal repository:
#
#   .github/workflows/fast-feedback-pipeline.yml         ← this file (reusable only)
#   .github/workflows/portal-fast-feedback-caller.yml    ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than portal-fast-feedback-caller.yml.
# portal-ci-caller.yml must not become a second caller (that would re-run
# Fast Feedback on every PR).
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/fast-feedback-pipeline.yml
#
# Authoring copy lives in this tree. There is no
# .github/workflows/web-portal-fast-feedback.yml mirror in this repo.
# =============================================================================

name: Web Portal Fast Feedback CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/portal-fast-feedback-caller.yml
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required for PR checks on the portal).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for pull_request events.
        required: false
        type: string
        default: ""

# Fast feedback: cancel superseded runs quickly
concurrency:
  group: web-portal-fast-feedback-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  NODE_VERSION: "22"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/heavy-rental-react-web-portal
  DEFAULT_APP_REF: develop

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only portal-fast-feedback-caller.yml may invoke this
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only portal-fast-feedback-caller.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/portal-fast-feedback-caller.yml@*)
              echo "Allowed caller: portal-fast-feedback-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`portal-fast-feedback-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::fast-feedback-pipeline.yml may only be invoked by .github/workflows/portal-fast-feedback-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration — exact same checks as integration-pipeline.yml Integration Check
  #    (checkout, Node, npm ci, install integrity)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 15
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
      node-modules-cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="${INPUT_REF:-${DEFAULT_APP_REF_VALUE}}"
            MODE=remote
          else
            # portal-fast-feedback-caller.yml in the same repo: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="${INPUT_REF:-${GH_SHA}}"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution (fast feedback)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
            echo "| Scope | Integration stage only |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Fast feedback integrating: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (PR / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_PATH }}/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_PATH)) }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies (npm ci)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: Report dependency cache status
        run: |
          if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" = "true" ]; then
            echo "node_modules restored from cache (skipped npm ci)."
          else
            echo "node_modules cache miss — installed with npm ci; cache will be saved at job end."
          fi
          echo "Lockfile hash key uses package-lock.json + Node ${{ env.NODE_VERSION }} + ${{ runner.os }}"

      - name: Verify install integrity
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Node / npm versions"
          node --version
          npm --version
          echo "==> package.json scripts"
          npm run | head -n 50 || true
          echo "==> Dependency tree (top level)"
          npm ls --depth=0
          test -f package-lock.json
          test -d node_modules
          {
            echo "### Integration checks (fast feedback)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Node | \`$(node --version)\` |"
            echo "| npm | \`$(npm --version)\` |"
            echo "| Runner Node | \`${{ env.NODE_VERSION }}\` |"
            echo "| node_modules cache | \`${{ steps.cache-node-modules.outputs.cache-hit }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Fast feedback integration checks passed."

      - name: Upload lockfile fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: fast-feedback-integration-metadata
          path: |
            ${{ env.APP_PATH }}/package.json
            ${{ env.APP_PATH }}/package-lock.json
          retention-days: 3
