# =============================================================================
# Heavy Rental — Security Report Pipeline (reusable)
# =============================================================================
# Purpose: summarize the calling repository's EXISTING GitHub Code Scanning
# alerts (populated by Semgrep, npm audit, Trivy, and CodeQL in
# integration-pipeline.yml / release-pipeline.yml) into a readable report.
# This is a reporting layer only — it does not run any new scans.
#
# Outputs:
#   1. Job Summary   — rendered directly on the Actions run page
#   2. Artifact       — security-report.md, 30-day retention
#
# Auth: uses actions/github-script with the workflow's default GITHUB_TOKEN.
# No PAT, no repo secret. Requires only:
#   contents: read
#   security-events: read
#
# This file is IDENTICAL across all three app repos:
#   heavy-rental-spring-rest-api
#   heavy-rental-react-web-portal
#   haystack-fast-api
#
# This file exposes only workflow_call (no schedule / workflow_dispatch of
# its own). A gate job rejects any caller other than
# portal-security-report-caller.yml.
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/security-report-pipeline.yml
# =============================================================================

name: Security Report

on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override target repository (owner/name) to report on. Leave empty
          to use the calling repository.
        required: false
        type: string
        default: ""
      state:
        description: >
          Code Scanning alert state to include: "open" (default), "closed",
          "dismissed", "fixed", or "all".
        required: false
        type: string
        default: "open"

permissions:
  contents: read
  security-events: read

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only portal-security-report-caller.yml may invoke this
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only *-security-report-caller.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/*-security-report-caller.yml@*)
              echo "Allowed caller: *-security-report-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by a \`*-security-report-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::security-report-pipeline.yml may only be invoked by a *-security-report-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Report — read Code Scanning alerts via REST API, render markdown
  # ---------------------------------------------------------------------------
  report:
    name: Generate security report
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 10
    steps:
      - name: Resolve target repository
        id: meta
        env:
          INPUT_REPO: ${{ inputs.app_repository }}
          GH_REPOSITORY: ${{ github.repository }}
          INPUT_STATE: ${{ inputs.state }}
        run: |
          set -euo pipefail
          TARGET_REPO="${INPUT_REPO:-${GH_REPOSITORY}}"
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"
          echo "state=${INPUT_STATE}" >> "$GITHUB_OUTPUT"
          echo "Reporting on: ${TARGET_REPO} (state=${INPUT_STATE})"

      - name: Fetch Code Scanning alerts and render report
        id: build
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = "${{ steps.meta.outputs.owner }}";
            const repo = "${{ steps.meta.outputs.repo }}";
            const state = "${{ steps.meta.outputs.state }}";
            const fs = require("fs");

            const listParams = { owner, repo, per_page: 100 };
            if (state !== "all") listParams.state = state;

            let alerts = [];
            try {
              alerts = await github.paginate(
                github.rest.codeScanning.listAlertsForRepo,
                listParams
              );
            } catch (err) {
              core.warning(`Could not read Code Scanning alerts: ${err.message}`);
            }

            const severityRank = { critical: 0, high: 1, error: 1, medium: 2, warning: 3, low: 4, note: 5, unknown: 6 };
            const severityOf = (a) =>
              (a.rule?.security_severity_level || a.rule?.severity || "unknown").toLowerCase();

            const byTool = {};
            const bySeverity = {};
            for (const a of alerts) {
              const tool = a.tool?.name || "unknown";
              const sev = severityOf(a);
              byTool[tool] = (byTool[tool] || 0) + 1;
              bySeverity[sev] = (bySeverity[sev] || 0) + 1;
            }

            const sortedSeverities = Object.keys(bySeverity).sort(
              (a, b) => (severityRank[a] ?? 9) - (severityRank[b] ?? 9)
            );
            const sortedAlerts = [...alerts].sort(
              (a, b) => (severityRank[severityOf(a)] ?? 9) - (severityRank[severityOf(b)] ?? 9)
            );

            const lines = [];
            lines.push(`# Security Report — ${owner}/${repo}`);
            lines.push("");
            lines.push(`Generated: ${new Date().toISOString()}`);
            lines.push(`Alert state filter: \`${state}\``);
            lines.push(`Source: GitHub Code Scanning (existing Semgrep / npm audit / Trivy / CodeQL results — no new scans run)`);
            lines.push("");
            lines.push(`## Summary`);
            lines.push("");
            lines.push(`Total alerts: **${alerts.length}**`);
            lines.push("");

            lines.push(`### By severity`);
            lines.push("");
            if (sortedSeverities.length) {
              lines.push("| Severity | Count |");
              lines.push("| --- | --- |");
              for (const sev of sortedSeverities) {
                lines.push(`| ${sev} | ${bySeverity[sev]} |`);
              }
            } else {
              lines.push("_No alerts found for this filter._");
            }
            lines.push("");

            lines.push(`### By tool`);
            lines.push("");
            if (Object.keys(byTool).length) {
              lines.push("| Tool | Count |");
              lines.push("| --- | --- |");
              for (const [tool, count] of Object.entries(byTool).sort((a, b) => b[1] - a[1])) {
                lines.push(`| ${tool} | ${count} |`);
              }
            } else {
              lines.push("_No alerts found for this filter._");
            }
            lines.push("");

            if (sortedAlerts.length) {
              lines.push(`## Alerts`);
              lines.push("");
              lines.push("| # | Severity | Tool | Rule | Location | Link |");
              lines.push("| --- | --- | --- | --- | --- | --- |");
              for (const a of sortedAlerts) {
                const loc = a.most_recent_instance?.location;
                const locStr = loc ? `${loc.path}:${loc.start_line}` : "n/a";
                lines.push(
                  `| ${a.number} | ${severityOf(a)} | ${a.tool?.name || "unknown"} | ${a.rule?.description || a.rule?.id || "n/a"} | \`${locStr}\` | [#${a.number}](${a.html_url}) |`
                );
              }
              lines.push("");
            }

            const report = lines.join("\n");
            fs.writeFileSync("security-report.md", report);
            core.summary.addRaw(report).write();
            core.info(`Report written: security-report.md (${alerts.length} alert(s))`);

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30
