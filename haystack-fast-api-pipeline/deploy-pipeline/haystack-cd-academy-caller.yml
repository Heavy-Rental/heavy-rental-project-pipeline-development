# =============================================================================
# Install into: haystack-fast-api
# Path:         .github/workflows/haystack-cd-academy-caller.yml
# =============================================================================
# Also copy:
#   deploy-pipeline/haystack-cd-academy.yml
#     → .github/workflows/haystack-cd-academy.yml
#   deploy-pipeline/resolve-vocareum-aws/action.yml
#     → .github/actions/resolve-vocareum-aws/action.yml
#
# Haystack app CD (Academy) — branch 1 skeleton.
# Not CI. Not terraform. Compose / GHCR pull is branch 2.
#
# After infra apply + Start Lab: Run this workflow (action=verify) to prove
# asg-haystack is InService + SSM Online. deploy/configure-only fail closed.
# =============================================================================

name: Haystack CD (Academy)

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy / configure-only wait for branch 2. verify = discover only.
        required: true
        type: choice
        default: verify
        options:
          - deploy
          - configure-only
          - verify
      aws_environment:
        description: Must be academy (Vocareum Learner Lab)
        required: true
        type: environment
        default: academy
      image_ref:
        description: GHCR/ECR tag (unused on branch 1)
        required: false
        type: string
        default: ""
      image_http_url:
        description: HTTPS tar.gz (unused on branch 1)
        required: false
        type: string
        default: ""
      aws_access_key_id:
        description: Vocareum AWS Details access key. Empty = Environment academy.
        required: false
        type: string
        default: ""
      aws_secret_access_key:
        description: Vocareum secret access key. Empty = Environment academy.
        required: false
        type: string
        default: ""
      aws_session_token:
        description: Vocareum session token. Empty = Environment academy.
        required: false
        type: string
        default: ""

concurrency:
  group: haystack-cd-academy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  haystack-cd:
    name: Haystack CD pipeline
    uses: ./.github/workflows/haystack-cd-academy.yml
    with:
      action: ${{ inputs.action }}
      aws_environment: ${{ inputs.aws_environment }}
      image_ref: ${{ inputs.image_ref }}
      image_http_url: ${{ inputs.image_http_url }}
    secrets: inherit
