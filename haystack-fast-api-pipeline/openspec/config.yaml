# OpenSpec project config for the Heavy Rental haystack-fast-api pipeline family.
# Specs live next to the workflows they describe.
schema: spec-driven
context: |
  This folder specifies GitHub Actions pipelines for Heavy-Rental/haystack-fast-api.
  Two families live here:
    1. CI — Fast Feedback, Integration CI, and Release packaging
       (openspec/changes/add-haystack-ci-pipeline/). As-implemented of existing YAML.
       Security Report is a scheduled/manual Code Scanning summary, not a merge gate.
    2. App CD — discover asg-haystack and compose (academy Vocareum +
       paid OIDC callers: add-haystack-cd-academy-skeleton,
       add-haystack-cd-academy-deploy, add-haystack-cd-paid-deploy,
       add-haystack-cd-workers).
  Product behaviour for the FastAPI / Haystack service is NOT specified here —
  that lives in the application repository under openspec/.
  Infrastructure setup (VPC, ASGs, RDS, Neo4j) and operate (stop / destroy)
  are NOT specified here — they belong to the infra project.
  ALB tg-haystack health is GET <instance>:8000/health matcher 200-299 (2xx).
  App CD verify uses the same path; GET / and /docs are not the ALB check.
  Fast Feedback, Integration CI, and Release DEFAULT_APP_REPOSITORY is
  Heavy-Rental/haystack-fast-api. Release checkout is always master.
  When Fast Feedback / Integration CI run in the Heavy-Rental Haystack repo,
  checkout is the calling commit.
  Feature-branch push runs Fast Feedback (Integration only). PR Integration
  reuses that SHA and does not call fast-feedback-pipeline.yml.
  Packaging tar is haystack_recommender-image.tar.gz. Publish is workflow_dispatch
  only. First-compose is infra deploy-projects or app CD (not infra apply).
  Compose workers are postgres:17 + sync-from-primary.sh and python:3.12-slim +
  populate-neo4j-from-haystack.sh (wraps populate_neo4j.py; ADR 0011), not uvicorn python -m.
