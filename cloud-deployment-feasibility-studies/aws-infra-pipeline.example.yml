# Stub example only. Live Academy Action:
#   heavy-rental-project-instructure-and-cloud-deploy/.github/workflows/aws-infra-academy.yml
# Do not copy this stub into .github/workflows. Live Actions also have bootstrap
# and deploy-projects (this stub’s action list is incomplete).
# Vocareum-only. Paid CD is aws-infra-paid-pipeline.example.yml (OIDC — no key fields).
#
# Operator (keys change every Start Lab):
#   1. Start Lab → AWS Details
#   2. Run workflow → paste aws_access_key_id / aws_secret_access_key / aws_session_token
#      OR leave them empty and use Environment academy secrets
#   3. Choose action. Do not point this workflow at Environment AWS_ACTUAL.
#
# GitHub cannot secret-type dispatch inputs; they may appear on the run Inputs page.
# Jobs mask them (::add-mask::) and never write them to Secrets Manager or the guest.

name: AWS infrastructure (Academy)

on:
  workflow_dispatch:
    inputs:
      action:
        description: What this run should do
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - configure-only
          - stop
          - destroy
      aws_environment:
        description: Must be academy (Vocareum)
        required: true
        type: environment
        default: academy
      confirm_destroy:
        description: Type destroy to confirm (required when action=destroy)
        required: false
        type: string
        default: ""
      aws_access_key_id:
        description: Vocareum AWS Details (changes every Start Lab). Empty = Environment academy
        required: false
        type: string
        default: ""
      aws_secret_access_key:
        description: Vocareum secret access key
        required: false
        type: string
        default: ""
      aws_session_token:
        description: Vocareum session token
        required: false
        type: string
        default: ""

concurrency:
  group: aws-infra-academy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-lab:
    name: Assert Vocareum session
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 5
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Prove the lab session is live
        run: |
          set -euo pipefail
          if ! aws sts get-caller-identity; then
            echo "::error::AWS call failed. Start Lab and paste fresh AWS Details on the form."
            exit 1
          fi
          {
            echo "### Vocareum session"
            echo ""
            echo "Caller identity succeeded. Action: \`${{ inputs.action }}\`. Environment: \`${{ inputs.aws_environment }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [assert-lab]
    if: inputs.action == 'plan' || inputs.action == 'apply'
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 30
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/checkout@v4

      - name: Terraform placeholder
        env:
          TF_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          echo "::error::Stub. Other project: terraform init (S3 use_lockfile=true; no DynamoDB) && terraform ${TF_ACTION}."
          echo "Must create three subnet tiers; asg-portal+public ALB; asg-rest+internal ALB; asg-haystack+internal ALB."
          echo "asg-neo4j max=1 data subnets; RDS data subnet group only; deletion_protection=false."
          echo "MUST create secret shells heavy-rental/{portal,rest,haystack,neo4j} and empty heavy-rental/ssh/*."
          echo "sync-secrets (next job) must fill required JSON fields or app CD will fail describe-secret."
          echo "This job must not report success until those commands exist."
          exit 1

  sync-secrets:
    name: Sync GitHub secrets to AWS Secrets Manager
    runs-on: ubuntu-latest
    needs: [assert-lab, terraform]
    if: always() && needs.assert-lab.result == 'success' && (inputs.action == 'apply' || inputs.action == 'configure-only') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 10
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: put-secret-value placeholder
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set +x
          echo "REQUIRED fields: portal REST_BASE_URL+pk_; rest POSTGRES_*+HAYSTACK_BASE_URL+Stripe trio; haystack POSTGRES_*+NEO4J_*; neo4j user/password."
          echo "Do NOT write Vocareum AWS keys into Secrets Manager."
          if [ -z "${SPRING_DATASOURCE_PASSWORD}" ]; then
            echo "::error::Set SPRING_DATASOURCE_PASSWORD on GitHub Environment '${{ inputs.aws_environment }}'."
            exit 1
          fi
          echo "::error::Stub. Other project: put-secret-value for heavy-rental/{portal,rest,haystack,neo4j}."
          exit 1

  sync-ssh-keys:
    name: SSH PEMs after EC2 InService
    runs-on: ubuntu-latest
    needs: [assert-lab, terraform]
    if: always() && needs.assert-lab.result == 'success' && (inputs.action == 'apply' || inputs.action == 'configure-only') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 20
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Wait for ASG instances then put SSH PEMs
        run: |
          set +x
          echo "Wait until asg-portal, asg-rest, asg-haystack, asg-neo4j each have an InService instance."
          echo "::error::Stub. Other project: wait for InService then put PEMs."
          exit 1

  ansible:
    name: Ansible (EC2 retrieve AWS Secrets)
    runs-on: ubuntu-latest
    needs: [assert-lab, terraform, sync-secrets, sync-ssh-keys]
    if: always() && needs.assert-lab.result == 'success' && needs.sync-secrets.result == 'success' && needs.sync-ssh-keys.result == 'success' && (inputs.action == 'apply' || inputs.action == 'configure-only') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 30
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/checkout@v4

      - name: Ansible placeholder
        run: |
          echo "On each ASG: get-secret-value of that role's APP secret → .env → compose up (SSM)."
          echo "::error::Stub. Other project: ansible-playbook via SSM (portal /api proxy, §6.4a limits)."
          exit 1

  stop:
    name: Stop lab resources
    runs-on: ubuntu-latest
    needs: [assert-lab]
    if: inputs.action == 'stop'
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 15
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Stop placeholder
        run: |
          echo "stop is pause. That is not terraform destroy."
          echo "::error::Stub. Other project: ASG desired=0 + rds stop-db-instance."
          exit 1

  destroy:
    name: Terraform destroy (all resources in this state)
    runs-on: ubuntu-latest
    needs: [assert-lab]
    if: inputs.action == 'destroy'
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 60
    steps:
      - name: Resolve Vocareum credentials
        env:
          FORM_KEY: ${{ inputs.aws_access_key_id }}
          FORM_SECRET: ${{ inputs.aws_secret_access_key }}
          FORM_TOKEN: ${{ inputs.aws_session_token }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="${FORM_KEY:-${ENV_KEY}}"
          SECRET="${FORM_SECRET:-${ENV_SECRET}}"
          TOKEN="${FORM_TOKEN:-${ENV_TOKEN}}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/checkout@v4

      - name: Require confirm_destroy
        env:
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "destroy" ]; then
            echo "::error::action=destroy requires confirm_destroy=destroy. Refusing to run terraform destroy."
            exit 1
          fi

      - name: Terraform destroy placeholder
        run: |
          set -euo pipefail
          echo "::error::Stub. Other project: terraform destroy -auto-approve against the same remote state as apply."
          exit 1
