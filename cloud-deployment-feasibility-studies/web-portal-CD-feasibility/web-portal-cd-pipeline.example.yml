# Portal app CD (Academy). Not CI. Not terraform apply.
# Copy to: .github/workflows/web-portal-cd-academy.yml
# Order: infra Terraform creates EC2 → infra Ansible first compose
#        → THIS workflow re-runs compose on asg-portal with a new CI nginx image.
# nginx /api → REST_BASE_URL (internal REST ALB). No Vite server. No sk_ on portal.
# Do not put instance IDs or AWS keys on workflow_dispatch.

name: Web Portal CD (Academy)

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy image, reconfigure same image, or health only
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - configure-only
          - verify
      aws_environment:
        description: Must be academy
        required: true
        type: environment
        default: academy
      image_ref:
        description: Optional GHCR tag (empty = latest Release tar or :latest)
        required: false
        type: string
        default: ""

concurrency:
  group: web-portal-cd-academy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-lab:
    name: Assert Vocareum session
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: sts
        run: aws sts get-caller-identity

  discover-targets:
    name: Discover asg-portal
    needs: [assert-lab]
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: ASG InService + SSM Online
        run: |
          set -euo pipefail
          set +x
          ASG=asg-portal
          if ! aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG" \
            --query 'AutoScalingGroups[0].AutoScalingGroupName' \
            --output text | grep -qx "$ASG"; then
            echo "::error::ASG ${ASG} missing. Run infra CD action=apply first."
            exit 1
          fi
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)
          if [ -z "${IDS}" ] || [ "${IDS}" = "None" ]; then
            echo "::error::No InService instance in ${ASG}. Start Lab or infra configure-only."
            exit 1
          fi
          ONLINE=""
          for id in ${IDS}; do
            ping=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${id}" \
              --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' \
              --output text)
            if [ -n "${ping}" ] && [ "${ping}" != "None" ]; then
              ONLINE="${ONLINE} ${ping}"
            fi
          done
          if [ -z "${ONLINE// }" ]; then
            echo "::error::No SSM Online instance. NAT/endpoints or Start Lab."
            exit 1
          fi
          echo "PORTAL_INSTANCE_IDS=${ONLINE}" >> "$GITHUB_ENV"
          echo "Discovered InService+SSM hosts (ids only, no public IPs)."

  resolve-image:
    name: Resolve CI image
    needs: [assert-lab]
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 10
    steps:
      - name: Image placeholder
        run: |
          echo "image_ref='${{ inputs.image_ref }}'"
          echo "Download portal Release tar or GHCR nginx+dist image. Do not npm run build / docker build."
          echo "::error::Stub. Other project: resolve CI nginx+dist tar/GHCR."
          exit 1

  ansible-portal:
    name: Compose playbook on asg-portal
    needs: [assert-lab, discover-targets, resolve-image]
    if: always() && needs.assert-lab.result == 'success' && needs.discover-targets.result == 'success' && (inputs.action == 'deploy' || inputs.action == 'configure-only') && (needs.resolve-image.result == 'success' || needs.resolve-image.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Compose placeholder
        run: |
          echo "SSM to PORTAL_INSTANCE_IDS. get-secret-value heavy-rental/portal."
          echo "Write nginx location /api → REST_BASE_URL (internal REST ALB). Fail if REST_BASE_URL empty."
          echo "compose nginx :80 mem_limit 256m cpus 0.5. Leave 256-512m for OS/SSM/Docker."
          echo "No vite. No sk_ / whsec_ on this host. pk_ only if SPA needs runtime config.json."
          echo "::error::Stub. Other project: SSM compose on asg-portal with /api proxy."
          exit 1

  verify:
    name: Health
    needs: [assert-lab, discover-targets, ansible-portal]
    if: always() && needs.assert-lab.result == 'success' && needs.discover-targets.result == 'success' && (needs.ansible-portal.result == 'success' || needs.ansible-portal.result == 'skipped' || inputs.action == 'verify')
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Verify placeholder
        run: |
          echo "SSM curl 127.0.0.1:80/ (SPA index.html). Do not fail solely because /api (REST) is down."
          echo "Optional: print public portal ALB DNS only — never instance IPs or REST_BASE_URL."
          echo "::error::Stub. Other project: SSM health on :80."
          exit 1
