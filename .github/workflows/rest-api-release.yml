# =============================================================================
# Heavy Rental Spring REST API — Release CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration is highest priority):
#   1. Integration      (HIGHEST) checkout, Java 21 + Maven, resolve deps, layout
#   2. Quality Control  needs Integration — compile, tests (Postgres), package WAR
#   3. Security Testing needs Integration — SAST (Semgrep) + SCA/FS (Trivy)
#   4. CodeQL Analysis  needs Integration — GitHub CodeQL (Java) security + quality
#   5. Packaging        needs Integration + QC + Security + CodeQL — versioned WAR +
#                       Docker image (tar artifact; push to GHCR when not a PR)
#
# Security report format (standard): SARIF 2.1.0
#   - Semgrep → semgrep.sarif
#   - Trivy FS → trivy-fs.sarif
#   - CodeQL → GitHub Code Scanning (native SARIF via analyze)
# Human-readable console output is for gates/logs only, not the report standard.
#
# GitHub Flow (https://docs.github.com/en/get-started/using-github/github-flow)
# --------------------------------------------------------------------------
# Invoked via rest-api-release-caller.yml when:
#   - a GitHub Release is published, or
#   - a pull request is opened/updated from develop → master
# Feature-branch PR validation remains rest-api-ci-caller.yml (Integration first).
#
#   feature → develop (CI) → PR develop→master and/or publish GitHub Release
#     → this pipeline
#
# Same gates as integration-pipeline.yml (Java 21, Maven, local Docker
# Postgres, Semgrep, Trivy), plus Packaging for deploy consumers.
#
# Packaging output (Spring Boot WAR + container image for deploy):
#   ./mvnw -DskipTests package → target/*.war (preferred; jar fallback)
#   Versioned + stable WAR copies for overall-project-deploy
#   Docker image (Tomcat 10.1 + JDK 21) with WAR as ROOT.war
#   Image saved as gzipped tar artifact; also pushed to GHCR outside PRs
#
# Application:
#   https://github.com/SA62-team1/heavy-rental-spring-rest-api
#   Spring Boot 4.x · Java 21 · Maven (mvnw) · PostgreSQL · WAR packaging
#
# How the REST API uses this on release
# -------------------------------------
# Install both files into the Spring REST API repository:
#
#   .github/workflows/release-pipeline.yml         ← this file (reusable only)
#   .github/workflows/rest-api-release-caller.yml  ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than rest-api-release-caller.yml.
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/release-pipeline.yml
#
# Also mirrored in the pipeline-development repo for discovery/testing:
#   .github/workflows/rest-api-release.yml
# Keep this file and that mirror in sync when developing here.
#
# Local validation (pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-rest-api/release-pipeline/release-pipeline.yml
#   actionlint .github/workflows/rest-api-release.yml
#
# Quality Control uses environment: production (hardcoded) and explicit secrets map.
#
# Names (exact match, same as Integration CI):
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
#
# REST_API_DB_URL is NOT required. After Start PostgreSQL, QC builds:
#   jdbc:postgresql://localhost:<PORT>/<NAME>
# These start a local Docker Postgres for tests. They are not Academy RDS.
# Caller must use explicit secrets map. Do not set environment: on the caller uses: job.
# =============================================================================

name: REST API Release CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/rest-api-release-caller.yml (enforced below).
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required when the REST API invokes this workflow).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for release / develop→master PR.
        required: false
        type: string
        default: ""
      github_environment:
        description: >
          GitHub Environment name for the Quality Control job (default production).
        required: false
        type: string
        default: production
    secrets:
      REST_API_DB_NAME:
        description: PostgreSQL database name (local Docker QC)
        required: false
      REST_API_DB_USER:
        description: PostgreSQL username
        required: false
      REST_API_DB_PASSWORD:
        description: PostgreSQL password
        required: false
      REST_API_DB_PORT:
        description: Host port for CI Postgres container
        required: false
      # REST_API_DB_URL is derived after Docker Postgres starts (not a secret)

# One run per release tag or develop→master PR; do not cancel in-flight packaging
concurrency:
  group: rest-api-release-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for github/codeql-action/upload-sarif (Security stage → Code Scanning)
  security-events: write
  actions: read
  # Required to push the packaging Docker image to GHCR (non-PR runs)
  packages: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: SA62-team1/heavy-rental-spring-rest-api
  DEFAULT_APP_REF: master
  # Docker image naming (Tomcat hosts the Spring Boot WAR)
  IMAGE_NAME: heavy-rental-rest-api
  TOMCAT_BASE_IMAGE: tomcat:10.1-jdk21-temurin
  # Non-sensitive Spring/JPA settings only — credentials come from GitHub Secrets
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.wagon.http.retryHandler.count=3"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only rest-api-release-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only rest-api-release-caller.yml
        env:
          # github context is that of the caller workflow for reusable workflows
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/rest-api-release-caller.yml@*)
              echo "Allowed caller: rest-api-release-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`rest-api-release-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::release-pipeline.yml may only be invoked by .github/workflows/rest-api-release-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration — HIGHEST PRIORITY (release never packages without this)
  #    Quality, Security, and Packaging all depend on Integration succeeding.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 20
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="${INPUT_REF:-${DEFAULT_APP_REF_VALUE}}"
            MODE=remote
          else
            # Same-repo caller: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="${INPUT_REF:-${GH_SHA}}"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (release / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "Using Maven Wrapper (./mvnw)"
          else
            echo "::error::mvnw not found — this pipeline expects the Maven Wrapper in the REST API repo."
            exit 1
          fi

      - name: Resolve Maven dependencies
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp dependency:resolve dependency:resolve-plugins

      - name: Verify project layout and toolchain
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Java / Maven versions"
          java -version
          ./mvnw -v
          echo "==> Required files"
          test -f pom.xml
          test -f mvnw
          test -d src/main/java
          test -d src/main/resources
          echo "==> Packaging from pom.xml"
          PACKAGING="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.packaging)"
          ARTIFACT="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAVA_PROP="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=java.version || true)"
          echo "artifactId=$ARTIFACT version=$VERSION packaging=$PACKAGING java.version=$JAVA_PROP"
          {
            echo "### Integration checks"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`$ARTIFACT\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Packaging | \`$PACKAGING\` |"
            echo "| Java (pom) | \`$JAVA_PROP\` |"
            echo "| Runner Java | \`${{ env.JAVA_VERSION }}\` (${{ env.JAVA_DISTRIBUTION }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integration checks passed."

      - name: Upload Maven project fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: release-integration-metadata
          path: |
            ${{ env.APP_PATH }}/pom.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Quality control — compile, test (with PostgreSQL), package WAR
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration]
    # Hardcoded Environment name (reliable for Environment secrets).
    # Also receives repository secrets via explicit secrets map from the caller.
    environment: production
    timeout-minutes: 30
    steps:
      - name: Verify required database secrets are configured
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          echo "Quality Control secrets source: GitHub Environment 'production' and/or repository secrets (via explicit secrets map)."
          missing=()
          [ -n "${REST_API_DB_NAME}" ] || missing+=(REST_API_DB_NAME)
          [ -n "${REST_API_DB_USER}" ] || missing+=(REST_API_DB_USER)
          [ -n "${REST_API_DB_PASSWORD}" ] || missing+=(REST_API_DB_PASSWORD)
          [ -n "${REST_API_DB_PORT}" ] || missing+=(REST_API_DB_PORT)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo ""
            echo "Configure in the APPLICATION repository (where this workflow runs):"
            echo "  1) Settings → Environments → production → Environment secrets"
            echo "     OR"
            echo "  2) Settings → Secrets and variables → Actions → Repository secrets"
            echo ""
            echo "Required names (exact, case-sensitive):"
            echo "  REST_API_DB_NAME, REST_API_DB_USER, REST_API_DB_PASSWORD, REST_API_DB_PORT"
            echo "  (REST_API_DB_URL is optional — built after Docker Postgres starts)"
            echo ""
            echo "Caller must include: explicit secrets map"
            echo "This job uses: environment: production"
            exit 1
          fi
          if ! [[ "${REST_API_DB_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::REST_API_DB_PORT must be a numeric TCP port."
            exit 1
          fi
          echo "All required database secrets are present (values not logged)."

      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./mvnw

      - name: Start PostgreSQL (Docker; credentials and port from secrets)
        id: dburl
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          docker rm -f rest-api-release-postgres >/dev/null 2>&1 || true
          docker run -d --name rest-api-release-postgres \
            -e POSTGRES_DB="${REST_API_DB_NAME}" \
            -e POSTGRES_USER="${REST_API_DB_USER}" \
            -e POSTGRES_PASSWORD="${REST_API_DB_PASSWORD}" \
            -p "${REST_API_DB_PORT}:5432" \
            postgres:16-alpine

          JDBC_URL="jdbc:postgresql://localhost:${REST_API_DB_PORT}/${REST_API_DB_NAME}"
          {
            echo "REST_API_DB_URL=${JDBC_URL}"
            echo "REST_API_DB_NAME=${REST_API_DB_NAME}"
            echo "REST_API_DB_USER=${REST_API_DB_USER}"
            echo "REST_API_DB_PORT=${REST_API_DB_PORT}"
          } >> "$GITHUB_ENV"

          echo "PostgreSQL container started."
          echo "Derived REST_API_DB_URL=jdbc:postgresql://localhost:${REST_API_DB_PORT}/<db> (password not in URL)."

      - name: Wait for PostgreSQL
        env:
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
        run: |
          set -euo pipefail
          PORT="${REST_API_DB_PORT}"
          for i in $(seq 1 30); do
            if docker exec rest-api-release-postgres pg_isready -U "${REST_API_DB_USER}" >/dev/null 2>&1; then
              echo "PostgreSQL is accepting connections on localhost:${PORT}"
              exit 0
            fi
            if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${PORT}" 2>/dev/null; then
              :
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time on the configured port"
          docker logs rest-api-release-postgres 2>&1 | tail -n 50 || true
          exit 1

      - name: Compile (main + test sources)
        working-directory: ${{ env.APP_PATH }}
        run: ./mvnw -B -ntp -DskipTests compile test-compile

      - name: Unit and Spring Boot tests
        working-directory: ${{ env.APP_PATH }}
        env:
          # Spring Boot binds these env vars automatically — do not pass passwords
          # on the Maven CLI (would appear in process listings).
          # REST_API_DB_URL was built after Start PostgreSQL and written to GITHUB_ENV.
          SPRING_DATASOURCE_URL: ${{ env.REST_API_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.REST_API_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${{ env.SPRING_DATASOURCE_DRIVER_CLASS_NAME }}
          SPRING_JPA_DATABASE_PLATFORM: ${{ env.SPRING_JPA_DATABASE_PLATFORM }}
        run: |
          set -euo pipefail
          if [ -z "${REST_API_DB_URL:-}" ]; then
            echo "::error::REST_API_DB_URL is empty — Start PostgreSQL must export it via GITHUB_ENV."
            exit 1
          fi
          echo "Running tests with SPRING_DATASOURCE_URL derived from Docker Postgres (password not logged)."
          mkdir -p "${{ github.workspace }}/test-reports"
          ./mvnw -B -ntp test
          # Collect surefire / failsafe reports when present
          if [ -d target/surefire-reports ]; then
            cp -a target/surefire-reports "${{ github.workspace }}/test-reports/" || true
          fi
          if [ -d target/failsafe-reports ]; then
            cp -a target/failsafe-reports "${{ github.workspace }}/test-reports/" || true
          fi

      - name: Package WAR (skip re-running tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests package
          echo "==> Build artifacts"
          ls -lah target/ || true
          WAR_COUNT="$(find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) | wc -l | tr -d ' ')"
          if [ "${WAR_COUNT}" -lt 1 ]; then
            echo "::error::No .war/.jar produced under target/ after package"
            exit 1
          fi
          find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) -ls
          {
            echo "### Quality control"
            echo ""
            echo "Compile, tests, and package completed successfully."
            echo ""
            echo "Artifacts:"
            echo '```'
            find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) -printf '%f (%s bytes)\n' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          docker rm -f rest-api-release-postgres >/dev/null 2>&1 || true
          echo "PostgreSQL container stopped."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-test-reports
          path: |
            test-reports/
            ${{ env.APP_PATH }}/target/surefire-reports/
            ${{ env.APP_PATH }}/target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-release-build
          path: |
            ${{ env.APP_PATH }}/target/*.war
            ${{ env.APP_PATH }}/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Security testing — SAST (Semgrep) + SCA / filesystem (Trivy)
  # ---------------------------------------------------------------------------
  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    # Highest-priority gate: never start Security unless Integration passed
    needs: [integration]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Create security reports directory
        run: mkdir -p "${{ github.workspace }}/security-reports"

      # --- SAST: static analysis (standard report format: SARIF) ---
      - name: Setup Python (Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: SAST — Semgrep (Java / OWASP) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${{ github.workspace }}/security-reports"
          # p/spring was removed from the Semgrep registry (HTTP 404).
          # Community packs: Java/OWASP/CWE plus secrets, injection, JWT, TLS.
          # Custom rules catch plaintext credentials in Spring properties/YAML
          # that p/secrets and p/gitleaks miss (generic passwords, not tokens).
          RULES_FILE="${REPORT_DIR}/semgrep-custom-rules.yml"
          cat > "${RULES_FILE}" << 'SEMGREP_CUSTOM_RULES'
          rules:
            - id: heavy-rental.rest-api.hardcoded-credential-in-properties
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in a properties/env file (CWE-798). Use
                ${ENV_VAR} or a secrets manager. A plaintext password, secret,
                token, or API key in application.properties is a shipping secret.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [spring, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.env"
                  - "*.ini"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*=[ \t]*(?!\$\{)(?!ENC\()(?!\{cipher\})(?![ \t]*(?:#|$))[^\s#]+
            - id: heavy-rental.rest-api.hardcoded-credential-in-yaml
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in YAML config (CWE-798). Use ${ENV_VAR}
                or a secrets manager instead of a plaintext password or secret.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [spring, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/.github/**"
              pattern-regex: >-
                (?i)^[ \t-]*["']?(?:[A-Za-z0-9._-]*[\._-])?(password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)["']?[ \t]*:[ \t]*(?!\$\{)(?!~)(?!null\b)(?!ENC\()(?!\{cipher\})(?!["']?[ \t]*(?:#|$))["']?[^\s#"']+
            - id: heavy-rental.rest-api.env-placeholder-plaintext-default
              languages: [regex]
              severity: ERROR
              message: >
                Spring ${VAR:default} placeholder embeds a plaintext credential
                default (CWE-798). Empty defaults (${VAR:} or ${VAR}) are OK;
                a literal fallback password is not.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [spring, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: MEDIUM
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                  - "*.env"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*[=:][ \t]*\$\{[^}:]+:(?![ \t]*\})[^}]+\}
            - id: heavy-rental.rest-api.jdbc-url-embedded-credentials
              languages: [regex]
              severity: ERROR
              message: >
                JDBC URL embeds user:password@host (CWE-798). Use a URL without
                credentials and set username/password from environment variables.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [java, jdbc, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                  - "*.xml"
                  - "*.java"
                  - "*.env"
                exclude:
                  - "**/src/test/**"
              pattern-regex: >-
                (?i)jdbc:[a-z0-9]+://[^/\s:]+:[^@/\s]+@
            - id: heavy-rental.rest-api.java-hardcoded-secret-assignment
              languages: [java]
              severity: ERROR
              message: >
                Hard-coded credential assigned in Java source (CWE-798). Inject
                the value from the environment or a secrets manager.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [java, secrets]
                confidence: MEDIUM
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                exclude:
                  - "**/src/test/**"
                  - "**/*Test.java"
                  - "**/*Tests.java"
              patterns:
                - pattern-either:
                    - pattern: $TYPE $VAR = "$VAL";
                    - pattern: $VAR = "$VAL";
                - metavariable-regex:
                    metavariable: $VAR
                    regex: (?i).*(password|passwd|secret|api[_]?key|token|credential).*
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?!\$\{).{3,}
            - id: heavy-rental.rest-api.java-setpassword-hardcoded
              languages: [java]
              severity: ERROR
              message: >
                Hard-coded password passed to a setter (CWE-798). Load it from
                the environment or a secrets manager.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [java, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                exclude:
                  - "**/src/test/**"
                  - "**/*Test.java"
                  - "**/*Tests.java"
              patterns:
                - pattern-either:
                    - pattern: $OBJ.setPassword("$VAL");
                    - pattern: $OBJ.password("$VAL");
                    - pattern: DriverManager.getConnection($URL, $USER, "$VAL");
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?!\$\{).{1,}
            - id: heavy-rental.rest-api.spring-actuator-fully-exposed
              languages: [regex]
              severity: ERROR
              message: >
                Spring Boot Actuator exposes all endpoints (include=*). Restrict
                to health/info; /actuator/env and /heapdump leak secrets.
              metadata:
                category: security
                cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
                owasp: ["A05:2021 - Security Misconfiguration"]
                technology: [java, spring]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: MEDIUM
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
              pattern-regex: >-
                (?i)management\.endpoints\.web\.exposure\.include\s*[=:]\s*["']?\*
            - id: heavy-rental.rest-api.spring-security-disabled
              languages: [regex]
              severity: ERROR
              message: >
                Spring Security is disabled (spring.security.enabled=false).
                That opens every endpoint. Remove the flag from non-test config.
              metadata:
                category: security
                cwe: ["CWE-284: Improper Access Control"]
                owasp: ["A01:2021 - Broken Access Control"]
                technology: [java, spring]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: MEDIUM
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
              pattern-regex: >-
                (?i)spring\.security\.enabled\s*[=:]\s*["']?false
          SEMGREP_CUSTOM_RULES
          sed -i 's/^          //' "${RULES_FILE}"
          echo "==> Validating custom Semgrep rules"
          semgrep --validate --config="${RULES_FILE}" --metrics=off
          SEMGREP_COMMON=(
            --config=p/java
            --config=p/owasp-top-ten
            --config=p/security-audit
            --config=p/secrets
            --config=p/cwe-top-25
            --config=p/findsecbugs
            --config=p/gitleaks
            --config=p/sql-injection
            --config=p/jwt
            --config=p/insecure-transport
            --config="${RULES_FILE}"
            --metrics=off
          )

          # --- Pass 1: always write SARIF (standard report). Does not fail the step. ---
          echo "==> Semgrep report (SARIF 2.1.0)"
          set +e
          semgrep scan "${SEMGREP_COMMON[@]}" \
            --sarif \
            --output="${REPORT_DIR}/semgrep.sarif" \
            .
          SARIF_RC=$?
          set -e
          if [ -f "${REPORT_DIR}/semgrep.sarif" ]; then
            echo "SARIF written: ${REPORT_DIR}/semgrep.sarif (semgrep exit=${SARIF_RC}; non-zero is OK for report pass)"
          else
            echo "::warning::semgrep.sarif was not produced (exit=${SARIF_RC})"
          fi

          # --- Pass 2: CI gate — fail only if ERROR-severity findings exist. ---
          echo "==> SAST gate (ERROR severity only; exit 1 if findings)"
          set +e
          semgrep scan "${SEMGREP_COMMON[@]}" \
            --severity=ERROR \
            --error \
            --text \
            .
          GATE_RC=$?
          set -e
          if [ "${GATE_RC}" -ne 0 ]; then
            echo "::error::Semgrep SAST gate failed (exit=${GATE_RC})."
            echo "The SARIF report may still have been written successfully."
            echo "This step fails because --severity=ERROR --error found ERROR-level issues"
            echo "(or Semgrep could not complete the gate scan)."
            echo "Open security-reports/semgrep.sarif or the text findings above."
            exit "${GATE_RC}"
          fi
          echo "SAST (Semgrep) gate passed — no ERROR-level findings. SARIF: security-reports/semgrep.sarif"

      # --- SCA + filesystem: dependency and secret/vuln scan via Trivy (SARIF) ---
      - name: Setup Java ${{ env.JAVA_VERSION }} (for dependency resolution before scan)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Resolve dependencies for SCA coverage
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          # Materialize the local .m2 / target dependency graph Trivy can inspect
          ./mvnw -B -ntp -DskipTests dependency:resolve dependency:copy-dependencies \
            -DoutputDirectory=target/dependency || \
          ./mvnw -B -ntp -DskipTests dependency:resolve

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: security-reports/trivy-fs.sarif
          ignore-unfixed: true

      - name: Trivy filesystem scan (console table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          ignore-unfixed: true

      # --- Publish SARIF security reports to GitHub Code Scanning ---
      - name: Upload Semgrep SARIF to Code Scanning
        if: always() && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: rest-api-release-semgrep
        continue-on-error: true

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('security-reports/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/trivy-fs.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: rest-api-release-trivy-fs
        continue-on-error: true

      - name: Upload security reports (SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-reports-sarif
          path: |
            security-reports/*.sarif
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 4. CodeQL analysis — GitHub CodeQL for Java (security + quality queries)
  #    Runs after Integration; parallel with QC and Semgrep/Trivy Security.
  #    Results appear under the repository Security → Code scanning alerts.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Initialize CodeQL (Java)
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          source-root: ${{ env.APP_PATH }}
          # security-and-quality: security rules + maintainability / reliability
          queries: security-and-quality

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Build for CodeQL (Maven; skip tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          # CodeQL instruments this compile/package build for analysis
          ./mvnw -B -ntp -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "rest-api-release-codeql-java"

      - name: CodeQL summary
        if: always()
        run: |
          {
            echo "### CodeQL Analysis"
            echo ""
            echo "Language: Java/Kotlin"
            echo "Query suite: security-and-quality"
            echo "Category: rest-api-release-codeql-java"
            echo ""
            echo "View results: repository → Security → Code scanning alerts"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Packaging — production WAR + Docker image for deploy pipelines
  # ---------------------------------------------------------------------------
  # Spring Boot WAR deploy model:
  #   - build: ./mvnw -B -ntp -DskipTests package
  #   - artifact under target/: *.war (packaging=war) or executable *.jar
  #   - deploy unit: versioned binary + stable name for overall-project-deploy
  # Docker image deploy model:
  #   - base: tomcat:10.1-jdk21-temurin (matches Spring Boot 4 / Jakarta EE)
  #   - WAR copied to /usr/local/tomcat/webapps/ROOT.war
  #   - image saved as .tar.gz artifact; pushed to GHCR outside pull requests
  # Do not ship source trees or the local .m2 cache.
  # ---------------------------------------------------------------------------
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    # Integration first; packaging waits for QC, Security, and CodeQL
    needs: [integration, quality-control, security-testing, codeql]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Write datasource env template
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          LOCAL_JDBC="jdbc:postgresql://localhost:${REST_API_DB_PORT}/${REST_API_DB_NAME}"
          mkdir -p "${GITHUB_WORKSPACE}/release-deploy-config"
          {
            echo "# Generated by rest-api release packaging — local QC JDBC (no password)."
            echo "# Guest compose reads heavy-rental/rest (infra sync-secrets)."
            echo "SPRING_DATASOURCE_URL=${LOCAL_JDBC}"
            echo "SPRING_DATASOURCE_USERNAME=${REST_API_DB_USER}"
            echo "SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver"
            echo "SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect"
            echo "# Set SPRING_DATASOURCE_PASSWORD and replace URL from Secrets Manager at deploy."
          } > "${GITHUB_WORKSPACE}/release-deploy-config/spring-datasource.env"
          {
            echo "### Datasource env artifact"
            echo ""
            echo "Localhost QC URL from \`REST_API_DB_*\` (no password). Academy CD does not use this file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload datasource env template
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-release-cloud-datasource
          path: release-deploy-config/
          retention-days: 14
          if-no-files-found: error

      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./mvnw

      - name: Production package (WAR, skip re-running tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests package
          echo "==> target/ after package"
          ls -lah target/ || true

      - name: Verify and stage release package (WAR)
        id: package
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          ARTIFACT_ID="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          PACKAGING="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.packaging)"
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          RUN_ID="${{ github.run_number }}"

          # Prefer primary packaging type from pom (war); fall back to jar.
          BUILD_FILE=""
          if [ "${PACKAGING}" = "war" ]; then
            BUILD_FILE="$(find target -maxdepth 1 -type f -name '*.war' ! -name '*-sources.war' ! -name '*-javadoc.war' | head -n 1 || true)"
            if [ -z "${BUILD_FILE}" ]; then
              echo "::error::pom packaging is war but no deployable .war found under target/"
              ls -lah target/ || true
              exit 1
            fi
          fi
          if [ -z "${BUILD_FILE}" ]; then
            BUILD_FILE="$(find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) \
              ! -name '*-sources.*' ! -name '*-javadoc.*' ! -name '*-plain.jar' | head -n 1 || true)"
          fi
          if [ -z "${BUILD_FILE}" ] || [ ! -f "${BUILD_FILE}" ]; then
            echo "::error::No deployable .war/.jar found under target/ after package"
            ls -lah target/ || true
            exit 1
          fi

          EXT="${BUILD_FILE##*.}"
          # Relative path for Docker COPY (build context = APP_PATH)
          BUILD_FILE_REL="${BUILD_FILE#./}"
          VERSIONED_NAME="heavy-rental-rest-api-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.${EXT}"
          STABLE_NAME="heavy-rental-rest-api.${EXT}"
          VERSIONED_PATH="${{ github.workspace }}/${VERSIONED_NAME}"
          STABLE_PATH="${{ github.workspace }}/${STABLE_NAME}"

          cp "${BUILD_FILE}" "${VERSIONED_PATH}"
          cp "${BUILD_FILE}" "${STABLE_PATH}"

          # Fail packaging if staged WAR is empty or missing
          if [ ! -s "${VERSIONED_PATH}" ] || [ ! -s "${STABLE_PATH}" ]; then
            echo "::error::Staged release package is missing or empty"
            exit 1
          fi

          file "${VERSIONED_PATH}" || true
          ls -lh "${VERSIONED_PATH}" "${STABLE_PATH}" "${BUILD_FILE}"

          IMAGE_TAG="v${VERSION}-build${RUN_ID}-${SHORT_SHA}"
          IMAGE_LOCAL="${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          IMAGE_LOCAL_LATEST="${{ env.IMAGE_NAME }}:latest"
          IMAGE_REMOTE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          IMAGE_REMOTE_LATEST="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          IMAGE_TAR="heavy-rental-rest-api-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.tar.gz"

          {
            echo "version=${VERSION}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "packaging=${PACKAGING}"
            echo "ext=${EXT}"
            echo "short_sha=${SHORT_SHA}"
            echo "versioned_name=${VERSIONED_NAME}"
            echo "stable_name=${STABLE_NAME}"
            echo "build_file=${BUILD_FILE}"
            echo "build_file_rel=${BUILD_FILE_REL}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_local=${IMAGE_LOCAL}"
            echo "image_local_latest=${IMAGE_LOCAL_LATEST}"
            echo "image_remote=${IMAGE_REMOTE}"
            echo "image_remote_latest=${IMAGE_REMOTE_LATEST}"
            echo "image_tar=${IMAGE_TAR}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload target WAR/JAR build outputs
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-release-target
          path: |
            ${{ env.APP_PATH }}/target/*.war
            ${{ env.APP_PATH }}/target/*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload versioned release package (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-release-package
          path: |
            ${{ github.workspace }}/${{ steps.package.outputs.versioned_name }}
            ${{ github.workspace }}/${{ steps.package.outputs.stable_name }}
          retention-days: 14
          if-no-files-found: error

      # -------------------------------------------------------------------
      # Docker image: Tomcat + packaged WAR for deployment
      # Uses app Dockerfile when present; otherwise generates a WAR-based one.
      # -------------------------------------------------------------------
      - name: Prepare Dockerfile for WAR image
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          WAR_REL="${{ steps.package.outputs.build_file_rel }}"
          if [ ! -f "${WAR_REL}" ]; then
            echo "::error::WAR for Docker build not found: ${WAR_REL}"
            exit 1
          fi

          if [ -f Dockerfile ]; then
            echo "Using Dockerfile from application repository"
          else
            echo "No app Dockerfile found — generating Tomcat WAR Dockerfile"
            # App is packaging=war with tomcat provided → external Tomcat image
            {
              echo "# Generated by rest-api release packaging (Spring Boot WAR → Tomcat)"
              echo "FROM ${{ env.TOMCAT_BASE_IMAGE }}"
              echo "LABEL org.opencontainers.image.title=\"${{ env.IMAGE_NAME }}\""
              echo "LABEL org.opencontainers.image.description=\"Heavy Rental Spring REST API (WAR on Tomcat)\""
              echo "LABEL org.opencontainers.image.source=\"https://github.com/${{ needs.integration.outputs.app_repository }}\""
              echo "LABEL org.opencontainers.image.revision=\"${{ steps.package.outputs.short_sha }}\""
              echo "LABEL org.opencontainers.image.version=\"${{ steps.package.outputs.version }}\""
              echo ""
              echo "# Clear default Tomcat apps; deploy API as root context"
              echo "RUN rm -rf /usr/local/tomcat/webapps/*"
              echo ""
              echo "COPY ${WAR_REL} /usr/local/tomcat/webapps/ROOT.war"
              echo ""
              echo "EXPOSE 8080"
              echo 'CMD ["catalina.sh", "run"]'
            } > Dockerfile
          fi

          echo "==> Dockerfile"
          cat Dockerfile
          echo "==> WAR for image: ${WAR_REL} ($(wc -c < "${WAR_REL}") bytes)"

      - name: Build Docker image
        id: docker
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${{ steps.package.outputs.image_local }}"
          IMAGE_LOCAL_LATEST="${{ steps.package.outputs.image_local_latest }}"
          IMAGE_REMOTE="${{ steps.package.outputs.image_remote }}"
          IMAGE_REMOTE_LATEST="${{ steps.package.outputs.image_remote_latest }}"

          docker build \
            --pull \
            -t "${IMAGE_LOCAL}" \
            -t "${IMAGE_LOCAL_LATEST}" \
            -t "${IMAGE_REMOTE}" \
            -t "${IMAGE_REMOTE_LATEST}" \
            .

          echo "==> Images built"
          docker images "${{ env.IMAGE_NAME }}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          docker images "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true

          # Export image for deploy pipelines that load from artifact (no registry required)
          TAR_PATH="${{ github.workspace }}/${{ steps.package.outputs.image_tar }}"
          docker save "${IMAGE_LOCAL}" | gzip -c > "${TAR_PATH}"
          ls -lh "${TAR_PATH}"
          if [ ! -s "${TAR_PATH}" ]; then
            echo "::error::Docker image tar is missing or empty: ${TAR_PATH}"
            exit 1
          fi

          {
            echo "image_id=$(docker image inspect -f '{{.Id}}' "${IMAGE_LOCAL}")"
            echo "tar_path=${TAR_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-release-docker-image
          path: ${{ github.workspace }}/${{ steps.package.outputs.image_tar }}
          retention-days: 14
          if-no-files-found: error

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${{ steps.package.outputs.image_remote }}"
          docker push "${{ steps.package.outputs.image_remote_latest }}"
          echo "Pushed:"
          echo "  ${{ steps.package.outputs.image_remote }}"
          echo "  ${{ steps.package.outputs.image_remote_latest }}"

      - name: Packaging summary
        run: |
          {
            echo "### Packaging complete (Spring Boot REST API)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Application | \`${{ needs.integration.outputs.app_repository }}\` |"
            echo "| Ref | \`${{ needs.integration.outputs.app_ref }}\` |"
            echo "| ArtifactId | \`${{ steps.package.outputs.artifact_id }}\` |"
            echo "| Version | \`${{ steps.package.outputs.version }}\` |"
            echo "| Packaging | \`${{ steps.package.outputs.packaging }}\` |"
            echo "| Commit | \`${{ steps.package.outputs.short_sha }}\` |"
            echo "| Versioned WAR | \`${{ steps.package.outputs.versioned_name }}\` |"
            echo "| Stable WAR | \`${{ steps.package.outputs.stable_name }}\` |"
            echo "| Docker image (local) | \`${{ steps.package.outputs.image_local }}\` |"
            echo "| Docker image (GHCR) | \`${{ steps.package.outputs.image_remote }}\` |"
            echo "| Image archive | \`${{ steps.package.outputs.image_tar }}\` |"
            echo "| Image ID | \`${{ steps.docker.outputs.image_id }}\` |"
            echo "| Artifacts | \`rest-api-release-target\`, \`rest-api-release-package\`, \`rest-api-release-docker-image\` |"
            echo ""
            echo "### Deploy options"
            echo ""
            echo "1. **WAR** — download \`rest-api-release-package\` and deploy \`.${{ steps.package.outputs.ext }}\` to a servlet container."
            echo "2. **Image archive** — \`docker load < ${{ steps.package.outputs.image_tar }}\` then run \`${{ steps.package.outputs.image_local }}\`."
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "3. **GHCR** — \`docker pull ${{ steps.package.outputs.image_remote }}\` (also tagged \`:latest\`)."
            else
              echo "3. **GHCR** — push skipped on pull_request; image is available as the tar artifact only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
